<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <meta name="theme-color" content="#303030" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <title>Bluestar Unilink Menetrend</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root {
      --bg: #303030;
      --top: #858585;
      --top2: #777;
      --black: #0a0a0a;
      --panel: #303030;
      --panel2: #363636;
      --line: #494949;
      --text: #f1f1f1;
      --muted: #c8c8c8;
      --muted2: #a8a8a8;
      --blue: #22aeea;
      --blue2: #178ac6;
      --live: #34ee3e;
      --red: #ff4c4c;
      --warn: #ffd34d;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      font-size: 16px;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      overflow-x: hidden;
    }

    button,
    input {
      font: inherit;
    }

    .app {
      width: 100%;
      min-height: 100vh;
      background: var(--bg);
    }

    .topbar {
      height: 58px;
      background: var(--top);
      color: #fff;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 14px;
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: 0 1px 0 rgba(255,255,255,.12);
    }

    .top-btn {
      border: 0;
      background: transparent;
      color: #fff;
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      font-size: 28px;
      line-height: 1;
      cursor: pointer;
      flex: 0 0 auto;
    }

    .title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      min-width: 0;
    }

    .lang-switch {
      display: flex;
      align-items: center;
      gap: 4px;
      flex: 0 0 auto;
    }

    .flag-btn {
      width: 32px;
      height: 28px;
      border: 0;
      border-radius: 6px;
      background: rgba(0,0,0,.22);
      color: white;
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      opacity: .65;
    }

    .flag-btn.active {
      opacity: 1;
      outline: 2px solid #fff;
    }

    .statusbar {
      height: 36px;
      background: #090909;
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 0 12px;
      font-size: 18px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #f2f2f2;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 999px;
      background: var(--live);
      box-shadow: 0 0 10px var(--live);
      flex: 0 0 auto;
    }

    .dot.bad {
      background: var(--red);
      box-shadow: 0 0 8px var(--red);
    }

    .main {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
    }

    .search-box-wrap {
      padding: 14px 12px 10px;
    }

    .search-box {
      border: 2px solid #4b90ff;
      border-radius: 4px;
      min-height: 58px;
      display: flex;
      align-items: center;
      padding: 0 10px;
      position: relative;
      background: #2e2e2e;
    }

    .search-label {
      position: absolute;
      top: -13px;
      left: 16px;
      background: var(--bg);
      color: #4b90ff;
      padding: 0 6px;
      font-size: 16px;
    }

    .search-icon {
      font-size: 28px;
      color: #ddd;
      margin-right: 10px;
      flex: 0 0 auto;
    }

    .search-input {
      border: 0;
      outline: 0;
      background: transparent;
      color: #fff;
      min-width: 0;
      flex: 1;
      font-size: 24px;
      height: 52px;
    }

    .clear-btn {
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 999px;
      background: #d7d7d7;
      color: #333;
      font-size: 28px;
      font-weight: 800;
      cursor: pointer;
      flex: 0 0 auto;
    }

    .blue-header {
      background: #3b7fd8;
      color: #fff;
      padding: 8px 12px;
      font-size: 20px;
      font-weight: 800;
      line-height: 1.25;
    }

    .section-title {
      padding: 18px 18px 8px;
      font-size: 28px;
      font-weight: 850;
      color: #eee;
    }

    .row {
      min-height: 82px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 12px;
      cursor: pointer;
      overflow: hidden;
    }

    .row:hover {
      background: rgba(255,255,255,.03);
    }

    .row-main {
      flex: 1;
      min-width: 0;
      overflow: hidden;
    }

    .row-title {
      font-size: 22px;
      line-height: 1.12;
      font-weight: 850;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .row-sub {
      font-size: 17px;
      line-height: 1.25;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    .arrow {
      color: #fff;
      font-size: 26px;
      opacity: .9;
      flex: 0 0 auto;
      padding-left: 4px;
    }

    .badge {
      width: 86px;
      height: 50px;
      border-radius: 3px;
      background: linear-gradient(#22b9ef, #159bd4);
      box-shadow: inset 0 0 0 2px rgba(255,255,255,.12), inset 0 -5px 0 rgba(0,0,0,.12);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      overflow: hidden;
    }

    .badge .brand {
      font-size: 10px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: .04em;
    }

    .badge .num {
      font-size: 28px;
      line-height: .98;
      font-weight: 950;
      white-space: nowrap;
      max-width: 80px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .badge.route-only .brand {
      display: none;
    }

    .badge.route-only .num {
      font-size: 30px;
    }

    .stop-title-bar {
      border-top: 1px solid #444;
      border-bottom: 1px solid #444;
      padding: 10px 12px;
      font-size: 22px;
      line-height: 1.2;
      font-weight: 850;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .depart-row {
      min-height: 82px;
      border-bottom: 1px solid var(--line);
      display: grid;
      grid-template-columns: 94px minmax(0, 1fr) 82px;
      gap: 8px;
      align-items: center;
      padding: 7px 8px;
      cursor: pointer;
    }

    .depart-row.live .depart-dest,
    .depart-row.live .depart-time,
    .depart-row.live .depart-min {
      color: var(--live);
    }

    .depart-dest {
      color: #f0f0f0;
      font-size: 22px;
      font-weight: 850;
      line-height: 1.1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: center;
    }

    .depart-info {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.2;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .depart-time {
      color: #fff;
      font-size: 28px;
      font-weight: 850;
      text-align: right;
      white-space: nowrap;
    }

    .depart-min {
      color: var(--muted);
      font-size: 14px;
      text-align: right;
      margin-top: 3px;
    }

    .empty {
      padding: 30px 22px;
      color: #ddd;
      font-size: 22px;
      line-height: 1.35;
      font-weight: 750;
    }

    .hint {
      margin-top: 24px;
      color: #ddd;
      font-size: 20px;
      line-height: 1.35;
    }

    .trip-head {
      display: grid;
      grid-template-columns: 96px minmax(0, 1fr) 78px;
      gap: 10px;
      align-items: center;
      padding: 12px 8px;
      border-bottom: 4px solid var(--blue);
    }

    .trip-dest {
      text-align: center;
      font-size: 22px;
      font-weight: 850;
      line-height: 1.15;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .trip-sub {
      color: var(--muted);
      text-align: center;
      font-size: 15px;
      margin-top: 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .delay-box {
      background: #efefd8;
      color: #111;
      height: 48px;
      display: grid;
      place-items: center;
      font-size: 22px;
      font-weight: 900;
    }

    .stop-row-trip {
      min-height: 58px;
      display: grid;
      grid-template-columns: 78px minmax(0,1fr) 58px;
      gap: 8px;
      align-items: center;
      border-bottom: 1px solid var(--line);
      padding: 6px 12px;
    }

    .trip-time {
      font-size: 24px;
      font-weight: 780;
      color: #ddd;
      white-space: nowrap;
    }

    .trip-name {
      font-size: 20px;
      font-weight: 780;
      color: #ddd;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .trip-count {
      font-size: 22px;
      text-align: right;
      color: var(--live);
      white-space: nowrap;
    }

    .stop-row-trip.live .trip-time,
    .stop-row-trip.live .trip-name,
    .stop-row-trip.live .trip-count {
      color: var(--live);
    }

    .blink {
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: .35; }
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 12px;
      border-bottom: 1px solid var(--line);
    }

    .action-btn {
      border: 1px solid #666;
      background: #303030;
      color: #fff;
      border-radius: 4px;
      padding: 10px 14px;
      font-size: 18px;
      cursor: pointer;
    }

    .map-holder {
      width: 100%;
      height: calc(100vh - 160px);
      min-height: 430px;
      background: #222;
    }

    .vehicle-marker {
      position: relative;
      background: #2f8cff;
      color: white;
      border-radius: 8px;
      min-width: 46px;
      max-width: 96px;
      padding: 3px 7px 4px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,.35);
      border: 1px solid rgba(255,255,255,.25);
      font-weight: 900;
      line-height: 1.05;
    }

    .vehicle-marker .m-line {
      font-size: 15px;
    }

    .vehicle-marker .m-dest {
      font-size: 10px;
      max-width: 76px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      opacity: .95;
    }

    .vehicle-marker:after {
      content: "";
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: -7px;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 8px solid #2f8cff;
    }

    .leaflet-popup-content {
      font-size: 14px;
      line-height: 1.35;
    }

    .route-summary {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border-bottom: 1px solid var(--line);
    }

    .route-name {
      font-size: 24px;
      font-weight: 850;
      flex: 1;
      min-width: 0;
    }

    .star {
      font-size: 28px;
      color: white;
      opacity: .9;
    }

    .small-blue-title {
      background: #3b7fd8;
      color: white;
      font-size: 21px;
      line-height: 1.2;
      font-weight: 850;
      padding: 8px 12px;
    }

    @media (max-width: 430px) {
      .topbar {
        height: 56px;
        padding: 0 10px;
        gap: 8px;
      }

      .title {
        font-size: 23px;
      }

      .statusbar {
        font-size: 16px;
        gap: 12px;
      }

      .search-input {
        font-size: 22px;
      }

      .section-title {
        font-size: 25px;
      }

      .row-title {
        font-size: 20px;
      }

      .row-sub {
        font-size: 15px;
      }

      .badge {
        width: 74px;
        height: 44px;
      }

      .badge .brand {
        font-size: 9px;
      }

      .badge .num {
        font-size: 25px;
      }

      .depart-row {
        grid-template-columns: 80px minmax(0, 1fr) 72px;
        min-height: 76px;
      }

      .depart-dest {
        font-size: 20px;
      }

      .depart-info {
        font-size: 14px;
      }

      .depart-time {
        font-size: 25px;
      }

      .trip-head {
        grid-template-columns: 82px minmax(0, 1fr) 62px;
      }

      .trip-dest {
        font-size: 20px;
      }

      .delay-box {
        font-size: 18px;
      }

      .stop-row-trip {
        grid-template-columns: 70px minmax(0,1fr) 50px;
      }

      .trip-time {
        font-size: 22px;
      }

      .trip-name {
        font-size: 18px;
      }

      .trip-count {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="topbar">
      <button class="top-btn" id="backBtn">☰</button>
      <div class="title" id="pageTitle">Bluestar Unilink</div>
      <div class="lang-switch" id="langSwitch">
        <button class="flag-btn" data-lang="hu">🇭🇺</button>
        <button class="flag-btn" data-lang="en">🇬🇧</button>
      </div>
      <button class="top-btn" id="locBtn">⌖</button>
    </div>

    <div class="statusbar">
      <div class="status-pill">
        <span class="dot" id="liveDot"></span>
        <span id="liveText">LIVE: …</span>
      </div>
      <div class="status-pill">
        <span class="dot" id="gtfsDot"></span>
        <span id="gtfsText">GTFS: …</span>
      </div>
    </div>

    <main class="main" id="appRoot"></main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const root = document.getElementById("appRoot");
    const pageTitle = document.getElementById("pageTitle");
    const backBtn = document.getElementById("backBtn");
    const locBtn = document.getElementById("locBtn");
    const liveDot = document.getElementById("liveDot");
    const gtfsDot = document.getElementById("gtfsDot");
    const liveText = document.getElementById("liveText");
    const gtfsText = document.getElementById("gtfsText");

    const API = "";

    let appStatus = null;
    let currentView = "home";
    let currentStop = null;
    let currentRoute = null;
    let currentMap = null;
    let mapLayerGroup = null;
    let routeShapeLayers = [];
    let lang = localStorage.getItem("lang") || "hu";

    const TXT = {
      hu: {
        appTitle: "Bluestar Unilink",
        searchTitle: "Bluestar Unilink",
        stopTitle: "Megálló",
        stopsTitle: "Megállók",
        routeTitle: "Viszonylat",
        tripTitle: "Járat",
        vehiclesTitle: "Járművek",
        mapTitle: "Térkép",
        searchLabel: "Megálló vagy viszonylat keresése",
        searchPlaceholder: "Megálló vagy járat keresése...",
        resultsFor: "Találatok a(z)",
        stops: "Megállók",
        routes: "Járatok",
        routeSub: "Viszonylat",
        noFavourites: "Nincsenek kedvencek",
        noDepartures: "Nincs indulás a következő időablakban.",
        loadErrorDepartures: "Hiba az indulások betöltésénél.",
        whiteGreen: "Fehér: menetrend (GTFS) · Zöld: élő (LIVE)",
        timetable: "Menetrendi adat",
        live: "Élő adat",
        due: "Due",
        min: "perc",
        vehiclesListHeader: "A viszonylaton közlekedő járművek listája:",
        routeMapHeader: "A viszonylat útvonala térképen:",
        routeDirectionsHeader: "A viszonylat megállóinak listája irányonként:",
        vehiclesList: "Járművek listája forgalmi számokkal",
        onlyActualLive: "Csak aktuális live járművek",
        viewMap: "Térkép megtekintése",
        routeAndVehicles: "Útvonal + bejelentkezett járművek",
        moving: "Mozgásban",
        atStop: "Megállóban",
        filter: "Szűrő",
        clearFilter: "Szűrő törlése",
        refresh: "Frissítés",
        vehiclesOnly: "Csak járművek",
        writeSearch: "Írj be megállót vagy járatot...",
        liveMatched: "Élő jármű párosítva",
        scheduleOnly: "Menetrendi adat",
        noVehicles: "Nincs aktuális bejelentkezett jármű ezen a viszonylaton.",
        noResults: "Nincs találat."
      },
      en: {
        appTitle: "Bluestar Unilink",
        searchTitle: "Bluestar Unilink",
        stopTitle: "Stop",
        stopsTitle: "Stops",
        routeTitle: "Route",
        tripTitle: "Trip",
        vehiclesTitle: "Vehicles",
        mapTitle: "Map",
        searchLabel: "Search stop or route",
        searchPlaceholder: "Search stop or route...",
        resultsFor: "Results for",
        stops: "Stops",
        routes: "Routes",
        routeSub: "Route",
        noFavourites: "No favourites",
        noDepartures: "No departures in the next time window.",
        loadErrorDepartures: "Error loading departures.",
        whiteGreen: "White: timetable (GTFS) · Green: live",
        timetable: "Scheduled",
        live: "Live",
        due: "Due",
        min: "min",
        vehiclesListHeader: "Vehicles currently running on this route:",
        routeMapHeader: "Route on map:",
        routeDirectionsHeader: "Route stop lists by direction:",
        vehiclesList: "Vehicle list with fleet numbers",
        onlyActualLive: "Current live vehicles only",
        viewMap: "View map",
        routeAndVehicles: "Route + logged-in vehicles",
        moving: "Moving",
        atStop: "At stop",
        filter: "Filter",
        clearFilter: "Clear filter",
        refresh: "Refresh",
        vehiclesOnly: "Vehicles only",
        writeSearch: "Type a stop or route...",
        liveMatched: "Live vehicle matched",
        scheduleOnly: "Scheduled",
        noVehicles: "No current logged-in vehicles on this route.",
        noResults: "No results."
      }
    };

    function t(key) {
      return TXT[lang][key] || TXT.hu[key] || key;
    }

    function esc(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function cleanName(value) {
      return String(value || "").replaceAll("_", " ").replace(/\s+/g, " ").trim();
    }

    function shortName(value, max = 34) {
      const s = cleanName(value);
      if (s.length <= max) return s;
      return s.slice(0, max - 1).trim() + "…";
    }

    function stopBadgeCode(stop) {
      const name = stop?.stop_name || stop?.stopName || stop?.name || "";
      const fromName = String(name).match(/\[([A-Z0-9]{1,6})\]/i);

      if (fromName) return fromName[1].toUpperCase();

      const platform = stop?.platform_code || stop?.platformCode || stop?.badge || "";
      if (platform && String(platform).length <= 6 && String(platform).toUpperCase() !== "BUS") {
        return String(platform).toUpperCase();
      }

      return "BUS";
    }

    function routeBadge(code, options = {}) {
      const routeOnly = options.routeOnly ? " route-only" : "";
      const brand = options.brand === false ? "" : `<div class="brand">BLUESTAR</div>`;

      return `
        <div class="badge${routeOnly}">
          ${brand}
          <div class="num">${esc(code || "BUS")}</div>
        </div>
      `;
    }

    async function fetchJson(url) {
      const res = await fetch(url, {
        cache: "no-store",
        headers: {
          "Accept": "application/json"
        }
      });

      if (!res.ok) {
        const text = await res.text().catch(() => "");
        throw new Error(`${res.status} ${text}`);
      }

      return await res.json();
    }

    function setTitle(title, backMode = "menu") {
      pageTitle.textContent = title;
      backBtn.textContent = backMode === "back" ? "‹" : "☰";
    }

    function setLang(nextLang) {
      lang = nextLang;
      localStorage.setItem("lang", lang);

      document.querySelectorAll(".flag-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.lang === lang);
      });

      if (currentView === "home") renderHome();
      else if (currentView === "stop" && currentStop) showStop(currentStop.stop_id || currentStop.stopId);
      else if (currentView === "route" && currentRoute) showRoute(currentRoute);
      else if (currentView === "map") showMap(currentRoute || "");
    }

    document.querySelectorAll(".flag-btn").forEach(btn => {
      btn.addEventListener("click", () => setLang(btn.dataset.lang));
    });

    setLang(lang);

    async function loadStatus() {
      try {
        appStatus = await fetchJson(`${API}/api/status`);

        const liveOk = !!appStatus?.live?.ok;
        const gtfsOk = !!appStatus?.gtfs?.ok;

        liveDot.classList.toggle("bad", !liveOk);
        gtfsDot.classList.toggle("bad", !gtfsOk);

        liveText.textContent = liveOk
          ? `LIVE: ON (${appStatus.live.activeCount ?? 0})`
          : "LIVE: ERR";

        gtfsText.textContent = gtfsOk
          ? "GTFS: OK"
          : "GTFS: ERR";
      } catch (e) {
        liveDot.classList.add("bad");
        gtfsDot.classList.add("bad");
        liveText.textContent = "LIVE: ERR";
        gtfsText.textContent = "GTFS: ERR";
      }
    }

    function renderHome() {
      currentView = "home";
      currentStop = null;
      currentRoute = null;
      setTitle(t("searchTitle"), "menu");

      root.innerHTML = `
        <div class="search-box-wrap">
          <div class="search-box">
            <div class="search-label">${esc(t("searchLabel"))}</div>
            <div class="search-icon">⌕</div>
            <input id="searchInput" class="search-input" type="text" placeholder="${esc(t("searchPlaceholder"))}" autocomplete="off" />
            <button id="clearSearch" class="clear-btn" style="display:none">×</button>
          </div>
        </div>
        <div id="searchResults" class="search-results">
          <div class="empty">${esc(t("writeSearch"))}</div>
        </div>
      `;

      const input = document.getElementById("searchInput");
      const clear = document.getElementById("clearSearch");
      const results = document.getElementById("searchResults");

      let timer = null;

      input.addEventListener("input", () => {
        const q = input.value.trim();
        clear.style.display = q ? "block" : "none";

        clearTimeout(timer);
        timer = setTimeout(() => performSearch(q, results), 250);
      });

      clear.addEventListener("click", () => {
        input.value = "";
        clear.style.display = "none";
        results.innerHTML = `<div class="empty">${esc(t("writeSearch"))}</div>`;
        input.focus();
      });

      input.focus({ preventScroll: true });
    }

    async function performSearch(q, target) {
      if (!q) {
        target.innerHTML = `<div class="empty">${esc(t("writeSearch"))}</div>`;
        return;
      }

      try {
        const data = await fetchJson(`${API}/api/search?q=${encodeURIComponent(q)}`);

        const stops = data.stops || [];
        const routes = data.routes || [];

        if (!stops.length && !routes.length) {
          target.innerHTML = `
            <div class="blue-header">${esc(t("resultsFor"))} "${esc(q)}"</div>
            <div class="empty">${esc(t("noResults"))}</div>
          `;
          return;
        }

        let html = `
          <div class="blue-header">${esc(t("resultsFor"))} "${esc(q)}"</div>
        `;

        if (stops.length) {
          html += `<div class="section-title">${esc(t("stops"))}</div>`;

          for (const s of stops) {
            const badge = stopBadgeCode(s);
            html += `
              <div class="row" data-stop="${esc(s.stop_id || s.stopId)}">
                ${routeBadge(badge, { brand: true })}
                <div class="row-main">
                  <div class="row-title">${esc(shortName(s.stop_name || s.stopName, 32))}</div>
                  <div class="row-sub">${esc(s.stop_id || s.stopId)}</div>
                </div>
                <div class="arrow">→</div>
              </div>
            `;
          }
        }

        if (routes.length) {
          html += `<div class="section-title">${esc(t("routes"))}</div>`;

          for (const r of routes) {
            const line = r.line || r.route_short_name || r.shortName;
            html += `
              <div class="row" data-route="${esc(line)}">
                ${routeBadge(line, { brand: false, routeOnly: true })}
                <div class="row-main">
                  <div class="row-title">${esc(line)}</div>
                  <div class="row-sub">${esc(t("routeSub"))}</div>
                </div>
                <div class="arrow">→</div>
              </div>
            `;
          }
        }

        target.innerHTML = html;

        target.querySelectorAll("[data-stop]").forEach(el => {
          el.addEventListener("click", () => showStop(el.dataset.stop));
        });

        target.querySelectorAll("[data-route]").forEach(el => {
          el.addEventListener("click", () => showRoute(el.dataset.route));
        });

      } catch (e) {
        target.innerHTML = `<div class="empty">${esc(e.message)}</div>`;
      }
    }

    async function showStop(stopId) {
      currentView = "stop";
      setTitle(t("stopTitle"), "back");

      root.innerHTML = `<div class="empty">Loading…</div>`;

      try {
        const data = await fetchJson(`${API}/api/stop/${encodeURIComponent(stopId)}/departures?minutes=180&limit=80`);
        const stop = data.stop || {};
        currentStop = stop;

        const stopName = stop.stop_name || stop.stopName || data.stop_name || "";
        const stopCode = stop.stop_id || stop.stopId || stopId;

        let html = `
          <div class="stop-title-bar">${esc(shortName(stopName, 44))} (${esc(stopCode)})</div>
        `;

        const deps = data.departures || [];

        if (!deps.length) {
          html += `
            <div class="empty">
              ${esc(t("noDepartures"))}
              <div class="hint">${esc(t("whiteGreen"))}</div>
            </div>
          `;
        } else {
          for (const d of deps) {
            const line = d.line || d.route || "";
            const live = !!(d.live || d.isLive);
            const due = !!d.due;
            const cls = live ? "depart-row live" : "depart-row";
            const dest = d.destination || d.destinationFull || d.headsign || "";
            const timeText = d.displayTime || d.expectedTime || d.scheduledTime || "";
            const minText = d.minutesText || (d.minutes != null ? `${d.minutes} ${t("min")}` : "");
            const source = live ? t("live") : t("timetable");
            const blink = due ? " blink" : "";

            html += `
              <div class="${cls}" data-trip="${esc(d.tripId || d.trip_id || "")}">
                ${routeBadge(line, { brand: false, routeOnly: true })}
                <div class="row-main">
                  <div class="depart-dest${blink}">${esc(dest)}</div>
                  <div class="depart-info">${esc(source)} · ${esc(stopName)}</div>
                </div>
                <div>
                  <div class="depart-time">${esc(timeText)}</div>
                  <div class="depart-min">${esc(minText)}</div>
                </div>
              </div>
            `;
          }
        }

        root.innerHTML = html;

        root.querySelectorAll("[data-trip]").forEach(el => {
          el.addEventListener("click", () => {
            if (el.dataset.trip) showTrip(el.dataset.trip);
          });
        });

      } catch (e) {
        root.innerHTML = `
          <div class="stop-title-bar">${esc(stopId)}</div>
          <div class="empty">
            ${esc(t("loadErrorDepartures"))}
            <div class="hint">${esc(t("whiteGreen"))}</div>
          </div>
        `;
      }
    }

    async function showTrip(tripId) {
      currentView = "trip";
      setTitle(t("tripTitle"), "back");

      root.innerHTML = `<div class="empty">Loading…</div>`;

      try {
        const data = await fetchJson(`${API}/api/trip/${encodeURIComponent(tripId)}`);

        const line = data.line || data.route?.route_short_name || "";
        const dest = data.destination || data.destinationFull || "";
        const vehicle = data.vehicle || null;
        const liveMatched = !!data.liveMatched;

        let html = `
          <div class="trip-head">
            ${routeBadge(line, { brand: false, routeOnly: true })}
            <div>
              <div class="trip-dest">${esc(dest)}</div>
              <div class="trip-sub">${esc(liveMatched ? t("liveMatched") : t("scheduleOnly"))}${vehicle?.vehicleRef ? " · " + esc(vehicle.vehicleRef) : ""}</div>
            </div>
            <div class="delay-box">${liveMatched ? "LIVE" : "--"}</div>
          </div>
        `;

        for (const s of data.stops || []) {
          const live = !!s.live;
          const passed = !!s.isPast && !live;
          const cls = live ? "stop-row-trip live" : "stop-row-trip";
          const min = s.minutes != null && s.minutes >= 0 ? `${s.minutes}'` : "";

          html += `
            <div class="${cls}" style="${passed ? "opacity:.55" : ""}">
              <div class="trip-time">${esc(s.time || s.scheduledTime || "")}</div>
              <div class="trip-name ${s.vehicleAtStop ? "blink" : ""}">${esc(s.stopName || s.stop_name || "")}</div>
              <div class="trip-count">${esc(min)}</div>
            </div>
          `;
        }

        root.innerHTML = html;

      } catch (e) {
        root.innerHTML = `<div class="empty">${esc(e.message)}</div>`;
      }
    }

    async function showRoute(line) {
      currentView = "route";
      currentRoute = line;
      setTitle(t("routeTitle"), "back");

      root.innerHTML = `<div class="empty">Loading…</div>`;

      try {
        const data = await fetchJson(`${API}/api/route/${encodeURIComponent(line)}`);
        const directions = data.directions || [];

        let html = `
          <div class="route-summary">
            ${routeBadge(line, { brand: false, routeOnly: true })}
            <div class="route-name">${esc(line)}</div>
            <div class="star">☆</div>
          </div>

          <div class="small-blue-title">${esc(t("vehiclesListHeader"))}</div>
          <div class="row" id="routeVehiclesBtn">
            ${routeBadge(line, { brand: false, routeOnly: true })}
            <div class="row-main">
              <div class="row-title">${esc(t("vehiclesList"))}</div>
              <div class="row-sub">${esc(t("onlyActualLive"))}</div>
            </div>
            <div class="arrow">→</div>
          </div>

          <div class="small-blue-title">${esc(t("routeMapHeader"))}</div>
          <div class="row" id="routeMapBtn">
            ${routeBadge(line, { brand: false, routeOnly: true })}
            <div class="row-main">
              <div class="row-title">${esc(t("viewMap"))}</div>
              <div class="row-sub">${esc(t("routeAndVehicles"))}</div>
            </div>
            <div class="arrow">→</div>
          </div>

          <div class="small-blue-title">${esc(t("routeDirectionsHeader"))}</div>
        `;

        for (const d of directions) {
          html += `
            <div class="row" data-trip="${esc(d.tripId || d.trip_id)}">
              ${routeBadge(line, { brand: false, routeOnly: true })}
              <div class="row-main">
                <div class="row-title">► ${esc(d.destination || d.headsign || "")}</div>
                <div class="row-sub">${esc(shortName(d.from?.stop_name || d.from?.stopName || "", 18))} → ${esc(shortName(d.to?.stop_name || d.to?.stopName || "", 18))}</div>
              </div>
              <div class="arrow">→</div>
            </div>
          `;
        }

        if (!directions.length) {
          html += `<div class="empty">No directions found.</div>`;
        }

        root.innerHTML = html;

        document.getElementById("routeVehiclesBtn").addEventListener("click", () => showVehicles(line));
        document.getElementById("routeMapBtn").addEventListener("click", () => showMap(line));

        root.querySelectorAll("[data-trip]").forEach(el => {
          el.addEventListener("click", () => showTrip(el.dataset.trip));
        });

      } catch (e) {
        root.innerHTML = `<div class="empty">${esc(e.message)}</div>`;
      }
    }

    async function showVehicles(line) {
      currentView = "vehicles";
      currentRoute = line;
      setTitle(t("vehiclesTitle"), "back");

      root.innerHTML = `<div class="empty">Loading…</div>`;

      try {
        const data = await fetchJson(`${API}/api/route/${encodeURIComponent(line)}/vehicles`);
        const vehicles = data.vehicles || [];

        let html = "";

        if (!vehicles.length) {
          html += `<div class="empty">${esc(t("noVehicles"))}</div>`;
        } else {
          for (const v of vehicles) {
            const destination = v.destinationShort || v.destinationName || "";
            const vehicle = v.vehicleRef || v.vehicleUniqueId || "";
            const status = v.vehicleAtStop ? t("atStop") : t("moving");

            html += `
              <div class="row">
                ${routeBadge(v.publishedLineName || line, { brand: false, routeOnly: true })}
                <div class="row-main">
                  <div class="row-title">${esc(destination)}</div>
                  <div class="row-sub">${esc(vehicle)} · ${esc(status)}</div>
                </div>
              </div>
            `;
          }
        }

        root.innerHTML = html;

      } catch (e) {
        root.innerHTML = `<div class="empty">${esc(e.message)}</div>`;
      }
    }

    async function showMap(line = "") {
      currentView = "map";
      currentRoute = line || "";
      setTitle(t("mapTitle"), "back");

      root.innerHTML = `
        <div class="actions">
          <button class="action-btn">${esc(t("filter"))}: ${esc(line || "mind")}</button>
          <button class="action-btn" id="clearMapFilter">${esc(t("clearFilter"))}</button>
          <button class="action-btn" id="refreshMap">${esc(t("refresh"))}</button>
        </div>
        <div id="map" class="map-holder"></div>
      `;

      document.getElementById("clearMapFilter").addEventListener("click", () => showMap(""));
      document.getElementById("refreshMap").addEventListener("click", () => loadMapData(line));

      if (currentMap) {
        currentMap.remove();
        currentMap = null;
      }

      currentMap = L.map("map", {
        zoomControl: true,
        attributionControl: true
      }).setView([50.91, -1.40], 11);

      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: "Leaflet | © OpenStreetMap"
      }).addTo(currentMap);

      mapLayerGroup = L.layerGroup().addTo(currentMap);
      routeShapeLayers = [];

      setTimeout(() => currentMap.invalidateSize(), 200);

      await loadMapData(line);
    }

    async function loadMapData(line = "") {
      if (!currentMap || !mapLayerGroup) return;

      mapLayerGroup.clearLayers();

      for (const layer of routeShapeLayers) {
        currentMap.removeLayer(layer);
      }

      routeShapeLayers = [];

      const bounds = [];

      try {
        if (line) {
          const shapeData = await fetchJson(`${API}/api/route/${encodeURIComponent(line)}/shape`);

          for (const shape of shapeData.shapes || []) {
            const pts = (shape.points || [])
              .filter(p => p.lat != null && p.lon != null)
              .map(p => [p.lat, p.lon]);

            if (pts.length) {
              const poly = L.polyline(pts, {
                color: "#169fe4",
                weight: 4,
                opacity: .8
              }).addTo(currentMap);

              routeShapeLayers.push(poly);
              pts.forEach(p => bounds.push(p));
            }
          }
        }

        const data = await fetchJson(`${API}/api/map/vehicles?line=${encodeURIComponent(line || "")}&force=1`);
        const vehicles = data.vehicles || [];

        for (const v of vehicles) {
          if (v.latitude == null || v.longitude == null) continue;

          const markerHtml = `
            <div class="vehicle-marker">
              <div class="m-line">${esc(v.publishedLineName || v.line || "")}</div>
              <div class="m-dest">${esc(v.destinationShort || "")}</div>
            </div>
          `;

          const icon = L.divIcon({
            html: markerHtml,
            className: "",
            iconSize: [74, 42],
            iconAnchor: [37, 42]
          });

          const m = L.marker([v.latitude, v.longitude], { icon });

          m.bindPopup(`
            <b>${esc(v.publishedLineName || "")} ${esc(v.destinationName || v.destinationShort || "")}</b><br>
            ${esc(v.vehicleRef || v.vehicleUniqueId || "")}<br>
            ${esc(v.originName || "")} → ${esc(v.destinationName || "")}<br>
            age: ${esc(v.ageSeconds ?? "")}s
          `);

          m.addTo(mapLayerGroup);
          bounds.push([v.latitude, v.longitude]);
        }

        if (bounds.length) {
          currentMap.fitBounds(bounds, {
            padding: [30, 30],
            maxZoom: line ? 14 : 11
          });
        } else {
          currentMap.setView([50.91, -1.40], 11);
        }

      } catch (e) {
        console.error(e);
      }
    }

    backBtn.addEventListener("click", () => {
      if (currentView === "home") {
        renderHome();
        return;
      }

      if (currentView === "trip" && currentStop) {
        showStop(currentStop.stop_id || currentStop.stopId);
        return;
      }

      if ((currentView === "vehicles" || currentView === "map") && currentRoute) {
        showRoute(currentRoute);
        return;
      }

      renderHome();
    });

    locBtn.addEventListener("click", () => {
      if (currentView === "map") {
        showMap(currentRoute || "");
      }
    });

    async function boot() {
      await loadStatus();
      renderHome();
      setInterval(loadStatus, 30000);
    }

    boot();
  </script>
</body>
</html>
