{% extends "base.html" %}
{% block content %}
<h1>Járatok</h1>
<div class="list">
  {% for r in routes %}
    <a class="row" href="/route/{{ r.route_id }}">
      <div class="left badge">{{ r.route_short_name }}</div>
      <div class="center ellips">{{ r.route_long_name }}</div>
      <div class="right">›</div>
    </a>
  {% endfor %}
</div>
{% endblock %}
