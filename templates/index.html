<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071322">
  <title>Bluestar Unilink</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="/static/css/app.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/css/views.css">
  <link rel="stylesheet" href="/static/css/map.css">
</head>
<body>
  <div id="app" class="app-shell">
    <header class="app-header">
      <div class="header-main">
        <button id="back-button" class="icon-button" type="button" aria-label="Vissza">‹</button>
        <div class="header-copy"><span class="eyebrow">BLUESTAR · UNILINK</span><h1 id="page-title">Menetrend</h1></div>
        <button id="map-button" class="icon-button" type="button" aria-label="Térkép">⌖</button>
        <div class="language-switch" role="group" aria-label="Language">
          <button type="button" data-language="hu">HU</button><button type="button" data-language="en">EN</button>
        </div>
      </div>
      <div id="service-status" class="service-status" aria-live="polite"></div>
    </header>
    <main id="view" class="view" tabindex="-1"></main>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
