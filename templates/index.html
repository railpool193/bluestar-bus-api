<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Bluestar Unilink Menetrend</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    :root{
      --bg:#2f2f2f;
      --top:#858585;
      --top-dark:#0b0b0b;
      --panel:#303030;
      --panel2:#262626;
      --panel3:#363636;
      --line:#4a4a4a;
      --text:#eeeeee;
      --muted:#c1c1c1;
      --muted2:#9d9d9d;
      --blue:#1ea7e1;
      --blue2:#167cc1;
      --bkk-blue:#3777cf;
      --green:#35e63f;
      --yellow:#ffd13b;
      --red:#ff4242;
      --cream:#eeeed6;
      --shadow:0 10px 28px rgba(0,0,0,.35);
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
    }

    html,body{
      margin:0;
      padding:0;
      width:100%;
      height:100%;
      background:var(--bg);
      color:var(--text);
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      overflow:hidden;
    }

    button,input{
      font:inherit;
    }

    button{
      border:0;
      cursor:pointer;
      color:inherit;
      background:transparent;
    }

    .app{
      height:100dvh;
      display:flex;
      flex-direction:column;
      background:var(--bg);
      overflow:hidden;
    }

    .topbar{
      height:76px;
      min-height:76px;
      background:var(--top);
      color:white;
      display:flex;
      align-items:center;
      gap:14px;
      padding:0 10px;
      box-shadow:0 1px 0 rgba(255,255,255,.08);
      z-index:20;
    }

    .top-btn{
      width:54px;
      height:54px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:38px;
      line-height:1;
      color:white;
      opacity:.98;
      flex:0 0 auto;
    }

    .top-btn.small{
      font-size:34px;
    }

    .top-title{
      flex:1;
      min-width:0;
      font-size:34px;
      font-weight:800;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      letter-spacing:-.5px;
    }

    .statusbar{
      height:45px;
      min-height:45px;
      background:#0b0b0b;
      display:flex;
      align-items:center;
      gap:18px;
      padding:0 14px;
      color:#ddd;
      font-size:23px;
      font-weight:500;
      z-index:19;
      border-bottom:1px solid #141414;
    }

    .dot{
      width:15px;
      height:15px;
      border-radius:50%;
      display:inline-block;
      margin-right:6px;
      background:var(--green);
      box-shadow:0 0 8px rgba(53,230,63,.75);
      vertical-align:middle;
    }

    .dot.err{
      background:var(--red);
      box-shadow:0 0 8px rgba(255,66,66,.75);
    }

    .content{
      flex:1;
      overflow:auto;
      -webkit-overflow-scrolling:touch;
      background:var(--bg);
    }

    .content.no-scroll{
      overflow:hidden;
    }

    .page{
      min-height:100%;
    }

    .section-title{
      background:var(--bkk-blue);
      color:#fff;
      font-size:26px;
      line-height:1.15;
      font-weight:850;
      padding:10px 14px;
      border-top:1px solid rgba(255,255,255,.08);
      border-bottom:1px solid rgba(0,0,0,.25);
    }

    .subheading{
      color:#ddd;
      font-size:35px;
      font-weight:900;
      padding:24px 30px 14px;
      line-height:1.05;
    }

    .empty{
      padding:28px 30px;
      color:#d2d2d2;
      font-size:30px;
      font-weight:800;
      line-height:1.35;
    }

    .small-note{
      color:#c6c6c6;
      font-size:24px;
      line-height:1.35;
      padding:16px 30px;
      font-weight:700;
    }

    .search-wrap{
      padding:30px 20px 32px;
      background:var(--panel);
    }

    .search-box{
      position:relative;
      border:3px solid #418cff;
      border-radius:5px;
      height:78px;
      display:flex;
      align-items:center;
      background:#303030;
      color:#fff;
    }

    .search-box label{
      position:absolute;
      left:14px;
      top:-18px;
      background:#303030;
      color:#428cff;
      font-size:20px;
      padding:0 8px;
      white-space:nowrap;
    }

    .search-icon{
      width:70px;
      text-align:center;
      font-size:42px;
      color:#d0d0d0;
    }

    .search-box input{
      flex:1;
      min-width:0;
      background:transparent;
      border:0;
      outline:0;
      color:#fff;
      font-size:38px;
      font-weight:500;
      height:100%;
      padding:0 8px;
    }

    .search-box input::placeholder{
      color:#aaa;
      font-size:28px;
    }

    .clear-btn{
      width:64px;
      height:64px;
      border-radius:50%;
      margin-right:10px;
      background:#cfcfcf;
      color:#222;
      font-size:42px;
      line-height:64px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:600;
    }

    .result-row,
    .menu-row,
    .vehicle-row,
    .route-action,
    .direction-row{
      min-height:100px;
      display:flex;
      align-items:center;
      gap:18px;
      padding:14px 30px;
      border-bottom:1px solid var(--line);
      background:var(--bg);
    }

    .result-row:active,
    .menu-row:active,
    .vehicle-row:active,
    .route-action:active,
    .direction-row:active,
    .departure-row:active,
    .trip-stop-row:active{
      background:#3c3c3c;
    }

    .result-main,
    .vehicle-main,
    .route-action-main,
    .direction-main{
      flex:1;
      min-width:0;
      text-align:left;
    }

    .result-name,
    .vehicle-dest,
    .route-action-title,
    .direction-title{
      color:#e7e7e7;
      font-size:31px;
      font-weight:850;
      line-height:1.12;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .result-sub,
    .vehicle-sub,
    .route-action-sub,
    .direction-sub{
      color:#bdbdbd;
      font-size:23px;
      line-height:1.25;
      margin-top:3px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      font-weight:500;
    }

    .arrow{
      font-size:36px;
      color:#f2f2f2;
      opacity:.9;
    }

    .route-badge{
      width:116px;
      height:64px;
      min-width:116px;
      background:linear-gradient(#22abe4,#179bd7);
      color:white;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:42px;
      font-weight:900;
      box-shadow:inset 0 -5px 0 rgba(0,0,0,.14), inset 0 0 0 2px rgba(255,255,255,.08);
      border-radius:0;
      overflow:hidden;
      line-height:1;
      text-align:center;
    }

    .route-badge.small{
      width:82px;
      height:45px;
      min-width:82px;
      font-size:27px;
    }

    .stop-badge{
      width:156px;
      height:89px;
      min-width:156px;
      background:linear-gradient(#18ace7,#0b8dd0);
      border-radius:3px;
      color:#fff;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      box-shadow:inset 0 -5px 0 rgba(0,0,0,.18), inset 0 0 0 2px rgba(255,255,255,.12);
      overflow:hidden;
    }

    .stop-badge .brand{
      font-size:15px;
      font-weight:900;
      line-height:1;
      letter-spacing:.5px;
      margin-bottom:5px;
      opacity:.96;
    }

    .stop-badge .code{
      font-size:43px;
      line-height:.9;
      font-weight:950;
      letter-spacing:.5px;
    }

    .stop-badge.unilink{
      background:linear-gradient(#2b63df,#1d45a8);
    }

    .stop-title-strip{
      min-height:70px;
      display:flex;
      align-items:center;
      border-bottom:1px solid var(--line);
      background:var(--panel);
      padding:8px 12px;
      font-size:31px;
      line-height:1.1;
      font-weight:900;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .stop-title-strip .star{
      margin-left:auto;
      min-width:56px;
      width:56px;
      height:56px;
      font-size:36px;
    }

    .departure-row{
      min-height:121px;
      display:grid;
      grid-template-columns:190px 1fr 150px;
      align-items:center;
      gap:8px;
      padding:10px 8px;
      border-bottom:1px solid var(--line);
      background:var(--panel);
    }

    .departure-center{
      min-width:0;
      text-align:center;
      padding:0 4px;
    }

    .departure-destination{
      font-size:32px;
      font-weight:900;
      line-height:1.08;
      color:#e4e4e4;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .departure-sub{
      color:#cfcfcf;
      font-size:25px;
      line-height:1.1;
      margin-top:6px;
    }

    .departure-stop{
      color:#cfcfcf;
      font-size:24px;
      line-height:1.05;
      white-space:normal;
      overflow:hidden;
      display:-webkit-box;
      -webkit-line-clamp:2;
      -webkit-box-orient:vertical;
    }

    .departure-time{
      text-align:right;
      color:#f2f2f2;
      font-size:48px;
      font-weight:900;
      line-height:1;
      padding-right:6px;
      white-space:nowrap;
    }

    .departure-mins{
      color:#cfcfcf;
      font-size:24px;
      margin-top:7px;
      text-align:right;
      padding-right:8px;
      font-weight:600;
    }

    .departure-row.live .departure-destination,
    .departure-row.live .departure-time,
    .departure-row.live .departure-mins,
    .departure-row.live .departure-sub{
      color:var(--green);
    }

    .departure-row.due .departure-destination,
    .departure-row.due .departure-time{
      animation:blinkGreen 1s infinite;
    }

    .departure-row.at-stop .departure-destination{
      animation:blinkGreen 1s infinite;
    }

    @keyframes blinkGreen{
      0%,100%{opacity:1;color:var(--green);}
      50%{opacity:.25;color:var(--green);}
    }

    .trip-head{
      min-height:207px;
      display:grid;
      grid-template-columns:205px 1fr 184px;
      align-items:center;
      gap:10px;
      padding:12px 8px;
      background:var(--panel);
      border-bottom:5px solid var(--blue);
    }

    .trip-main{
      text-align:center;
      min-width:0;
    }

    .trip-destination{
      font-size:31px;
      font-weight:900;
      line-height:1.1;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      color:#e3e3e3;
    }

    .trip-meta{
      margin-top:12px;
      color:#d0d0d0;
      font-size:23px;
      line-height:1.25;
    }

    .trip-next{
      color:#d0d0d0;
      font-size:22px;
      font-weight:800;
      line-height:1.2;
    }

    .delay-box{
      width:184px;
      height:102px;
      background:var(--cream);
      color:#111;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:40px;
      font-weight:950;
    }

    .delay-box.live{
      background:#45a92d;
      color:#fff;
    }

    .delay-box.late{
      background:var(--yellow);
      color:#111;
    }

    .delay-box.early{
      background:var(--red);
      color:#fff;
    }

    .trip-stop-row{
      min-height:75px;
      display:grid;
      grid-template-columns:145px 1fr 112px;
      align-items:center;
      gap:6px;
      padding:0 20px;
      background:var(--panel);
      border-bottom:1px solid var(--line);
    }

    .trip-time{
      font-size:34px;
      font-weight:850;
      color:#d9d9d9;
      white-space:nowrap;
    }

    .trip-time.live{
      color:var(--green);
    }

    .trip-stop-name{
      text-align:center;
      color:#d2d2d2;
      font-size:25px;
      font-weight:850;
      line-height:1.1;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .trip-stop-row.live .trip-stop-name{
      color:var(--green);
    }

    .trip-stop-row.current .trip-stop-name{
      animation:blinkGreen 1s infinite;
    }

    .trip-stop-row.passed .trip-time,
    .trip-stop-row.passed .trip-stop-name{
      color:#8c8c8c;
    }

    .trip-countdown{
      text-align:right;
      font-size:36px;
      color:var(--green);
      font-weight:800;
      white-space:nowrap;
    }

    .trip-countdown.empty{
      font-size:0;
      padding:0;
    }

    .route-header{
      min-height:70px;
      display:flex;
      align-items:center;
      gap:12px;
      padding:12px 14px;
      background:var(--panel);
      border-bottom:1px solid var(--line);
      font-size:31px;
      font-weight:900;
    }

    .map-holder{
      width:100%;
      height:calc(100dvh - 121px);
      min-height:360px;
      position:relative;
      background:#222;
    }

    .map-controls{
      min-height:98px;
      background:var(--panel);
      display:flex;
      align-items:center;
      gap:16px;
      padding:12px 16px;
      border-bottom:1px solid var(--line);
      flex-wrap:wrap;
    }

    .map-btn{
      border:1px solid #666;
      padding:14px 20px;
      border-radius:5px;
      color:#fff;
      font-size:25px;
      background:#303030;
    }

    #map,
    #routeMap{
      width:100%;
      height:100%;
      background:#e5e3d6;
    }

    .leaflet-control-attribution{
      font-size:14px;
    }

    .bus-marker{
      background:transparent !important;
      border:0 !important;
    }

    .bus-marker-inner{
      position:relative;
      transform:translate(-50%,-50%);
      min-width:72px;
      max-width:116px;
      min-height:43px;
      background:#2e8cff;
      color:white;
      border-radius:10px;
      box-shadow:0 5px 12px rgba(46,140,255,.45);
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:4px 8px;
      border:1px solid rgba(255,255,255,.25);
      font-weight:900;
      line-height:1;
    }

    .bus-marker-inner:after{
      content:"";
      position:absolute;
      left:50%;
      bottom:-12px;
      transform:translateX(-50%);
      width:0;
      height:0;
      border-left:10px solid transparent;
      border-right:10px solid transparent;
      border-top:13px solid #2e8cff;
    }

    .bus-line{
      font-size:18px;
      display:block;
      white-space:nowrap;
    }

    .bus-dest{
      display:block;
      margin-top:2px;
      font-size:10px;
      opacity:.95;
      max-width:96px;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .stop-map-marker{
      background:transparent !important;
      border:0 !important;
    }

    .stop-map-inner{
      transform:translate(-50%,-50%);
      background:#174ea6;
      color:#fff;
      border:2px solid #63b5ff;
      border-radius:3px;
      padding:3px 7px;
      font-size:13px;
      font-weight:900;
      white-space:nowrap;
      box-shadow:0 2px 8px rgba(0,0,0,.35);
    }

    .vehicle-row .route-badge{
      width:180px;
      min-width:180px;
      height:100px;
      font-size:52px;
    }

    .vehicle-dest{
      text-align:center;
    }

    .vehicle-sub{
      text-align:center;
      font-size:24px;
    }

    .drawer-backdrop{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.55);
      z-index:99;
      opacity:0;
      pointer-events:none;
      transition:.18s ease;
    }

    .drawer{
      position:fixed;
      top:0;
      left:0;
      bottom:0;
      width:65vw;
      max-width:460px;
      min-width:310px;
      background:#303030;
      z-index:100;
      transform:translateX(-105%);
      transition:.2s ease;
      box-shadow:8px 0 25px rgba(0,0,0,.45);
      padding-top:52px;
      color:white;
    }

    .drawer.open{
      transform:translateX(0);
    }

    .drawer-backdrop.open{
      opacity:1;
      pointer-events:auto;
    }

    .drawer-logo{
      width:64px;
      height:64px;
      margin:22px 26px;
      background:#f4f4f4;
      color:#337cff;
      display:flex;
      align-items:center;
      justify-content:center;
      border-radius:5px;
      font-weight:900;
      font-size:26px;
    }

    .drawer-title{
      padding:0 26px 78px;
      font-size:28px;
      font-weight:850;
    }

    .drawer-item{
      height:76px;
      display:flex;
      align-items:center;
      gap:22px;
      padding:0 34px;
      font-size:24px;
      font-weight:800;
      color:white;
    }

    .drawer-icon{
      width:38px;
      text-align:center;
      font-size:32px;
    }

    .toast{
      position:fixed;
      left:20px;
      right:20px;
      bottom:28px;
      z-index:200;
      background:#111;
      color:#fff;
      padding:15px 18px;
      border-radius:6px;
      font-size:20px;
      box-shadow:var(--shadow);
      display:none;
      text-align:center;
    }

    .toast.show{
      display:block;
    }

    .loading{
      position:fixed;
      top:160px;
      left:50%;
      transform:translateX(-50%);
      z-index:150;
      width:72px;
      height:72px;
      border-radius:50%;
      background:#1d1d23;
      box-shadow:var(--shadow);
      display:none;
      align-items:center;
      justify-content:center;
    }

    .loading.show{
      display:flex;
    }

    .spinner{
      width:34px;
      height:34px;
      border:5px solid rgba(255,255,255,.25);
      border-top-color:#fff;
      border-radius:50%;
      animation:spin .8s linear infinite;
    }

    @keyframes spin{
      to{transform:rotate(360deg);}
    }

    @media(max-width:520px){
      .topbar{
        height:72px;
        min-height:72px;
      }

      .top-title{
        font-size:32px;
      }

      .statusbar{
        height:44px;
        min-height:44px;
        font-size:22px;
      }

      .departure-row{
        grid-template-columns:180px 1fr 142px;
      }

      .route-badge{
        width:180px;
        min-width:180px;
        height:100px;
        font-size:50px;
      }

      .departure-destination{
        font-size:30px;
      }

      .departure-time{
        font-size:48px;
      }

      .trip-head{
        grid-template-columns:190px 1fr 184px;
      }
    }

    @media(max-width:390px){
      .top-title{
        font-size:28px;
      }

      .statusbar{
        font-size:19px;
        gap:11px;
      }

      .departure-row{
        grid-template-columns:138px 1fr 118px;
      }

      .route-badge{
        width:138px;
        min-width:138px;
        height:78px;
        font-size:40px;
      }

      .departure-destination{
        font-size:25px;
      }

      .departure-sub,
      .departure-stop{
        font-size:20px;
      }

      .departure-time{
        font-size:37px;
      }

      .trip-head{
        grid-template-columns:138px 1fr 118px;
      }

      .delay-box{
        width:118px;
        height:80px;
        font-size:30px;
      }

      .trip-destination{
        font-size:25px;
      }

      .trip-stop-row{
        grid-template-columns:105px 1fr 82px;
        padding:0 12px;
      }

      .trip-time{
        font-size:28px;
      }

      .trip-stop-name{
        font-size:21px;
      }

      .trip-countdown{
        font-size:29px;
      }

      .stop-badge{
        width:112px;
        min-width:112px;
        height:70px;
      }

      .stop-badge .brand{
        font-size:12px;
      }

      .stop-badge .code{
        font-size:34px;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <header class="topbar">
      <button id="backBtn" class="top-btn" type="button" onclick="handleBack()">‹</button>
      <button id="menuBtn" class="top-btn" type="button" onclick="openDrawer()">☰</button>
      <div id="topTitle" class="top-title">Bluestar Unilink Menetrend</div>
      <button class="top-btn small" type="button" onclick="locateMe()">⌖</button>
    </header>

    <div class="statusbar">
      <span id="liveStatus"><span class="dot err"></span>LIVE: ...</span>
      <span id="gtfsStatus"><span class="dot err"></span>GTFS: ...</span>
    </div>

    <main id="content" class="content"></main>
  </div>

  <div id="drawerBackdrop" class="drawer-backdrop" onclick="closeDrawer()"></div>

  <aside id="drawer" class="drawer">
    <div class="drawer-logo">BU</div>
    <div class="drawer-title">Bluestar Unilink<br />Menetrend</div>

    <button class="drawer-item" onclick="goHome(); closeDrawer();">
      <span class="drawer-icon">⌕</span>
      <span>Megállóhelyi Menetrend</span>
    </button>

    <button class="drawer-item" onclick="showMap(); closeDrawer();">
      <span class="drawer-icon">🗺</span>
      <span>Térkép</span>
    </button>

    <button class="drawer-item" onclick="showVehicles(null); closeDrawer();">
      <span class="drawer-icon">🚌</span>
      <span>Közlekedési információk</span>
    </button>

    <button class="drawer-item" onclick="refreshCurrent(); closeDrawer();">
      <span class="drawer-icon">↻</span>
      <span>Kedvencek frissítése</span>
    </button>

    <button class="drawer-item" onclick="clearFavorites(); closeDrawer();">
      <span class="drawer-icon">🗑</span>
      <span>Kedvencek törlése</span>
    </button>

    <button class="drawer-item" onclick="showAbout(); closeDrawer();">
      <span class="drawer-icon">ⓘ</span>
      <span>Az alkalmazásról</span>
    </button>
  </aside>

  <div id="loading" class="loading">
    <div class="spinner"></div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const content = document.getElementById("content");
    const topTitle = document.getElementById("topTitle");
    const backBtn = document.getElementById("backBtn");
    const menuBtn = document.getElementById("menuBtn");
    const liveStatus = document.getElementById("liveStatus");
    const gtfsStatus = document.getElementById("gtfsStatus");
    const loading = document.getElementById("loading");

    const state = {
      view: "home",
      query: "",
      stop: null,
      route: null,
      tripId: null,
      mapLine: null,
      status: null,
      mainMap: null,
      routeMap: null,
      timers: [],
      nav: []
    };

    const favKey = "bluestar_unilink_favourites_v3";

    function clearTimers(){
      for(const t of state.timers){
        clearTimeout(t);
        clearInterval(t);
      }
      state.timers = [];
    }

    function showLoading(on){
      loading.classList.toggle("show", !!on);
    }

    function toast(msg){
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      setTimeout(() => el.classList.remove("show"), 2300);
    }

    function esc(v){
      return String(v ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function clean(v){
      return String(v ?? "")
        .replaceAll("_"," ")
        .replace(/\s+/g," ")
        .trim();
    }

    function normLine(v){
      return clean(v).toUpperCase().replace(/\s+/g,"");
    }

    function apiUrl(path){
      return path;
    }

    async function api(path){
      const r = await fetch(apiUrl(path), {
        cache: "no-store",
        headers: {
          "Accept": "application/json"
        }
      });

      if(!r.ok){
        let text = "";
        try{
          text = await r.text();
        }catch(e){}
        throw new Error(text || ("HTTP " + r.status));
      }

      return await r.json();
    }

    function setChrome(title, canBack){
      topTitle.textContent = title || "Bluestar Unilink Menetrend";
      backBtn.style.display = canBack ? "flex" : "none";
      menuBtn.style.display = canBack ? "none" : "flex";
    }

    function snapshot(){
      return {
        view: state.view,
        query: state.query,
        stop: state.stop,
        route: state.route,
        tripId: state.tripId,
        mapLine: state.mapLine
      };
    }

    function navigate(view, params = {}, push = true){
      if(push){
        state.nav.push(snapshot());
      }

      state.view = view;

      if("query" in params) state.query = params.query;
      if("stop" in params) state.stop = params.stop;
      if("route" in params) state.route = params.route;
      if("tripId" in params) state.tripId = params.tripId;
      if("mapLine" in params) state.mapLine = params.mapLine;

      render();
    }

    function handleBack(){
      const prev = state.nav.pop();

      if(prev){
        state.view = prev.view;
        state.query = prev.query;
        state.stop = prev.stop;
        state.route = prev.route;
        state.tripId = prev.tripId;
        state.mapLine = prev.mapLine;
        render();
        return;
      }

      goHome(false);
    }

    function goHome(push = true){
      if(push){
        navigate("home", {}, true);
      }else{
        state.view = "home";
        state.query = "";
        state.stop = null;
        state.route = null;
        state.tripId = null;
        state.mapLine = null;
        render();
      }
    }

    function openDrawer(){
      document.getElementById("drawer").classList.add("open");
      document.getElementById("drawerBackdrop").classList.add("open");
    }

    function closeDrawer(){
      document.getElementById("drawer").classList.remove("open");
      document.getElementById("drawerBackdrop").classList.remove("open");
    }

    function getFavs(){
      try{
        return JSON.parse(localStorage.getItem(favKey) || '{"stops":[],"routes":[]}');
      }catch(e){
        return {stops:[], routes:[]};
      }
    }

    function saveFavs(favs){
      localStorage.setItem(favKey, JSON.stringify(favs));
    }

    function isStopFav(stopId){
      return getFavs().stops.some(x => x.stop_id === stopId);
    }

    function isRouteFav(line){
      const ln = normLine(line);
      return getFavs().routes.some(x => normLine(x.short_name || x.line) === ln);
    }

    function toggleStopFav(stop){
      if(!stop) return;

      const favs = getFavs();
      const idx = favs.stops.findIndex(x => x.stop_id === stop.stop_id);

      if(idx >= 0){
        favs.stops.splice(idx, 1);
        toast("Megálló törölve a kedvencekből.");
      }else{
        favs.stops.unshift(stop);
        toast("Megálló mentve a kedvencekbe.");
      }

      saveFavs(favs);
      render();
    }

    function toggleRouteFav(route){
      if(!route) return;

      const line = route.short_name || route.line || route;
      const favs = getFavs();
      const idx = favs.routes.findIndex(x => normLine(x.short_name || x.line) === normLine(line));

      if(idx >= 0){
        favs.routes.splice(idx, 1);
        toast("Viszonylat törölve a kedvencekből.");
      }else{
        favs.routes.unshift({
          short_name: line,
          long_name: route.long_name || ""
        });
        toast("Viszonylat mentve a kedvencekbe.");
      }

      saveFavs(favs);
      render();
    }

    function clearFavorites(){
      localStorage.removeItem(favKey);
      toast("Kedvencek törölve.");
      render();
    }

    function brandForStop(stop){
      const name = clean(stop?.stop_name || stop?.name || "");
      const id = clean(stop?.stop_id || "");

      if(/^U/i.test(name) || /^U/i.test(id)){
        return "UNILINK";
      }

      return "BLUESTAR";
    }

    function stopCode(stop){
      if(stop?.indicator) return String(stop.indicator).toUpperCase();

      const name = clean(stop?.stop_name || "");
      const m = name.match(/\[([A-Za-z0-9]+)\]/);

      if(m) return m[1].toUpperCase();

      const id = clean(stop?.stop_id || "");

      if(id.length >= 2) return id.slice(-2).toUpperCase();

      return "BUS";
    }

    function stopBadge(stop){
      const brand = brandForStop(stop);
      const code = stopCode(stop);

      return `
        <div class="stop-badge ${brand === "UNILINK" ? "unilink" : ""}">
          <div class="brand">${esc(brand)}</div>
          <div class="code">${esc(code)}</div>
        </div>
      `;
    }

    function routeBadge(line, small = false){
      return `<div class="route-badge ${small ? "small" : ""}">${esc(line || "?")}</div>`;
    }

    function delayClass(delay){
      if(delay === null || delay === undefined || delay === "") return "";
      const d = Number(delay);

      if(Number.isNaN(d)) return "";

      if(d < 0) return "early";
      if(d > 2) return "late";

      return "live";
    }

    function delayText(delay){
      if(delay === null || delay === undefined || delay === "") return "--";

      const d = Number(delay);

      if(Number.isNaN(d)) return "--";

      if(d === 0) return "0,0";
      if(d > 0) return "+" + d + ",0";
      return String(d).replace("-", "−") + ",0";
    }

    function minsText(row){
      const m = Number(row.minutes);

      if(Number.isNaN(m)) return "";

      if(row.vehicleAtStop || m <= 0) return "DUE";
      if(m === 1) return "1'";

      return m + "'";
    }

    function openStop(stop){
      navigate("stop", {stop}, true);
    }

    function openRoute(route){
      const line = route.short_name || route.line || route;
      navigate("route", {route:{short_name:line, long_name:route.long_name || ""}}, true);
    }

    function openTrip(tripId){
      navigate("trip", {tripId}, true);
    }

    function showMap(line = null){
      navigate("map", {mapLine: line}, true);
    }

    function showVehicles(line = null){
      navigate("vehicles", {mapLine: line}, true);
    }

    function showRouteMap(line){
      navigate("routeMap", {mapLine: line}, true);
    }

    function showAbout(){
      navigate("about", {}, true);
    }

    async function refreshStatus(){
      try{
        const s = await api("/api/status");
        state.status = s;

        const liveOk = !!s.live?.ok;
        const gtfsOk = !!s.gtfs?.ok;

        liveStatus.innerHTML = `
          <span class="dot ${liveOk ? "" : "err"}"></span>
          LIVE: ${liveOk ? "ON" : "ERR"} (${esc(s.live?.activeCount ?? 0)})
        `;

        gtfsStatus.innerHTML = `
          <span class="dot ${gtfsOk ? "" : "err"}"></span>
          GTFS: ${gtfsOk ? "OK" : "ERR"}
        `;
      }catch(e){
        liveStatus.innerHTML = `<span class="dot err"></span>LIVE: ERR`;
        gtfsStatus.innerHTML = `<span class="dot err"></span>GTFS: ERR`;
      }
    }

    function render(){
      clearTimers();
      content.classList.remove("no-scroll");

      if(state.mainMap){
        state.mainMap.remove();
        state.mainMap = null;
      }

      if(state.routeMap){
        state.routeMap.remove();
        state.routeMap = null;
      }

      if(state.view === "home") return renderHome();
      if(state.view === "stop") return renderStop();
      if(state.view === "trip") return renderTrip();
      if(state.view === "route") return renderRoute();
      if(state.view === "vehicles") return renderVehicles();
      if(state.view === "map") return renderMapPage();
      if(state.view === "routeMap") return renderRouteMapPage();
      if(state.view === "about") return renderAbout();

      renderHome();
    }

    function renderHome(){
      setChrome("Bluestar Unilink Menetrend", false);

      content.innerHTML = `
        <div class="page">
          <div class="search-wrap">
            <div class="search-box">
              <label>Megálló vagy viszonylat keresése</label>
              <div class="search-icon">⌕</div>
              <input
                id="searchInput"
                type="text"
                autocomplete="off"
                autocapitalize="none"
                placeholder="Megálló vagy járat keresése..."
                value="${esc(state.query)}"
              />
              <button class="clear-btn" id="clearSearch" type="button">×</button>
            </div>
          </div>

          <div id="searchArea"></div>
        </div>
      `;

      const input = document.getElementById("searchInput");
      const clear = document.getElementById("clearSearch");

      input.focus();

      clear.onclick = () => {
        state.query = "";
        input.value = "";
        renderSearchResults("");
        input.focus();
      };

      let typingTimer = null;

      input.addEventListener("input", () => {
        state.query = input.value;

        clearTimeout(typingTimer);
        typingTimer = setTimeout(() => renderSearchResults(state.query), 180);
      });

      renderSearchResults(state.query);
    }

    async function renderSearchResults(q){
      const area = document.getElementById("searchArea");

      if(!area) return;

      q = clean(q);

      if(!q){
        const favs = getFavs();
        const stopRows = favs.stops.map(stop => `
          <button class="result-row" onclick='openStop(${JSON.stringify(stop).replaceAll("'","&#039;")})'>
            ${stopBadge(stop)}
            <div class="result-main">
              <div class="result-name">${esc(stop.stop_name)}</div>
              <div class="result-sub">${esc(stop.stop_id)}</div>
            </div>
            <div class="arrow">→</div>
          </button>
        `).join("");

        const routeRows = favs.routes.map(route => `
          <button class="result-row" onclick='openRoute(${JSON.stringify(route).replaceAll("'","&#039;")})'>
            ${routeBadge(route.short_name || route.line)}
            <div class="result-main">
              <div class="result-name">${esc(route.short_name || route.line)}</div>
              <div class="result-sub">${esc(route.long_name || "Kedvenc viszonylat")}</div>
            </div>
            <div class="arrow">→</div>
          </button>
        `).join("");

        if(!stopRows && !routeRows){
          area.innerHTML = `
            <div class="section-title">Kedvenc megállók és viszonylatok</div>
            <div class="empty">
              Nincsenek kedvencek<br /><br />
              Megálló vagy viszonylat mentéséhez nyisd meg, majd érintsd meg a csillagot.
            </div>
          `;
        }else{
          area.innerHTML = `
            <div class="section-title">Kedvenc megállók és viszonylatok</div>
            ${stopRows ? `<div class="subheading">Megállók</div>${stopRows}` : ""}
            ${routeRows ? `<div class="subheading">Járatok</div>${routeRows}` : ""}
          `;
        }

        return;
      }

      area.innerHTML = `<div class="empty">Keresés...</div>`;

      try{
        const data = await api("/api/search?q=" + encodeURIComponent(q) + "&limit=35");

        const stops = data.stops || [];
        const routes = data.routes || [];

        const stopRows = stops.map(stop => `
          <button class="result-row" onclick='openStop(${JSON.stringify(stop).replaceAll("'","&#039;")})'>
            ${stopBadge(stop)}
            <div class="result-main">
              <div class="result-name">${esc(stop.stop_name)}</div>
              <div class="result-sub">${esc(stop.stop_id)}</div>
            </div>
            <div class="arrow">→</div>
          </button>
        `).join("");

        const routeRows = routes.map(route => `
          <button class="result-row" onclick='openRoute(${JSON.stringify(route).replaceAll("'","&#039;")})'>
            ${routeBadge(route.short_name)}
            <div class="result-main">
              <div class="result-name">${esc(route.short_name)}</div>
              <div class="result-sub">${esc(route.long_name || "Viszonylat")}</div>
            </div>
            <div class="arrow">→</div>
          </button>
        `).join("");

        area.innerHTML = `
          <div class="section-title">Találatok a(z) "${esc(q)}" kifejezésre</div>
          ${stops.length ? `<div class="subheading">Megállók</div>${stopRows}` : ""}
          ${routes.length ? `<div class="subheading">Járatok</div>${routeRows}` : ""}
          ${(!stops.length && !routes.length) ? `<div class="empty">Nincs találat.</div>` : ""}
        `;
      }catch(e){
        area.innerHTML = `<div class="empty">Hiba a keresésnél.</div>`;
      }
    }

    async function renderStop(){
      const stop = state.stop;

      setChrome("Megálló", true);

      if(!stop){
        content.innerHTML = `<div class="empty">Nincs kiválasztott megálló.</div>`;
        return;
      }

      const fav = isStopFav(stop.stop_id);

      content.innerHTML = `
        <div class="page">
          <div class="stop-title-strip">
            ${esc(stop.stop_name)} (${esc(stop.stop_id)})
            <button class="star" onclick='toggleStopFav(${JSON.stringify(stop).replaceAll("'","&#039;")})'>${fav ? "★" : "☆"}</button>
          </div>
          <div id="departuresArea">
            <div class="empty">Indulások betöltése...</div>
          </div>
        </div>
      `;

      await loadStopDepartures();

      state.timers.push(setInterval(loadStopDepartures, 20000));
    }

    async function loadStopDepartures(){
      const stop = state.stop;
      const area = document.getElementById("departuresArea");

      if(!stop || !area) return;

      try{
        const data = await api("/api/stops/" + encodeURIComponent(stop.stop_id) + "/departures?minutes=90");
        const deps = data.departures || [];

        if(!deps.length){
          area.innerHTML = `
            <div class="empty">
              Nincs indulás a következő időablakban.<br /><br />
              Fehér: menetrend (GTFS) · Zöld: élő (LIVE)
            </div>
          `;
          return;
        }

        area.innerHTML = deps.map(row => {
          const live = row.isLive || row.source === "live";
          const due = live && (row.vehicleAtStop || Number(row.minutes) <= 1);

          return `
            <button class="departure-row ${live ? "live" : ""} ${due ? "due" : ""} ${row.vehicleAtStop ? "at-stop" : ""}"
                    onclick='openTrip("${esc(row.tripId)}")'>
              <div>${routeBadge(row.line)}</div>
              <div class="departure-center">
                <div class="departure-destination">${esc(row.destinationShort || row.destination)}</div>
                <div class="departure-sub">${live ? "Élő adat" : "Menetrendi adat"}</div>
                <div class="departure-stop">${esc(row.stopName || stop.stop_name)}</div>
              </div>
              <div>
                <div class="departure-time">${due ? "DUE" : esc(row.displayTime || row.scheduledTime || "")}</div>
                <div class="departure-mins">${esc(minsText(row))}</div>
              </div>
            </button>
          `;
        }).join("");
      }catch(e){
        area.innerHTML = `
          <div class="empty">
            Hiba az indulások betöltésénél.<br /><br />
            Fehér: menetrend (GTFS) · Zöld: élő (LIVE)
          </div>
        `;
      }
    }

    async function renderTrip(){
      setChrome("Járat", true);

      const tripId = state.tripId;

      if(!tripId){
        content.innerHTML = `<div class="empty">Nincs kiválasztott járat.</div>`;
        return;
      }

      content.innerHTML = `<div class="empty">Járat betöltése...</div>`;

      await loadTrip();

      state.timers.push(setInterval(loadTrip, 20000));
    }

    async function loadTrip(){
      const tripId = state.tripId;

      if(!tripId) return;

      try{
        const data = await api("/api/trip/" + encodeURIComponent(tripId));
        const trip = data.trip || {};
        const stops = data.stops || [];

        const dClass = delayClass(trip.delayMinutes);
        const sourceText = trip.source === "live" ? "Élő adat" : "Menetrendi adat";
        const vehicleText = trip.vehicleRef ? `Jármű: ${esc(trip.vehicleRef)}` : "";
        const nextText = trip.currentStopName ? `Következő / aktuális megálló: ${esc(trip.currentStopName)}` : "";

        content.innerHTML = `
          <div class="page">
            <div class="trip-head">
              <div>${routeBadge(trip.line || "?")}</div>
              <div class="trip-main">
                <div class="trip-destination">${esc(trip.destinationShort || trip.destination || "")}</div>
                <div class="trip-meta">
                  ${esc(sourceText)}<br />
                  ${vehicleText}<br />
                  <span class="trip-next">${nextText}</span>
                </div>
              </div>
              <div class="delay-box ${dClass}">${esc(delayText(trip.delayMinutes))}</div>
            </div>

            <div>
              ${stops.map(s => {
                const live = s.isLive || s.source === "live";
                const due = live && (s.vehicleAtStop || Number(s.minutes) <= 1);
                const passed = s.passed && !s.isCurrentStop;
                const countdown = due ? "DUE" : (live && Number(s.minutes) >= 0 ? `${s.minutes}'` : "");

                return `
                  <div class="trip-stop-row ${live ? "live" : ""} ${s.isCurrentStop || due ? "current" : ""} ${passed ? "passed" : ""}">
                    <div class="trip-time ${live ? "live" : ""}">${esc(s.displayTime || s.scheduledTime || "")}</div>
                    <div class="trip-stop-name">${esc(s.stopName || "")}</div>
                    <div class="trip-countdown ${countdown ? "" : "empty"}">${esc(countdown)}</div>
                  </div>
                `;
              }).join("")}
            </div>
          </div>
        `;
      }catch(e){
        content.innerHTML = `<div class="empty">Hiba a járat betöltésénél.</div>`;
      }
    }

    async function renderRoute(){
      const route = state.route;
      const line = route?.short_name || route?.line || route;

      setChrome("Viszonylat", true);

      if(!line){
        content.innerHTML = `<div class="empty">Nincs kiválasztott viszonylat.</div>`;
        return;
      }

      const fav = isRouteFav(line);

      content.innerHTML = `
        <div class="page">
          <div class="route-header">
            ${routeBadge(line, true)}
            <div style="flex:1;min-width:0;">${esc(line)}</div>
            <button class="star" onclick='toggleRouteFav(${JSON.stringify({short_name:line}).replaceAll("'","&#039;")})'>${fav ? "★" : "☆"}</button>
          </div>

          <div class="section-title">A viszonylaton közlekedő járművek listája:</div>
          <button class="route-action" onclick='showVehicles("${esc(line)}")'>
            ${routeBadge(line)}
            <div class="route-action-main">
              <div class="route-action-title">Járművek listája forgalmi számmal</div>
              <div class="route-action-sub">Csak aktuális live járművek</div>
            </div>
          </button>

          <div class="section-title">A viszonylat útvonala térképen:</div>
          <button class="route-action" onclick='showRouteMap("${esc(line)}")'>
            ${routeBadge(line)}
            <div class="route-action-main">
              <div class="route-action-title">Térkép megtekintése</div>
              <div class="route-action-sub">Útvonal + bejelentkezett járművek</div>
            </div>
          </button>

          <div class="section-title">A viszonylat megállóinak listája irányonként:</div>
          <div id="routeDirections">
            <div class="empty">Viszonylat betöltése...</div>
          </div>
        </div>
      `;

      try{
        const data = await api("/api/route/" + encodeURIComponent(line));
        const dirs = data.directions || [];

        const holder = document.getElementById("routeDirections");

        if(!dirs.length){
          holder.innerHTML = `<div class="empty">Nincs megállólista ehhez a viszonylathoz.</div>`;
          return;
        }

        holder.innerHTML = dirs.map((d, idx) => `
          <button class="direction-row" onclick='showDirectionStops(${JSON.stringify(d).replaceAll("'","&#039;")})'>
            ${routeBadge(line)}
            <div class="direction-main">
              <div class="direction-title">► ${esc(d.to?.stop_name || d.headsign || "")}</div>
              <div class="direction-sub">${esc(d.from?.stop_name || "")} → ${esc(d.to?.stop_name || "")} · ${esc(d.stop_count || 0)} megálló</div>
            </div>
            <div class="arrow">→</div>
          </button>
        `).join("");
      }catch(e){
        const holder = document.getElementById("routeDirections");
        if(holder) holder.innerHTML = `<div class="empty">Hiba a viszonylat betöltésénél.</div>`;
      }
    }

    function showDirectionStops(direction){
      const line = state.route?.short_name || state.route?.line || state.route || "";

      setChrome("Megállók", true);

      content.innerHTML = `
        <div class="page">
          <div class="route-header">
            ${routeBadge(line, true)}
            <div style="flex:1;min-width:0;">${esc(direction.to?.stop_name || direction.headsign || "")}</div>
          </div>

          ${(direction.stops || []).map(stop => `
            <button class="result-row" onclick='openStop(${JSON.stringify(stop).replaceAll("'","&#039;")})'>
              ${stopBadge(stop)}
              <div class="result-main">
                <div class="result-name">${esc(stop.stop_name)}</div>
                <div class="result-sub">${esc(stop.stop_id)}</div>
              </div>
              <div class="arrow">→</div>
            </button>
          `).join("")}
        </div>
      `;
    }

    async function renderVehicles(){
      const line = state.mapLine;

      setChrome("Járművek", true);

      content.innerHTML = `<div class="empty">Járművek betöltése...</div>`;

      await loadVehicles(line);

      state.timers.push(setInterval(() => loadVehicles(line), 15000));
    }

    async function loadVehicles(line){
      try{
        const path = line
          ? "/api/route/" + encodeURIComponent(line) + "/vehicles"
          : "/api/live/vehicles";

        const data = await api(path);
        const vehicles = data.vehicles || [];

        if(!vehicles.length){
          content.innerHTML = `
            <div class="page">
              <div class="empty">Nincs aktuális bejelentkezett jármű.</div>
            </div>
          `;
          return;
        }

        content.innerHTML = `
          <div class="page">
            ${vehicles.map(v => `
              <button class="vehicle-row" onclick='showMap("${esc(v.publishedLineName || v.lineRef || "")}")'>
                ${routeBadge(v.publishedLineName || v.lineRef || "?")}
                <div class="vehicle-main">
                  <div class="vehicle-dest">${esc(v.destinationShort || v.destinationName || "")}</div>
                  <div class="vehicle-sub">
                    ${esc(v.vehicleRef || v.vehicleUniqueId || "")}<br />
                    ${esc(v.currentStopName || "Mozgásban")}
                  </div>
                </div>
              </button>
            `).join("")}
          </div>
        `;
      }catch(e){
        content.innerHTML = `<div class="empty">Hiba a járművek betöltésénél.</div>`;
      }
    }

    function busIcon(v){
      const line = esc(v.publishedLineName || v.lineRef || "?");
      const dest = esc(v.destinationShort || v.destinationName || "");

      return L.divIcon({
        className: "bus-marker",
        html: `
          <div class="bus-marker-inner">
            <div>
              <span class="bus-line">${line}</span>
              <span class="bus-dest">${dest}</span>
            </div>
          </div>
        `,
        iconSize: [1, 1],
        iconAnchor: [0, 0]
      });
    }

    function stopMapIcon(stop){
      return L.divIcon({
        className: "stop-map-marker",
        html: `<div class="stop-map-inner">${esc(stop.indicator || stopCode(stop))}</div>`,
        iconSize: [1, 1],
        iconAnchor: [0, 0]
      });
    }

    async function renderMapPage(){
      const line = state.mapLine;

      setChrome("Térkép", true);
      content.classList.add("no-scroll");

      content.innerHTML = `
        <div class="page">
          <div class="map-controls">
            <button class="map-btn">Szűrő: ${esc(line || "mind")}</button>
            <button class="map-btn" onclick="state.mapLine=null; render()">Szűrő törlése</button>
            <button class="map-btn" onclick="loadMainMap()">Frissítés</button>
          </div>
          <div class="map-holder">
            <div id="map"></div>
          </div>
        </div>
      `;

      state.mainMap = L.map("map", {
        zoomControl: true
      }).setView([50.91, -1.40], 11);

      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: "© OpenStreetMap"
      }).addTo(state.mainMap);

      setTimeout(() => state.mainMap.invalidateSize(), 250);

      await loadMainMap();

      state.timers.push(setInterval(loadMainMap, 15000));
    }

    async function loadMainMap(){
      if(!state.mainMap) return;

      try{
        const line = state.mapLine;
        const data = await api("/api/live/vehicles" + (line ? "?line=" + encodeURIComponent(line) : ""));
        const vehicles = data.vehicles || [];

        if(state.mainMap._vehicleLayer){
          state.mainMap.removeLayer(state.mainMap._vehicleLayer);
        }

        const layer = L.layerGroup();
        const bounds = [];

        for(const v of vehicles){
          if(v.latitude == null || v.longitude == null) continue;

          const marker = L.marker([v.latitude, v.longitude], {
            icon: busIcon(v)
          });

          marker.bindPopup(`
            <b>${esc(v.publishedLineName || v.lineRef || "")}</b><br />
            ${esc(v.destinationName || "")}<br />
            Veh: ${esc(v.vehicleRef || v.vehicleUniqueId || "")}<br />
            ${esc(v.currentStopName || "Mozgásban")}
          `);

          marker.addTo(layer);
          bounds.push([v.latitude, v.longitude]);
        }

        layer.addTo(state.mainMap);
        state.mainMap._vehicleLayer = layer;

        if(bounds.length){
          state.mainMap.fitBounds(bounds, {
            padding: [40, 40],
            maxZoom: line ? 14 : 12
          });
        }else{
          state.mainMap.setView([50.91, -1.40], 11);
        }
      }catch(e){
        toast("Térkép frissítési hiba.");
      }
    }

    async function renderRouteMapPage(){
      const line = state.mapLine;

      setChrome("Térkép", true);
      content.classList.add("no-scroll");

      content.innerHTML = `
        <div class="page">
          <div class="map-controls">
            <button class="map-btn">Szűrő: ${esc(line || "mind")}</button>
            <button class="map-btn" onclick='showMap("${esc(line || "")}")'>Csak járművek</button>
            <button class="map-btn" onclick="loadRouteMap()">Frissítés</button>
          </div>
          <div class="map-holder">
            <div id="routeMap"></div>
          </div>
        </div>
      `;

      state.routeMap = L.map("routeMap", {
        zoomControl: true
      }).setView([50.91, -1.40], 11);

      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: "© OpenStreetMap"
      }).addTo(state.routeMap);

      setTimeout(() => state.routeMap.invalidateSize(), 250);

      await loadRouteMap();

      state.timers.push(setInterval(loadRouteMap, 15000));
    }

    async function loadRouteMap(){
      if(!state.routeMap || !state.mapLine) return;

      try{
        const data = await api("/api/route/" + encodeURIComponent(state.mapLine) + "/map");

        if(state.routeMap._routeLayer){
          state.routeMap.removeLayer(state.routeMap._routeLayer);
        }

        const layer = L.layerGroup();
        const bounds = [];

        for(const shape of data.shapes || []){
          const pts = shape.points || [];

          if(pts.length){
            L.polyline(pts, {
              color: "#18aee8",
              weight: 5,
              opacity: .9
            }).addTo(layer);

            for(const p of pts){
              bounds.push(p);
            }
          }
        }

        for(const d of data.directions || []){
          for(const stop of d.stops || []){
            if(stop.stop_lat == null || stop.stop_lon == null) continue;

            L.marker([stop.stop_lat, stop.stop_lon], {
              icon: stopMapIcon(stop)
            }).bindPopup(`
              <b>${esc(stop.stop_name || "")}</b><br />
              ${esc(stop.stop_id || "")}
            `).addTo(layer);

            bounds.push([stop.stop_lat, stop.stop_lon]);
          }
        }

        for(const v of data.vehicles || []){
          if(v.latitude == null || v.longitude == null) continue;

          L.marker([v.latitude, v.longitude], {
            icon: busIcon(v)
          }).bindPopup(`
            <b>${esc(v.publishedLineName || v.lineRef || "")}</b><br />
            ${esc(v.destinationName || "")}<br />
            Veh: ${esc(v.vehicleRef || v.vehicleUniqueId || "")}<br />
            ${esc(v.currentStopName || "Mozgásban")}
          `).addTo(layer);

          bounds.push([v.latitude, v.longitude]);
        }

        layer.addTo(state.routeMap);
        state.routeMap._routeLayer = layer;

        if(bounds.length){
          state.routeMap.fitBounds(bounds, {
            padding: [35, 35],
            maxZoom: 14
          });
        }
      }catch(e){
        toast("Útvonal térkép hiba.");
      }
    }

    function locateMe(){
      if(!navigator.geolocation){
        toast("A helymeghatározás nem elérhető.");
        return;
      }

      navigator.geolocation.getCurrentPosition(
        pos => {
          const lat = pos.coords.latitude;
          const lon = pos.coords.longitude;

          if(state.mainMap){
            state.mainMap.setView([lat, lon], 15);
            L.circleMarker([lat, lon], {
              radius: 8,
              color: "#ffffff",
              fillColor: "#2e8cff",
              fillOpacity: 1
            }).addTo(state.mainMap);
          }else if(state.routeMap){
            state.routeMap.setView([lat, lon], 15);
            L.circleMarker([lat, lon], {
              radius: 8,
              color: "#ffffff",
              fillColor: "#2e8cff",
              fillOpacity: 1
            }).addTo(state.routeMap);
          }else{
            showMap();
          }
        },
        () => toast("Nem sikerült lekérni a helyzeted.")
      );
    }

    function renderAbout(){
      setChrome("Az alkalmazásról", true);

      content.innerHTML = `
        <div class="page">
          <div class="section-title">Bluestar Unilink Menetrend</div>
          <div class="empty">
            Ez az 1.0 alapra épülő felület.<br /><br />
            Fehér: menetrendi GTFS adat.<br />
            Zöld: élő SIRI live adat.<br /><br />
            A térkép csak az aktuálisan bejelentkezett live járműveket mutatja.
          </div>
        </div>
      `;
    }

    function refreshCurrent(){
      refreshStatus();

      if(state.view === "stop") loadStopDepartures();
      if(state.view === "trip") loadTrip();
      if(state.view === "vehicles") loadVehicles(state.mapLine);
      if(state.view === "map") loadMainMap();
      if(state.view === "routeMap") loadRouteMap();

      toast("Frissítve.");
    }

    window.showDirectionStops = showDirectionStops;
    window.openStop = openStop;
    window.openRoute = openRoute;
    window.openTrip = openTrip;
    window.showMap = showMap;
    window.showVehicles = showVehicles;
    window.showRouteMap = showRouteMap;
    window.toggleStopFav = toggleStopFav;
    window.toggleRouteFav = toggleRouteFav;
    window.handleBack = handleBack;
    window.goHome = goHome;
    window.openDrawer = openDrawer;
    window.closeDrawer = closeDrawer;
    window.clearFavorites = clearFavorites;
    window.showAbout = showAbout;
    window.refreshCurrent = refreshCurrent;
    window.locateMe = locateMe;
    window.loadMainMap = loadMainMap;
    window.loadRouteMap = loadRouteMap;

    refreshStatus();
    setInterval(refreshStatus, 20000);
    render();
  </script>
</body>
</html>
