{% extends "base.html" %}
{% block content %}
<h1>Járatok</h1>
<div class="grid">
  {% for r in routes %}
    <a class="card" href="/route/{{ r.route_id }}">
      <div class="route-badge">{{ r.route_short_name or r.route_id }}</div>
      <div class="route-sub">{{ r.route_long_name or r.agency_name }}</div>
    </a>
  {% endfor %}
</div>
{% endblock %}
