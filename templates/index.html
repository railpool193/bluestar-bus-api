<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <meta name="theme-color" content="#303030" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Bluestar Unilink Menetrend</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root {
      --bg: #303030;
      --top: #858585;
      --black: #050505;
      --line: #494949;
      --text: #f2f2f2;
      --muted: #c8c8c8;
      --muted2: #9e9e9e;
      --blue: #20aeea;
      --blue-dark: #168ac6;
      --header-blue: #3b7fd8;
      --live: #34ee3e;
      --red: #ff4c4c;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      font-size: 16px;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      overflow-x: hidden;
    }

    button,
    input {
      font: inherit;
    }

    .app {
      width: 100%;
      min-height: 100vh;
      background: var(--bg);
    }

    .topbar {
      height: 58px;
      background: var(--top);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 12px;
      position: sticky;
      top: 0;
      z-index: 60;
      color: #fff;
      box-shadow: 0 1px 0 rgba(255,255,255,.12);
    }

    .top-btn {
      border: 0;
      background: transparent;
      color: #fff;
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      font-size: 28px;
      line-height: 1;
      cursor: pointer;
      flex: 0 0 auto;
    }

    .title {
      font-size: 25px;
      font-weight: 850;
      letter-spacing: -.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      min-width: 0;
    }

    .lang-switch {
      display: flex;
      gap: 5px;
      flex: 0 0 auto;
    }

    .flag-btn {
      width: 34px;
      height: 30px;
      border: 0;
      border-radius: 7px;
      background: rgba(0,0,0,.25);
      font-size: 19px;
      opacity: .62;
      cursor: pointer;
    }

    .flag-btn.active {
      opacity: 1;
      outline: 2px solid #fff;
    }

    .statusbar {
      height: 36px;
      background: #050505;
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 0 12px;
      font-size: 18px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 99px;
      background: var(--live);
      box-shadow: 0 0 10px var(--live);
      flex: 0 0 auto;
    }

    .dot.bad {
      background: var(--red);
      box-shadow: 0 0 8px var(--red);
    }

    .main {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
    }

    .search-box-wrap {
      padding: 16px 12px 10px;
    }

    .search-box {
      border: 2px solid #4b90ff;
      border-radius: 4px;
      min-height: 58px;
      display: flex;
      align-items: center;
      padding: 0 10px;
      position: relative;
      background: #2e2e2e;
    }

    .search-label {
      position: absolute;
      top: -13px;
      left: 16px;
      background: var(--bg);
      color: #4b90ff;
      padding: 0 6px;
      font-size: 16px;
    }

    .search-icon {
      font-size: 27px;
      color: #ddd;
      margin-right: 10px;
      flex: 0 0 auto;
    }

    .search-input {
      border: 0;
      outline: 0;
      background: transparent;
      color: #fff;
      min-width: 0;
      flex: 1;
      font-size: 24px;
      height: 52px;
    }

    .clear-btn {
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 99px;
      background: #d7d7d7;
      color: #333;
      font-size: 28px;
      font-weight: 850;
      cursor: pointer;
      flex: 0 0 auto;
    }

    .blue-header {
      background: var(--header-blue);
      color: #fff;
      padding: 8px 12px;
      font-size: 20px;
      font-weight: 850;
      line-height: 1.25;
    }

    .section-title {
      padding: 18px 18px 8px;
      font-size: 28px;
      font-weight: 900;
      color: #eee;
    }

    .row {
      min-height: 78px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 12px;
      cursor: pointer;
      overflow: hidden;
    }

    .row:hover {
      background: rgba(255,255,255,.04);
    }

    .row-main {
      flex: 1;
      min-width: 0;
      overflow: hidden;
    }

    .row-title {
      font-size: 22px;
      line-height: 1.14;
      font-weight: 850;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .row-sub {
      font-size: 16px;
      line-height: 1.25;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    .arrow {
      color: #fff;
      font-size: 25px;
      opacity: .9;
      flex: 0 0 auto;
      padding-left: 4px;
    }

    .badge {
      width: 86px;
      height: 50px;
      border-radius: 4px;
      background: linear-gradient(#22b9ef, #159bd4);
      box-shadow: inset 0 0 0 2px rgba(255,255,255,.12), inset 0 -5px 0 rgba(0,0,0,.12);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      overflow: hidden;
    }

    .badge .brand {
      font-size: 10px;
      line-height: 1;
      font-weight: 950;
      letter-spacing: .04em;
    }

    .badge .num {
      font-size: 28px;
      line-height: .98;
      font-weight: 950;
      white-space: nowrap;
      max-width: 80px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .badge.route-only .brand {
      display: none;
    }

    .badge.route-only .num {
      font-size: 30px;
    }

    .badge.small {
      width: 74px;
      height: 42px;
    }

    .badge.small .num {
      font-size: 24px;
    }

    .badge.small .brand {
      font-size: 8px;
    }

    .stop-title-bar {
      border-top: 1px solid #444;
      border-bottom: 1px solid #444;
      padding: 10px 12px;
      font-size: 22px;
      line-height: 1.2;
      font-weight: 850;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .depart-row {
      min-height: 78px;
      border-bottom: 1px solid var(--line);
      display: grid;
      grid-template-columns: 88px minmax(0,1fr) 78px;
      gap: 8px;
      align-items: center;
      padding: 7px 8px;
      cursor: pointer;
    }

    .depart-row.live .depart-dest,
    .depart-row.live .depart-time,
    .depart-row.live .depart-min {
      color: var(--live);
    }

    .depart-dest {
      font-size: 21px;
      font-weight: 850;
      line-height: 1.1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: center;
      color: #f3f3f3;
    }

    .depart-info {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.2;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .depart-time {
      color: #fff;
      font-size: 27px;
      font-weight: 850;
      text-align: right;
      white-space: nowrap;
    }

    .depart-min {
      color: var(--muted);
      font-size: 14px;
      text-align: right;
      margin-top: 3px;
    }

    .empty {
      padding: 30px 22px;
      color: #ddd;
      font-size: 22px;
      line-height: 1.35;
      font-weight: 750;
    }

    .hint {
      margin-top: 24px;
      color: #ddd;
      font-size: 20px;
      line-height: 1.35;
    }

    .depart-row.due-row,
    .stop-row-trip.vehicle-row,
    .stop-row-trip.due-row {
      animation: dueRowBlink 1s infinite;
    }

    @keyframes dueRowBlink {
      0%, 49% {
        background: rgba(52,238,62,.20);
        opacity: 1;
      }

      50%, 100% {
        background: rgba(52,238,62,.04);
        opacity: .58;
      }
    }

    .trip-head {
      display: grid;
      grid-template-columns: 88px minmax(0,1fr) 74px;
      gap: 10px;
      align-items: center;
      padding: 12px 8px;
      border-bottom: 4px solid var(--blue);
    }

    .trip-dest {
      text-align: center;
      font-size: 22px;
      font-weight: 850;
      line-height: 1.15;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .trip-sub {
      color: var(--muted);
      text-align: center;
      font-size: 15px;
      margin-top: 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .delay-box {
      background: #efefd8;
      color: #111;
      height: 48px;
      display: grid;
      place-items: center;
      font-size: 20px;
      font-weight: 950;
    }

    .stop-row-trip {
      min-height: 58px;
      display: grid;
      grid-template-columns: 74px minmax(0,1fr) 58px;
      gap: 8px;
      align-items: center;
      border-bottom: 1px solid var(--line);
      padding: 6px 12px;
    }

    .trip-time {
      font-size: 23px;
      font-weight: 780;
      color: #ddd;
      white-space: nowrap;
    }

    .trip-name {
      font-size: 20px;
      font-weight: 780;
      color: #ddd;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .trip-count {
      font-size: 20px;
      text-align: right;
      color: var(--live);
      white-space: nowrap;
    }

    .stop-row-trip.live .trip-time,
    .stop-row-trip.live .trip-name,
    .stop-row-trip.live .trip-count {
      color: var(--live);
    }

    .past {
      opacity: .55;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 12px;
      border-bottom: 1px solid var(--line);
    }

    .action-btn {
      border: 1px solid #666;
      background: #303030;
      color: #fff;
      border-radius: 4px;
      padding: 10px 14px;
      font-size: 18px;
      cursor: pointer;
    }

    .map-holder {
      width: 100%;
      height: calc(100vh - 154px);
      min-height: 430px;
      background: #222;
    }

    .vehicle-marker {
      position: relative;
      background: #2f8cff;
      color: white;
      border-radius: 8px;
      min-width: 50px;
      max-width: 104px;
      padding: 3px 7px 4px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,.35);
      border: 1px solid rgba(255,255,255,.25);
      font-weight: 950;
      line-height: 1.05;
    }

    .vehicle-marker .m-line {
      font-size: 15px;
    }

    .vehicle-marker .m-dest {
      font-size: 10px;
      max-width: 88px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      opacity: .96;
    }

    .vehicle-marker .m-fleet {
      font-size: 9px;
      line-height: 1;
      opacity: .95;
      margin-top: 1px;
    }

    .vehicle-marker:after {
      content: "";
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: -7px;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 8px solid #2f8cff;
    }

    .leaflet-popup-content {
      font-size: 14px;
      line-height: 1.35;
    }

    .route-summary {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border-bottom: 1px solid var(--line);
    }

    .route-name {
      font-size: 24px;
      font-weight: 850;
      flex: 1;
      min-width: 0;
    }

    .star {
      font-size: 28px;
      color: white;
      opacity: .9;
    }

    .small-blue-title {
      background: var(--header-blue);
      color: white;
      font-size: 21px;
      line-height: 1.2;
      font-weight: 850;
      padding: 8px 12px;
    }

    @media (max-width: 430px) {
      .topbar {
        height: 56px;
        padding: 0 10px;
        gap: 8px;
      }

      .title {
        font-size: 23px;
      }

      .statusbar {
        font-size: 16px;
        gap: 12px;
      }

      .search-input {
        font-size: 22px;
      }

      .section-title {
        font-size: 25px;
      }

      .row-title {
        font-size: 20px;
      }

      .row-sub {
        font-size: 15px;
      }

      .badge {
        width: 74px;
        height: 44px;
      }

      .badge .brand {
        font-size: 9px;
      }

      .badge .num {
        font-size: 25px;
      }

      .depart-row {
        grid-template-columns: 80px minmax(0,1fr) 72px;
        min-height: 76px;
      }

      .depart-dest {
        font-size: 20px;
      }

      .depart-info {
        font-size: 14px;
      }

      .depart-time {
        font-size: 25px;
      }

      .trip-head {
        grid-template-columns: 80px minmax(0,1fr) 62px;
      }

      .trip-dest {
        font-size: 20px;
      }

      .delay-box {
        font-size: 18px;
      }

      .stop-row-trip {
        grid-template-columns: 68px minmax(0,1fr) 50px;
      }

      .trip-time {
        font-size: 21px;
      }

      .trip-name {
        font-size: 18px;
      }

      .trip-count {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="topbar">
      <button class="top-btn" id="backBtn">☰</button>
      <div class="title" id="pageTitle">Bluestar Unilink</div>

      <div class="lang-switch">
        <button class="flag-btn" data-lang="hu">🇭🇺</button>
        <button class="flag-btn" data-lang="en">🇬🇧</button>
      </div>

      <button class="top-btn" id="locBtn">⌖</button>
    </div>

    <div class="statusbar">
      <div class="status-pill">
        <span class="dot" id="liveDot"></span>
        <span id="liveText">LIVE: …</span>
      </div>

      <div class="status-pill">
        <span class="dot" id="gtfsDot"></span>
        <span id="gtfsText">GTFS: …</span>
      </div>
    </div>

    <main class="main" id="appRoot"></main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const API = "";

    const root = document.getElementById("appRoot");
    const pageTitle = document.getElementById("pageTitle");
    const backBtn = document.getElementById("backBtn");
    const liveDot = document.getElementById("liveDot");
    const gtfsDot = document.getElementById("gtfsDot");
    const liveText = document.getElementById("liveText");
    const gtfsText = document.getElementById("gtfsText");

    let lang = localStorage.getItem("bu_lang") || "hu";
    let currentView = "home";
    let currentRoute = "";
    let currentStop = null;
    let currentMap = null;
    let mapLayerGroup = null;
    let routeShapeLayers = [];

    const I18N = {
      hu: {
        appTitle: "Bluestar Unilink Menetrend",
        searchLabel: "Megálló vagy viszonylat keresése",
        searchPlaceholder: "Megálló vagy járat keresése...",
        typeSearch: "Írj be megállót vagy járatot...",
        resultsFor: "Találatok a(z)",
        stops: "Megállók",
        routes: "Járatok",
        routeSub: "Viszonylat",
        noResults: "Nincs találat.",
        stopTitle: "Megálló",
        routeTitle: "Viszonylat",
        mapTitle: "Térkép",
        tripTitle: "Járat",
        vehiclesTitle: "Járművek",
        noDepartures: "Nincs indulás a következő időablakban.",
        whiteGreen: "Fehér: menetrend (GTFS) · Zöld: élő (LIVE)",
        timetable: "Menetrendi adat",
        live: "Élő adat",
        due: "Due",
        min: "perc",
        loadErrorDepartures: "Hiba az indulások betöltésénél.",
        vehiclesListHeader: "A viszonylaton közlekedő járművek listája:",
        vehiclesList: "Járművek listája forgalmi számmal",
        onlyActualLive: "Csak aktuális live járművek",
        routeMapHeader: "A viszonylat útvonala térképen:",
        viewMap: "Térkép megtekintése",
        routeAndVehicles: "Útvonal + bejelentkezett járművek",
        routeDirectionsHeader: "A viszonylat megállóinak listája irányonként:",
        noVehicles: "Nincs aktuális live jármű ezen a viszonylaton.",
        moving: "Mozgásban",
        atStop: "Megállóban",
        liveVehicleMatched: "Élő jármű párosítva",
        scheduleOnly: "Menetrendi adat",
        filter: "Szűrő",
        clearFilter: "Szűrő törlése",
        refresh: "Frissítés",
        all: "mind"
      },

      en: {
        appTitle: "Bluestar Unilink Timetable",
        searchLabel: "Search stop or route",
        searchPlaceholder: "Search stop or route...",
        typeSearch: "Type a stop or route...",
        resultsFor: "Results for",
        stops: "Stops",
        routes: "Routes",
        routeSub: "Route",
        noResults: "No results.",
        stopTitle: "Stop",
        routeTitle: "Route",
        mapTitle: "Map",
        tripTitle: "Trip",
        vehiclesTitle: "Vehicles",
        noDepartures: "No departures in the next time window.",
        whiteGreen: "White: scheduled (GTFS) · Green: live",
        timetable: "Scheduled",
        live: "Live",
        due: "Due",
        min: "min",
        loadErrorDepartures: "Error loading departures.",
        vehiclesListHeader: "Vehicles currently running on this route:",
        vehiclesList: "Vehicles with fleet numbers",
        onlyActualLive: "Only current live vehicles",
        routeMapHeader: "Route on map:",
        viewMap: "View map",
        routeAndVehicles: "Route + logged-in vehicles",
        routeDirectionsHeader: "Stops by direction:",
        noVehicles: "No current live vehicles on this route.",
        moving: "Moving",
        atStop: "At stop",
        liveVehicleMatched: "Live vehicle matched",
        scheduleOnly: "Scheduled",
        filter: "Filter",
        clearFilter: "Clear filter",
        refresh: "Refresh",
        all: "all"
      }
    };

    function t(key) {
      return (I18N[lang] && I18N[lang][key]) || I18N.hu[key] || key;
    }

    function esc(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function shortName(value, max = 30) {
      const s = String(value || "")
        .replaceAll("_", " ")
        .replace(/\s+/g, " ")
        .trim();

      if (s.length <= max) {
        return s;
      }

      return s.slice(0, Math.max(0, max - 1)).trimEnd() + "…";
    }

    function routeBadge(text, opts = {}) {
      const small = opts.small ? " small" : "";
      const routeOnly = opts.routeOnly ? " route-only" : "";
      const label = String(text || "BUS").trim() || "BUS";

      return `
        <div class="badge${small}${routeOnly}">
          <div class="brand">BLUESTAR</div>
          <div class="num">${esc(label)}</div>
        </div>
      `;
    }

    function stopBadgeCode(stop) {
      const stopName = stop.stop_name || stop.stopName || stop.name || "";
      const nameMatch = String(stopName).match(/\[([A-Z0-9]{1,6})\]/i);

      if (nameMatch) {
        return nameMatch[1].toUpperCase();
      }

      const platform = stop.platform_code || stop.platformCode || stop.platform || "";

      if (platform && String(platform).length <= 6 && /[A-Za-z]/.test(String(platform))) {
        return String(platform).toUpperCase();
      }

      return "BUS";
    }

    function setTitle(title, mode = "menu") {
      pageTitle.textContent = title;
      backBtn.textContent = mode === "back" ? "‹" : "☰";
    }

    function updateLanguageButtons() {
      document.documentElement.lang = lang;

      document.querySelectorAll(".flag-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.lang === lang);
      });
    }

    async function fetchJson(url) {
      const res = await fetch(url, {
        cache: "no-store"
      });

      if (!res.ok) {
        const text = await res.text().catch(() => "");
        throw new Error(text || `HTTP ${res.status}`);
      }

      return res.json();
    }

    async function loadStatus() {
      try {
        const data = await fetchJson(`${API}/api/status`);
        const liveOk = !!data.live?.ok;
        const gtfsOk = !!data.gtfs?.ok;

        liveDot.classList.toggle("bad", !liveOk);
        gtfsDot.classList.toggle("bad", !gtfsOk);

        liveText.textContent = liveOk
          ? `LIVE: ON (${data.live?.activeCount ?? 0})`
          : "LIVE: ERR";

        gtfsText.textContent = gtfsOk
          ? "GTFS: OK"
          : "GTFS: ERR";
      } catch (e) {
        liveDot.classList.add("bad");
        gtfsDot.classList.add("bad");
        liveText.textContent = "LIVE: ERR";
        gtfsText.textContent = "GTFS: ERR";
      }
    }

    function renderHome() {
      currentView = "home";
      currentRoute = "";
      currentStop = null;

      setTitle(t("appTitle"), "menu");

      root.innerHTML = `
        <div class="search-box-wrap">
          <div class="search-box">
            <div class="search-label">${esc(t("searchLabel"))}</div>
            <div class="search-icon">⌕</div>
            <input id="searchInput" class="search-input" autocomplete="off" placeholder="${esc(t("searchPlaceholder"))}" />
            <button id="clearSearch" class="clear-btn" style="display:none">×</button>
          </div>
        </div>

        <div id="searchResults" class="empty">${esc(t("typeSearch"))}</div>
      `;

      const input = document.getElementById("searchInput");
      const clear = document.getElementById("clearSearch");
      let timer = null;

      input.addEventListener("input", () => {
        clear.style.display = input.value ? "block" : "none";

        clearTimeout(timer);
        timer = setTimeout(() => doSearch(input.value.trim()), 250);
      });

      clear.addEventListener("click", () => {
        input.value = "";
        clear.style.display = "none";
        document.getElementById("searchResults").innerHTML = esc(t("typeSearch"));
        input.focus();
      });

      input.focus();
    }

    async function doSearch(q) {
      const target = document.getElementById("searchResults");

      if (!target) {
        return;
      }

      if (!q) {
        target.innerHTML = esc(t("typeSearch"));
        return;
      }

      target.innerHTML = `<div class="empty">Loading...</div>`;

      try {
        const data = await fetchJson(`${API}/api/search?q=${encodeURIComponent(q)}`);
        const stops = data.stops || [];
        const routes = data.routes || [];

        let html = `<div class="blue-header">${esc(t("resultsFor"))} "${esc(q)}"</div>`;

        if (!stops.length && !routes.length) {
          target.innerHTML = html + `<div class="empty">${esc(t("noResults"))}</div>`;
          return;
        }

        if (stops.length) {
          html += `<div class="section-title">${esc(t("stops"))}</div>`;

          for (const s of stops) {
            const id = s.stop_id || s.stopId || "";
            const name = s.stop_name || s.stopName || s.name || id;

            html += `
              <div class="row" data-stop="${esc(id)}">
                ${routeBadge(stopBadgeCode(s))}
                <div class="row-main">
                  <div class="row-title">${esc(shortName(name, 36))}</div>
                  <div class="row-sub">${esc(id)}</div>
                </div>
                <div class="arrow">→</div>
              </div>
            `;
          }
        }

        if (routes.length) {
          html += `<div class="section-title">${esc(t("routes"))}</div>`;

          for (const r of routes) {
            const line = r.route_short_name || r.routeShortName || r.short_name || r.shortName || "";

            html += `
              <div class="row" data-route="${esc(line)}">
                ${routeBadge(line, { routeOnly: true })}
                <div class="row-main">
                  <div class="row-title">${esc(line)}</div>
                  <div class="row-sub">${esc(t("routeSub"))}</div>
                </div>
                <div class="arrow">→</div>
              </div>
            `;
          }
        }

        target.innerHTML = html;

        target.querySelectorAll("[data-stop]").forEach(el => {
          el.addEventListener("click", () => showStop(el.dataset.stop));
        });

        target.querySelectorAll("[data-route]").forEach(el => {
          el.addEventListener("click", () => showRoute(el.dataset.route));
        });
      } catch (e) {
        target.innerHTML = `<div class="empty">${esc(e.message)}</div>`;
      }
    }

    async function showStop(stopId) {
      currentView = "stop";
      setTitle(t("stopTitle"), "back");
      root.innerHTML = `<div class="empty">Loading...</div>`;

      try {
        const data = await fetchJson(`${API}/api/stop/${encodeURIComponent(stopId)}/departures?window=120`);
        currentStop = data.stop;

        const stop = data.stop || {};
        const stopName = stop.stop_name || stop.stopName || stopId;
        const deps = data.departures || [];

        let html = `<div class="stop-title-bar">${esc(stopName)} (${esc(stopId)})</div>`;

        if (!deps.length) {
          html += `
            <div class="empty">
              ${esc(t("noDepartures"))}
              <div class="hint">${esc(t("whiteGreen"))}</div>
            </div>
          `;
        }

        for (const d of deps) {
          const live = !!d.live;
          const due = !!d.isDue || Number(d.minutes) <= 1;
          const cls = `depart-row${live ? " live" : ""}${due ? " due-row" : ""}`;
          const trip = d.trip_id || d.tripId || "";
          const source = live ? t("live") : t("timetable");
          const time = d.time || d.liveTime || d.scheduledTime || "--:--";
          const mins = due ? t("due") : (d.minutes != null ? `${d.minutes} ${t("min")}` : "");
          const dest = d.destination || d.destinationFull || d.headsign || "";
          const line = d.line || d.routeShortName || d.route_short_name || "";
          const vehicle = d.vehicleRef || d.vehicle_ref || d.fleetNumber || "";
          const sub = `${source} · ${vehicle ? vehicle + " · " : ""}${stopName}`;

          html += `
            <div class="${cls}" data-trip="${esc(trip)}" data-vehicle="${esc(vehicle)}">
              <div>${routeBadge(line, { routeOnly: true })}</div>

              <div>
                <div class="depart-dest">${esc(dest)}</div>
                <div class="depart-info">${esc(shortName(sub, 40))}</div>
              </div>

              <div>
                <div class="depart-time">${esc(time)}</div>
                <div class="depart-min">${esc(mins)}</div>
              </div>
            </div>
          `;
        }

        root.innerHTML = html;

        root.querySelectorAll("[data-trip]").forEach(el => {
          if (el.dataset.trip) {
            el.addEventListener("click", () => showTrip(el.dataset.trip, el.dataset.vehicle || ""));
          }
        });
      } catch (e) {
        root.innerHTML = `
          <div class="stop-title-bar">${esc(stopId)}</div>

          <div class="empty">
            ${esc(t("loadErrorDepartures"))}
            <div class="hint">${esc(e.message)}</div>
          </div>
        `;
      }
    }

    async function showRoute(line) {
      currentView = "route";
      currentRoute = line;

      setTitle(t("routeTitle"), "back");
      root.innerHTML = `<div class="empty">Loading...</div>`;

      try {
        const data = await fetchJson(`${API}/api/route/${encodeURIComponent(line)}`);

        let html = `
          <div class="route-summary">
            ${routeBadge(line, { routeOnly: true, small: true })}
            <div class="route-name">${esc(line)}</div>
            <div class="star">☆</div>
          </div>

          <div class="small-blue-title">${esc(t("vehiclesListHeader"))}</div>

          <div class="row" id="openVehicles">
            ${routeBadge(line, { routeOnly: true })}
            <div class="row-main">
              <div class="row-title">${esc(t("vehiclesList"))}</div>
              <div class="row-sub">${esc(t("onlyActualLive"))}</div>
            </div>
            <div class="arrow">→</div>
          </div>

          <div class="small-blue-title">${esc(t("routeMapHeader"))}</div>

          <div class="row" id="openMap">
            ${routeBadge(line, { routeOnly: true })}
            <div class="row-main">
              <div class="row-title">${esc(t("viewMap"))}</div>
              <div class="row-sub">${esc(t("routeAndVehicles"))}</div>
            </div>
            <div class="arrow">→</div>
          </div>

          <div class="small-blue-title">${esc(t("routeDirectionsHeader"))}</div>
        `;

        for (const d of data.directions || []) {
          const from = d.from?.stop_name || d.from?.stopName || "";
          const to = d.to?.stop_name || d.to?.stopName || "";
          const headsign = d.headsign || d.headsignFull || "";
          const trip = d.trip_id || d.tripId || "";

          html += `
            <div class="row" data-trip="${esc(trip)}">
              ${routeBadge(line, { routeOnly: true })}
              <div class="row-main">
                <div class="row-title">▶ ${esc(headsign)}</div>
                <div class="row-sub">${esc(shortName(from, 18))} → ${esc(shortName(to, 18))}</div>
              </div>
              <div class="arrow">→</div>
            </div>
          `;
        }

        root.innerHTML = html;

        document.getElementById("openVehicles")?.addEventListener("click", () => showVehicles(line));
        document.getElementById("openMap")?.addEventListener("click", () => showMap(line));

        root.querySelectorAll("[data-trip]").forEach(el => {
          if (el.dataset.trip) {
            el.addEventListener("click", () => showTrip(el.dataset.trip));
          }
        });
      } catch (e) {
        root.innerHTML = `<div class="empty">${esc(e.message)}</div>`;
      }
    }

    async function showVehicles(line) {
      currentView = "vehicles";
      currentRoute = line;

      setTitle(t("vehiclesTitle"), "back");
      root.innerHTML = `<div class="empty">Loading...</div>`;

      try {
        const data = await fetchJson(`${API}/api/vehicles?line=${encodeURIComponent(line || "")}`);
        const vehicles = data.vehicles || [];
        let html = "";

        if (!vehicles.length) {
          html = `<div class="empty">${esc(t("noVehicles"))}</div>`;
        }

        for (const v of vehicles) {
          const fleet = v.vehicleRef || v.fleetNumber || v.vehicleUniqueId || "";
          const where = v.currentStopName || v.originName || "";
          const dest = v.destinationShort || v.destinationName || "";
          const lineName = v.publishedLineName || v.line || line || "";

          html += `
            <div class="row">
              ${routeBadge(lineName, { routeOnly: true })}
              <div class="row-main">
                <div class="row-title">${esc(shortName(dest, 32))}</div>
                <div class="row-sub">${esc(fleet)} · ${esc(v.vehicleAtStop ? t("atStop") : t("moving"))} · ${esc(shortName(where, 28))}</div>
              </div>
              <div class="arrow">→</div>
            </div>
          `;
        }

        root.innerHTML = html;
      } catch (e) {
        root.innerHTML = `<div class="empty">${esc(e.message)}</div>`;
      }
    }

    async function showTrip(tripId, vehicleRef = "") {
      currentView = "trip";

      setTitle(t("tripTitle"), "back");
      root.innerHTML = `<div class="empty">Loading...</div>`;

      try {
        const url = `${API}/api/trip?trip_id=${encodeURIComponent(tripId)}${vehicleRef ? `&vehicle_ref=${encodeURIComponent(vehicleRef)}` : ""}`;
        const data = await fetchJson(url);

        const line = data.line || data.trip?.line || "";
        const fleet = data.vehicle?.vehicleRef || data.vehicle?.fleetNumber || data.vehicle?.vehicleUniqueId || "";
        const liveMatched = !!data.liveMatched;
        const destination = data.destination || data.destinationFull || "";

        let html = `
          <div class="trip-head">
            <div>${routeBadge(line, { routeOnly: true })}</div>

            <div>
              <div class="trip-dest">${esc(destination)}</div>
              <div class="trip-sub">${esc(liveMatched ? `${t("liveVehicleMatched")} · ${fleet}` : t("scheduleOnly"))}</div>
            </div>

            <div class="delay-box">${liveMatched ? "LIVE" : "--"}</div>
          </div>
        `;

        for (const s of data.stops || []) {
          const live = !!(s.live || s.vehicleHere);
          const passed = !!s.isPast && !live;
          const due = !passed && s.minutes != null && Number(s.minutes) <= 1;
          const cls = `stop-row-trip${live ? " live vehicle-row" : ""}${due ? " due-row" : ""}${passed ? " past" : ""}`;

          let right = "";

          if (s.vehicleHere) {
            right = "LIVE";
          } else if (s.minutes != null && !passed) {
            right = Number(s.minutes) <= 1 ? t("due") : `${s.minutes} ${t("min")}`;
          }

          html += `
            <div class="${cls}">
              <div class="trip-time">${esc(s.time || s.scheduledTime || "")}</div>
              <div class="trip-name">${esc(shortName(s.stopName || s.stop_name || "", 34))}</div>
              <div class="trip-count">${esc(right)}</div>
            </div>
          `;
        }

        root.innerHTML = html;
      } catch (e) {
        root.innerHTML = `<div class="empty">${esc(e.message)}</div>`;
      }
    }

    async function showMap(line = "") {
      currentView = "map";
      currentRoute = line;

      setTitle(t("mapTitle"), "back");

      root.innerHTML = `
        <div class="actions">
          <button class="action-btn">${esc(t("filter"))}: ${esc(line || t("all"))}</button>
          <button class="action-btn" id="clearFilter">${esc(t("clearFilter"))}</button>
          <button class="action-btn" id="refreshMap">${esc(t("refresh"))}</button>
        </div>

        <div id="map" class="map-holder"></div>
      `;

      document.getElementById("clearFilter")?.addEventListener("click", () => showMap(""));
      document.getElementById("refreshMap")?.addEventListener("click", () => loadMapData(line, true));

      setTimeout(() => initMap(line), 50);
    }

    function initMap(line) {
      if (currentMap) {
        currentMap.remove();
        currentMap = null;
      }

      currentMap = L.map("map", {
        zoomControl: true
      }).setView([50.92, -1.39], 11);

      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: "© OpenStreetMap"
      }).addTo(currentMap);

      mapLayerGroup = L.layerGroup().addTo(currentMap);
      routeShapeLayers = [];

      loadMapData(line, true);
    }

    async function loadMapData(line, fit = false) {
      if (!currentMap || !mapLayerGroup) {
        return;
      }

      try {
        const data = await fetchJson(`${API}/api/map?line=${encodeURIComponent(line || "")}`);

        mapLayerGroup.clearLayers();

        routeShapeLayers.forEach(layer => layer.remove());
        routeShapeLayers = [];

        const bounds = [];

        for (const shape of data.shapes || []) {
          const latlngs = shape
            .filter(p => p.lat != null && p.lon != null)
            .map(p => [p.lat, p.lon]);

          if (latlngs.length) {
            const poly = L.polyline(latlngs, {
              weight: 5,
              opacity: .75
            }).addTo(currentMap);

            routeShapeLayers.push(poly);
            latlngs.forEach(x => bounds.push(x));
          }
        }

        for (const v of data.vehicles || []) {
          if (v.latitude == null || v.longitude == null) {
            continue;
          }

          const fleet = v.vehicleRef || v.fleetNumber || v.vehicleUniqueId || "";
          const lineName = v.publishedLineName || v.line || "";
          const dest = v.destinationShort || v.destinationName || "";
          const currentStop = v.currentStopName || "";

          const markerHtml = `
            <div class="vehicle-marker">
              <div class="m-line">${esc(lineName)}</div>
              <div class="m-dest">${esc(dest)}</div>
              <div class="m-fleet">${esc(fleet)}</div>
            </div>
          `;

          const icon = L.divIcon({
            className: "",
            html: markerHtml,
            iconSize: [70, 42],
            iconAnchor: [35, 42]
          });

          const marker = L.marker([v.latitude, v.longitude], {
            icon
          }).addTo(mapLayerGroup);

          marker.bindPopup(`
            <b>${esc(lineName)} ${esc(dest)}</b><br>
            ${esc(fleet)}<br>
            ${esc(currentStop)}
          `);

          bounds.push([v.latitude, v.longitude]);
        }

        if (fit && bounds.length) {
          currentMap.fitBounds(bounds, {
            padding: [25, 25],
            maxZoom: 14
          });
        }
      } catch (e) {
        console.error(e);
      }
    }

    backBtn.addEventListener("click", () => {
      if (currentView === "home") {
        return;
      }

      if (currentView === "vehicles" || currentView === "map") {
        showRoute(currentRoute);
        return;
      }

      renderHome();
    });

    document.querySelectorAll(".flag-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        lang = btn.dataset.lang;
        localStorage.setItem("bu_lang", lang);
        updateLanguageButtons();

        if (currentView === "home") {
          renderHome();
        } else if (currentView === "stop" && currentStop) {
          showStop(currentStop.stop_id || currentStop.stopId);
        } else if (currentView === "route") {
          showRoute(currentRoute);
        } else if (currentView === "vehicles") {
          showVehicles(currentRoute);
        } else if (currentView === "map") {
          showMap(currentRoute);
        } else {
          setTitle(t("appTitle"), "menu");
        }
      });
    });

    updateLanguageButtons();
    loadStatus();
    renderHome();

    setInterval(loadStatus, 15000);
  </script>
</body>
</html>
