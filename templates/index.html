<script>
    // Globális változók
    let map;
    let liveBusMarkers = L.layerGroup();
    let routePolyline; // A rajzolt útvonal tárolására
    let updateInterval;
    const API_BASE = '/api';

    /**
     * Térkép inicializálása
     */
    function initMap() {
        // Központ és zoom beállítása
        map = L.map('map').setView([47.4979, 19.0402], 13); // Budapest
        
        // Sötét téma csempék (MapTiler - lehet OpenStreetMap is, de ez jobban illik)
        L.tileLayer('https://api.maptiler.com/maps/basic-v2-dark/{z}/{x}/{y}.png?key=YOUR_MAPTILER_API_KEY', {
            attribution: '&copy; <a href="http://osm.org/copyright">OpenStreetMap</a> contributors',
            tileSize: 512,
            zoomOffset: -1
        }).addTo(map);

        // Rétegek hozzáadása
        liveBusMarkers.addTo(map);

        // Élő adatok frissítésének elindítása
        startLiveUpdates();
    }

    /**
     * Keresőmező kezelése (GTFS keresés)
     */
    function handleSearchInput() {
        const query = $('#search-input').val().trim();
        const resultsContainer = $('#search-results');
        
        if (query.length < 2) {
            resultsContainer.empty();
            return;
        }

        // API hívás a /api/search végponthoz
        $.get(`${API_BASE}/search`, { q: query }, function(data) {
            resultsContainer.empty();
            
            // Csak ha van eredmény
            if (data.stops.length === 0 && data.routes.length === 0) {
                resultsContainer.append('<div class="no-results">Nincs találat...</div>');
                return;
            }

            // Vonalak megjelenítése
            data.routes.forEach(route => {
                const routeHtml = `
                    <div class="result-item route-item" onclick="showRouteDetail('${route.route_id}')">
                        <span class="route-pill" style="background-color: #${route.route_color || '009933'}; color: #${route.route_text_color || 'FFFFFF'};">
                            ${route.route_short_name}
                        </span>
                        <div class="route-info">
                            <div class="route-name">${route.route_long_name}</div>
                            <div class="route-desc">${route.route_type_desc}</div>
                        </div>
                    </div>
                `;
                resultsContainer.append(routeHtml);
            });

            // Megállók megjelenítése
            data.stops.forEach(stop => {
                const stopHtml = `
                    <div class="result-item stop-item" data-stop-id="${stop.stop_id}" onclick="handleStopClick('${stop.stop_id}', '${stop.stop_name}', ${stop.stop_lat}, ${stop.stop_lon})">
                        <div class="stop-icon">🚌</div>
                        <div class="stop-name">${stop.stop_name}</div>
                    </div>
                `;
                resultsContainer.append(stopHtml);
            });

        }).fail(function() {
            resultsContainer.html('<div class="error-message">Hiba történt a keresés közben.</div>');
        });
    }

    /**
     * Vonal részleteinek megjelenítése (útvonal rajzolása)
     */
    function showRouteDetail(routeId) {
        // Térkép visszaállítása alap állapotba
        if (routePolyline) {
            map.removeLayer(routePolyline);
        }
        $('#search-results').empty();
        $('#departures-panel').hide();

        // API hívás az útvonal koordinátákhoz
        $.get(`${API_BASE}/route_shapes/${routeId}`, function(data) {
            if (data && data.length > 0) {
                const latLons = data.map(coord => [coord[0], coord[1]]);
                
                // Útvonal kirajzolása a térképre
                routePolyline = L.polyline(latLons, {
                    color: '#FFD700', // Aranyszínű útvonal
                    weight: 5,
                    opacity: 0.8
                }).addTo(map);
                
                // Rázoomolás az útvonalra
                map.fitBounds(routePolyline.getBounds());
            } else {
                alert('Nincs útvonal adat ehhez a járathoz.');
            }
        }).fail(function() {
            alert('Hiba történt az útvonal letöltésekor.');
        });
    }

    /**
     * Megálló kattintásának kezelése (indulások megjelenítése)
     */
    function handleStopClick(stopId, stopName, lat, lon) {
        // Áthelyezés a térképen és marker hozzáadása
        map.setView([lat, lon], 16);
        L.marker([lat, lon]).addTo(map).bindPopup(`<b>${stopName}</b>`).openPopup();
        
        // Elindítások lekérése
        fetchDepartures(stopId, stopName);

        // Keresőmező tartalmának törlése
        $('#search-input').val('');
        $('#search-results').empty();
    }

    /**
     * Indulások lekérése és megjelenítése
     */
    function fetchDepartures(stopId, stopName) {
        const departuresPanel = $('#departures-panel');
        const departuresList = $('#departures-list');
        
        departuresPanel.show();
        $('#departures-stop-name').text(stopName);
        departuresList.html('<div class="loading">Indulások betöltése...</div>');

        // API hívás a /api/departures végponthoz
        $.get(`${API_BASE}/departures/${stopId}`, function(data) {
            departuresList.empty();

            if (data.length === 0) {
                departuresList.html('<div class="no-results">Nincsenek aktuális indulások.</div>');
                return;
            }

            // Indulások listájának felépítése
            data.forEach(dep => {
                const delayText = dep.delay_minutes > 0 
                    ? `<span class="delay-late"> +${dep.delay_minutes} perc</span>` 
                    : dep.delay_minutes < 0 
                        ? `<span class="delay-early"> ${dep.delay_minutes} perc</span>`
                        : '';
                
                const timeClass = dep.is_realtime ? 'realtime' : 'scheduled';
                
                const depHtml = `
                    <li class="departure-item">
                        <span class="route-pill" style="background-color: #${dep.route_color || '009933'}; color: #${dep.route_text_color || 'FFFFFF'};">
                            ${dep.route_short_name}
                        </span>
                        <div class="dep-info">
                            <div class="dep-destination">${dep.trip_headsign}</div>
                            <div class="dep-time ${timeClass}">${dep.departure_time} ${delayText}</div>
                        </div>
                    </li>
                `;
                departuresList.append(depHtml);
            });
        }).fail(function() {
            departuresList.html('<div class="error-message">Hiba történt az indulások lekérésekor.</div>');
        });
    }

    /**
     * Élő buszadatok lekérése és frissítése
     */
    function fetchLiveBusData() {
        $.get(`${API_BASE}/live_data`, function(data) {
            // Busz markerek törlése és újra rajzolása
            liveBusMarkers.clearLayers();

            data.forEach(bus => {
                const lat = bus.lat;
                const lon = bus.lon;
                
                // Egyedi busz ikon létrehozása (a járatszámmal)
                const busIconHtml = `
                    <div class="bus-marker-icon" style="background-color: ${bus.route_color ? '#' + bus.route_color : '#009933'}; color: ${bus.route_text_color ? '#' + bus.route_text_color : '#FFFFFF'};">
                        ${bus.route_short_name}
                    </div>
                `;
                const customIcon = L.divIcon({
                    className: 'custom-bus-marker',
                    html: busIconHtml,
                    iconSize: [40, 40],
                    iconAnchor: [20, 20]
                });

                // Marker hozzáadása
                const marker = L.marker([lat, lon], { icon: customIcon })
                    .bindPopup(`<b>${bus.route_short_name}</b> - ${bus.trip_headsign}<br>Jármű: ${bus.vehicle_id}`);
                
                liveBusMarkers.addLayer(marker);
            });
        }).fail(function() {
            console.error("Hiba az élő adatok lekérésekor.");
        });
    }

    /**
     * Élő frissítés indítása (5 másodpercenként)
     */
    function startLiveUpdates() {
        fetchLiveBusData(); // Azonnali frissítés
        updateInterval = setInterval(fetchLiveBusData, 5000); // Folyamatos frissítés
    }

    // Eseménykezelők hozzáadása a DOM betöltése után
    $(document).ready(function() {
        initMap();
        $('#search-input').on('input', handleSearchInput);
        
        // Indulások panel bezárása
        $('#close-departures').on('click', function() {
            $('#departures-panel').hide();
            // Törli a rajzolt útvonalat is, ha van
            if (routePolyline) {
                map.removeLayer(routePolyline);
            }
        });
    });

</script>
