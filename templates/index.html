<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Megállóhelyi Menetrend - Valós idejű</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        /* Alap beállítások, sötét téma, betűtípus */
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: #2e2e2e;
            color: #ffffff;
            margin: 0;
            padding: 0;
            line-height: 1.4;
            overflow: hidden; 
        }

        /* Fő alkalmazás konténer */
        .app-container {
            display: flex;
            flex-direction: column; 
            height: 100vh;
        }

        /* Térkép konténer */
        .map-container {
            height: 40vh;
            width: 100%;
            order: 1; 
        }
        #map {
            height: 100%;
            width: 100%;
        }

        /* Jobb oldali panel/Menetrendi panel */
        .sidebar {
            height: 60vh;
            width: 100%;
            background-color: #2e2e2e;
            overflow-y: auto; 
            padding-bottom: 50px; 
            order: 2; 
        }

        /* Kereső fejléc */
        .search-header {
            background-color: #1e1e1e;
            padding: 10px;
            display: flex;
            gap: 10px;
            position: sticky;
            top: 0;
            z-index: 10;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.4);
        }

        #searchInput {
            flex-grow: 1;
            padding: 12px 15px;
            border: none;
            border-radius: 20px;
            background-color: #383838;
            color: #ffffff;
            font-size: 1em;
        }
        .search-button {
            background-color: #383838;
            color: #ffffff;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 1.1em;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Információs szekciók */
        .section {
            background-color: #222222;
            padding: 10px;
            margin-top: 10px;
        }
        .section h3 {
            margin: 0 0 10px 0;
            color: #ffffff;
            font-weight: 600;
        }
        .subtitle {
            font-size: 0.9em;
            color: #ccc;
            margin-bottom: 10px;
        }

        /* Járat címkék stílusai */
        .line-tag {
            display: inline-block;
            padding: 4px 8px;
            margin: 3px 3px 3px 0;
            border-radius: 4px;
            font-size: 0.8em;
            font-weight: bold;
            text-align: center;
            color: white;
            white-space: nowrap;
        }
        /* Alapértelmezett színek */
        .tag-bus, .tag-blue { background-color: #007bff; }
        .tag-metro { background-color: #e51d21; } 
        .tag-night { background-color: #1a1a1a; border: 1px solid #999; }
        .tag-alert { background-color: #ffc107; color: #333; } 
        .tags-container {
            padding: 5px 0;
        }

        /* Kedvenc listaelem és Keresési találat elemei */
        .list-item {
            background-color: #383838;
            padding: 15px;
            margin-top: 1px;
            cursor: pointer;
            border-left: 5px solid transparent;
        }
        .list-item:hover {
            background-color: #444;
        }
        .fav-item {
            border-left-color: gold;
        }
        .list-item strong {
            font-size: 1.1em;
            display: block;
        }
        .list-item p {
            margin: 5px 0 0 0;
            font-size: 0.9em;
            color: #ccc;
        }
        .star {
            float: right;
            color: gold;
            font-size: 1.2em;
        }

        /* Érkezési lista és Jármű részletek (Detail View) */
        .arrival-item, .trip-item {
            padding: 12px 0;
            border-bottom: 1px solid #444;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .arrival-item:last-child, .trip-item:last-child {
            border-bottom: none;
        }

        .arrival-info {
            flex-grow: 1;
            padding-left: 10px;
        }
        .delay-time {
            font-weight: bold;
            font-size: 1.2em;
            padding: 5px 10px;
            border-radius: 4px;
        }
        /* Késés jelölések */
        .delay-early { background-color: #dc3545; color: white; } /* Korai (Piros) */
        .delay-late { background-color: #28a745; color: white; } /* Késik (Zöld) */
        .delay-ontime { color: #ffc107; } /* Pontos (Sárga/Fehér) */

        /* Trip (Jármű) nézet listaelem */
        .trip-item .trip-time {
            width: 60px;
            text-align: right;
            font-weight: 600;
        }
        .trip-item .trip-info {
            flex-grow: 1;
            padding: 0 15px;
        }
        .trip-item .trip-delay {
            font-weight: bold;
        }
        .active-stop {
            color: #007bff;
            font-weight: bold;
        }
        .visited-stop {
            color: #777;
            text-decoration: line-through;
        }

        /* **Desktop (Nagyobb képernyő) optimalizáció** */
        @media (min-width: 769px) {
            .app-container {
                flex-direction: row; 
            }
            .map-container {
                height: 100vh;
                flex: 2; 
                order: 1;
            }
            .sidebar {
                height: 100vh;
                flex: 1; 
                order: 2;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <div id="map-container" class="map-container">
            <div id="map"></div>
        </div>

        <div class="sidebar" id="sidebar">
            
            <header class="search-header">
                <input type="text" id="searchInput" placeholder="Megálló vagy viszonylat keresése">
                <button id="clearSearch" class="search-button" style="display:none;"><i class="fas fa-times"></i></button>
            </header>

            <div id="contentArea">
                
                <div id="alertsSection" class="section info-section">
                    <h3>Kiemelt forgalmi változások</h3>
                    <p class="subtitle">Fontosabb aktuális pótlások, terelések, járatkimaradások</p>
                    <div class="tags-container" id="alertsTags">
                        <p style="text-align:center; color:#999;">Frissítések betöltése...</p>
                    </div>
                </div>

                <div id="favouritesSection" class="section info-section">
                    <h3>Kedvenc megállók és viszonylatok</h3>
                    <div id="favouritesList">
                        </div>
                </div>

                <div id="searchResultsSection" class="section" style="display:none;">
                    <h3 id="searchResultsTitle">Találatok</h3>
                    <div id="searchResultsList">
                        </div>
                </div>

                <div id="detailViewSection" class="section" style="display:none;">
                    </div>
                
            </div>
            
        </div>
    </div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            const API_BASE_URL = '/api/'; 
            
            const searchInput = document.getElementById('searchInput');
            const clearSearchButton = document.getElementById('clearSearch');
            const searchResultsSection = document.getElementById('searchResultsSection');
            const searchResultsList = document.getElementById('searchResultsList');
            const detailViewSection = document.getElementById('detailViewSection');
            
            let map;
            let busMarkers = L.layerGroup(); 
            let routePolyline; // A rajzolt útvonal tárolására

            // --- INIT ---
            initializeMap();
            setupEventListeners();
            loadInitialData(); 

            // --- MAP FUNCTIONS ---
            function initializeMap() {
                map = L.map('map').setView([50.93, -1.39], 13); 

                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '&copy; <a href="http://osm.org/copyright">OpenStreetMap</a> contributors'
                }).addTo(map);
                
                busMarkers.addTo(map); 
                
                // Valós idejű frissítés
                fetchLiveBusLocations();
                setInterval(fetchLiveBusLocations, 10000); 
            }
            
            async function fetchLiveBusLocations() {
                try {
                     // Hívás a BŐVÍTETT mock adatokat adó végpontra
                     const response = await fetch(`${API_BASE_URL}live_data`);
                     const coords = await response.json();
                     updateMapMarkers(coords); 
                } catch (error) {
                     console.error("Hiba a valós idejű koordináták lekérésekor:", error);
                }
            }
            
            function updateMapMarkers(busData) {
                busMarkers.clearLayers();

                busData.forEach(bus => {
                    if (bus.lat && bus.lon) {
                        const busIconHtml = `
                            <div style="
                                background-color: #${bus.route_color || '0057B8'}; 
                                color: #${bus.route_text_color || 'FFFFFF'}; 
                                border-radius: 50%; 
                                width: 30px; 
                                height: 30px; 
                                text-align: center; 
                                line-height: 30px; 
                                font-weight: bold;
                                font-size: 0.9em;
                                border: 2px solid white;
                                box-shadow: 0 0 5px rgba(0,0,0,0.5);"
                            >
                                ${bus.route_short_name}
                            </div>
                        `;
                        
                        const customIcon = L.divIcon({
                            className: 'custom-bus-icon',
                            html: busIconHtml,
                            iconSize: [30, 30],
                            iconAnchor: [15, 15]
                        });
                        
                        const marker = L.marker([bus.lat, bus.lon], {icon: customIcon})
                            .bindPopup(`<b>${bus.route_short_name}</b> - ${bus.dest} (ID: ${bus.id})`);
                        
                        busMarkers.addLayer(marker);
                    }
                });
            }

            // --- EVENT LISTENERS ---
            function setupEventListeners() {
                searchInput.addEventListener('input', (e) => {
                    const query = e.target.value.trim();
                    if (query.length > 0) {
                        clearSearchButton.style.display = 'flex';
                        if (query.length >= 2) { 
                            performSearch(query);
                        }
                    } else {
                        clearSearchButton.style.display = 'none';
                        showSection('initial'); 
                    }
                });

                clearSearchButton.addEventListener('click', () => {
                    searchInput.value = '';
                    clearSearchButton.style.display = 'none';
                    showSection('initial');
                });
            }

            // --- DATA LOADING: INITIAL (Frissítések és Üres Kedvencek) ---
            async function loadInitialData() {
                const alertsTags = document.getElementById('alertsTags');
                const favouritesList = document.getElementById('favouritesList');
                
                // 1. FORGALMI VÁLTOZÁSOK BETÖLTÉSE a Flask végpontról
                try {
                    const response = await fetch(`${API_BASE_URL}service_updates`);
                    const updates = await response.json();
                    
                    if (updates.length > 0) {
                        alertsTags.innerHTML = updates.map(u => {
                            // Szín kiválasztása a back-end adatai alapján
                            const bgColor = `#${u.route_color || 'ffc107'}`;
                            const textColor = `#${u.route_text_color || '333'}`;
                            return `<span class="line-tag" style="background-color: ${bgColor}; color: ${textColor};">${u.route_short_name}</span>`;
                        }).join('');
                    } else {
                        alertsTags.innerHTML = '<p class="subtitle" style="text-align:center;">Nincs aktuális forgalmi változás.</p>';
                    }
                    
                } catch (error) {
                    console.warn("Hiba a szolgáltatási frissítések betöltésekor. Hálózati hiba.");
                    alertsTags.innerHTML = '<p class="subtitle" style="text-align:center; color:red;">Hiba történt a frissítések betöltésekor.</p>';
                }

                // 2. KEDVENCEK (ALAPÉRTELMEZETT ÜRES TARTALOM)
                favouritesList.innerHTML = '<p class="subtitle" style="text-align:center; padding:10px;">Nincsenek kedvenc megállók vagy viszonylatok beállítva.</p>';
                
                showSection('initial');
            }
            
            // --- SECTION MANAGEMENT ---
            function showSection(sectionName) {
                // Töröljük a korábbi útvonalat a térképről, ha volt
                if (routePolyline && map.hasLayer(routePolyline)) {
                    map.removeLayer(routePolyline);
                    routePolyline = null;
                }
                
                const sections = [
                    document.getElementById('alertsSection'),
                    document.getElementById('favouritesSection'),
                    searchResultsSection,
                    detailViewSection
                ];
                
                sections.forEach(s => s.style.display = 'none');
                
                if (sectionName === 'initial') {
                    document.getElementById('alertsSection').style.display = 'block';
                    document.getElementById('favouritesSection').style.display = 'block';
                } else if (sectionName === 'search') {
                    searchResultsSection.style.display = 'block';
                } else if (sectionName === 'detail') {
                    detailViewSection.style.display = 'block';
                }
            }

            // --- SEARCH FUNCTIONALITY ---
            async function performSearch(query) {
                showSection('search');
                searchResultsList.innerHTML = '<p style="text-align:center; color:#ccc;">Keresés...</p>';

                try {
                    const response = await fetch(`${API_BASE_URL}search?q=${encodeURIComponent(query)}`);
                    const results = await response.json(); 
                    
                    document.getElementById('searchResultsTitle').textContent = `Találatok a "${query}" kifejezésre`;
                    
                    const allResults = [
                        ...results.stops.map(s => ({
                            type: 'stop',
                            id: s.stop_id,
                            name: s.stop_name,
                            description: `Megálló azonosító: ${s.stop_id}`,
                            lines: []
                        })),
                        ...results.routes.map(r => ({
                            type: 'route',
                            id: r.route_id,
                            name: `${r.route_short_name} - ${r.route_long_name}`,
                            description: r.route_type_desc,
                            lines: [{name: r.route_short_name, color: r.route_color, textColor: r.route_text_color}]
                        }))
                    ];

                    if (allResults.length > 0) {
                        searchResultsList.innerHTML = allResults.map(item => {
                            const lineTags = item.lines.map(line => 
                                `<span class="line-tag" style="background-color: #${line.color || getLineColor(line.name)}; color: #${line.textColor || 'FFFFFF'};">${line.name}</span>`
                            ).join('');

                            const onClickAction = item.type === 'stop' 
                                ? `showStopArrivals('${item.id}')` 
                                : `showRoutePath('${item.id}')`;
                            
                            return `
                                <div class="list-item" data-id="${item.id}" onclick="${onClickAction}">
                                    <strong>${item.name}</strong>
                                    <p>${item.description}</p>
                                    <p>${lineTags}</p>
                                </div>
                            `;
                        }).join('');
                    } else {
                        searchResultsList.innerHTML = '<p style="text-align:center; color:#ccc;">Nincs találat.</p>';
                    }

                } catch (error) {
                    console.error('Keresési hiba:', error);
                    searchResultsList.innerHTML = '<p style="text-align:center; color:red;">Hiba történt a keresés során.</p>';
                }
            }

            // --- STOP ARRIVALS (Megálló nézet) ---
            window.showStopArrivals = async (stopId) => {
                showSection('detail');
                detailViewSection.innerHTML = '<p style="text-align:center; color:#ccc;">Érkezések betöltése...</p>';
                
                try {
                    // Hívás a Flask végpontra (GTFS alapú szimulált indulásokkal)
                    const response = await fetch(`${API_BASE_URL}departures/${stopId}`);
                    const data = await response.json(); 
                    
                    const stopName = data.stopName || `Megálló ID: ${stopId}`;
                    const headerHtml = `
                        <header class="section" style="margin-top:0;">
                            <h3>${stopName} <span style="font-size:0.8em; color:#999;">(${data.stop_id})</span></h3>
                            <p class="subtitle">Valós idejű indulások (GTFS alapú szimuláció)</p>
                        </header>
                    `;

                    const arrivalListHtml = data.departures.map((a, index) => {
                        // Trip ID-t használjuk az útvonal nézethez. A Flask kód most a "vehicle_id"-t adja vissza
                        const tripId = a.vehicle_id || `MOCK_TRIP_${a.line}_${index}`; 
                        const delayDisplay = a.delay !== null ? formatDelay(a.delay, false) : a.time;
                        const delayClass = a.delay !== null ? getDelayClass(a.delay) : 'delay-ontime';

                        return `
                            <div class="arrival-item" onclick="showTripDetails('${tripId}', '${a.line}', '${a.destination}')">
                                <span class="line-tag" style="background-color: #${a.route_color || getLineColor(a.line)}; color: #${a.route_text_color || 'FFFFFF'};">${a.line}</span>
                                <div class="arrival-info">
                                    <p style="margin:0; font-weight:600;">${a.destination}</p>
                                    <p style="margin:0; font-size:0.8em; color:#aaa;">${a.vehicle_id || 'GTFS menetrend'}</p>
                                </div>
                                <span class="delay-time ${delayClass}">${delayDisplay}</span>
                            </div>
                        `;
                    }).join('');

                    detailViewSection.innerHTML = headerHtml + `<div id="arrivalList">${arrivalListHtml || '<p style="text-align:center; padding:10px; color:#999;">Nincs indulási adat a megállóhoz a jelenlegi idő után.</p>'}</div>`;
                    
                } catch (error) {
                    console.error('Érkezések hiba:', error);
                    detailViewSection.innerHTML = '<p style="text-align:center; color:red;">Hiba történt az érkezések betöltésekor.</p>';
                }
            }
            
            // --- ROUTE PATH (Útvonal kirajzolása térképre) ---
            window.showRoutePath = async (routeId) => {
                try {
                    const response = await fetch(`${API_BASE_URL}route_shapes/${routeId}`);
                    const coords = await response.json(); 
                    
                    if (coords && coords.length > 0) {
                        showSection('initial'); 
                        
                        // Töröljük a korábbi vonalat, ha van
                        if (routePolyline) {
                             map.removeLayer(routePolyline);
                        }
                        
                        routePolyline = L.polyline(coords, {
                            color: '#0057B8', 
                            weight: 5, 
                            opacity: 0.8
                        }).addTo(map);

                        map.fitBounds(routePolyline.getBounds());
                        
                    } else {
                        alert(`Nincs útvonaladat a ${routeId} járathoz.`);
                    }

                } catch (error) {
                    console.error('Útvonal kirajzolási hiba:', error);
                }
            }
            
            // --- TRIP / VEHICLE DETAIL VIEW (Trip nézet) ---
            window.showTripDetails = async (tripId, line, destination) => {
                showSection('detail');
                detailViewSection.innerHTML = '<p style="text-align:center; color:#ccc;">Útvonal betöltése...</p>';

                try {
                    // Hívás a Flask végpontra az út menti megállók lekérésére
                    const response = await fetch(`${API_BASE_URL}trip_route/${tripId}`);
                    const data = await response.json(); 

                    if (data.route.length === 0) {
                        detailViewSection.innerHTML = `<p style="text-align:center; color:#ccc;">Nincs részletes útvonaladat a(z) ${tripId} járathoz.</p>`;
                        return;
                    }

                    const mockTripData = {
                        destination: destination,
                        vehicle: tripId, 
                        totalDelay: data.total_delay, 
                        route: data.route 
                    };

                    const headerHtml = `
                        <header class="section" style="margin-top:0;">
                            <span class="line-tag ${getLineTagClass(line)}">${line}</span>
                            <h3 style="display:inline-block; margin-left:10px;">${mockTripData.destination}</h3>
                            <p class="subtitle">Jármű ID: ${mockTripData.vehicle}</p>
                            <p style="float:right; font-size:1.5em; font-weight:bold; color: ${mockTripData.totalDelay > 0 ? '#28a745' : '#dc3545'};">${formatDelay(mockTripData.totalDelay)}</p>
                        </header>
                    `;
                    
                    const routeHtml = mockTripData.route.map(stop => `
                        <div class="trip-item ${stop.status === 'past' ? 'visited-stop' : ''} ${stop.status === 'current' ? 'active-stop' : ''}">
                            <span class="trip-time">${stop.time}</span>
                            <div class="trip-info">
                                ${stop.name}
                            </div>
                            <span class="trip-delay ${getDelayClass(stop.delay)}">${formatDelay(stop.delay, true)}</span>
                        </div>
                    `).join('');
                    
                    detailViewSection.innerHTML = headerHtml + routeHtml;
                } catch (error) {
                    console.error('Útvonal betöltési hiba:', error);
                    detailViewSection.innerHTML = '<p style="text-align:center; color:red;">Hiba történt az útvonal betöltésekor.</p>';
                }
            }

            // --- UTILITY FUNCTIONS ---
            function getLineColor(line) {
                if (line.includes('M')) return 'E51D21';
                if (line.includes('U')) return '007bff';
                if (line.startsWith('9')) return '1a1a1a';
                return '0057B8';
            }
            function getLineTagClass(line) {
                if (line.includes('M')) return 'tag-metro';
                if (line.includes('U')) return 'tag-blue';
                if (line.startsWith('9')) return 'tag-night';
                return 'tag-bus';
            }

            function formatDelay(delayInMinutes, short = false) {
                const sign = delayInMinutes >= 0 ? '+' : '';
                const absDelay = Math.abs(delayInMinutes);
                
                if (absDelay < 0.5 && delayInMinutes !== 0) { 
                     return delayInMinutes > 0 ? '+0\'' : '-0\'';
                }
                
                if (short) {
                    return `${sign}${Math.round(absDelay)}'`; 
                }
                return `${sign}${absDelay.toFixed(1).replace('.', ',')}'`; 
            }
            
            function getDelayClass(delayInMinutes) {
                if (delayInMinutes < 0) return 'delay-early'; 
                if (delayInMinutes > 0) return 'delay-late'; 
                return 'delay-ontime';
            }
            
            window.showStopArrivals = showStopArrivals;
            window.showRoutePath = showRoutePath;
            window.showTripDetails = showTripDetails;
        });
    </script>
</body>
</html>
