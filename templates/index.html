<script>
    // Globális változók
    let map;
    let liveBusMarkers = L.layerGroup();
    let routePolyline; 
    let updateInterval;
    const API_BASE = '/api';
    const SOUTHAMPTON_CENTER = [50.9097, -1.4044]; 

    /**
     * Térkép inicializálása
     */
    function initMap() {
        map = L.map('map').setView(SOUTHAMPTON_CENTER, 13);
        
        // --- JAVÍTOTT CSEMPE BEÁLLÍTÁS (OpenStreetMap/CARTO sötét) ---
        L.tileLayer('https://{s}[.basemaps.cartocdn.com/dark_all/](https://.basemaps.cartocdn.com/dark_all/){z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="[http://osm.org/copyright](http://osm.org/copyright)">OpenStreetMap</a> contributors &copy; <a href="[https://carto.com/attributions](https://carto.com/attributions)">CARTO</a>',
            subdomains: 'abcd',
            maxZoom: 19
        }).addTo(map);

        liveBusMarkers.addTo(map);
        startLiveUpdates();
    }

    /**
     * Keresőmező kezelése (GTFS keresés)
     */
    function handleSearchInput() {
        const query = $('#search-input').val().trim();
        const resultsContainer = $('#search-results');
        
        if (query.length < 2) {
            resultsContainer.empty();
            return;
        }

        // API hívás a /api/search végponthoz
        $.get(`${API_BASE}/search`, { q: query }, function(data) {
            resultsContainer.empty();
            
            if (data.stops.length === 0 && data.routes.length === 0) {
                resultsContainer.append('<div class="no-results">Nincs találat...</div>');
                return;
            }

            // Vonalak megjelenítése
            data.routes.forEach(route => {
                const routeHtml = `
                    <div class="result-item route-item" onclick="showRouteDetail('${route.route_id}')">
                        <span class="route-pill" style="background-color: #${route.route_color || '0057B8'}; color: #${route.route_text_color || 'FFFFFF'};">
                            ${route.route_short_name}
                        </span>
                        <div class="route-info">
                            <div class="route-name">${route.route_long_name}</div>
                            <div class="route-desc">${route.route_type_desc || 'Járat'}</div>
                        </div>
                    </div>
                `;
                resultsContainer.append(routeHtml);
            });

            // Megállók megjelenítése
            data.stops.forEach(stop => {
                const stopHtml = `
                    <div class="result-item stop-item" data-stop-id="${stop.stop_id}" onclick="handleStopClick('${stop.stop_id}', '${stop.stop_name}', ${stop.stop_lat}, ${stop.stop_lon})">
                        <div class="stop-icon">🚌</div>
                        <div class="stop-name">${stop.stop_name}</div>
                    </div>
                `;
                resultsContainer.append(stopHtml);
            });

        }).fail(function() {
            resultsContainer.html('<div class="error-message">Hiba történt a keresés közben.</div>');
        });
    }

    /**
     * Vonal részleteinek megjelenítése (útvonal rajzolása)
     */
    function showRouteDetail(routeId) {
        if (routePolyline) {
            map.removeLayer(routePolyline);
        }
        $('#search-results').empty();
        $('#departures-panel').hide();

        $.get(`${API_BASE}/route_shapes/${routeId}`, function(data) {
            if (data && data.length > 0) {
                routePolyline = L.polyline(data, {
                    color: '#FFD700', 
                    weight: 5,
                    opacity: 0.8
                }).addTo(map);
                
                map.fitBounds(routePolyline.getBounds());
            } else {
                alert('Nincs útvonal adat ehhez a járathoz.');
            }
        }).fail(function() {
            alert('Hiba történt az útvonal letöltésekor.');
        });
    }

    /**
     * Megálló kattintásának kezelése (indulások megjelenítése)
     */
    function handleStopClick(stopId, stopName, lat, lon) {
        map.setView([lat, lon], 16);
        
        // Törli az összes korábbi megálló markert (csak a buszokat hagyja meg)
        liveBusMarkers.eachLayer(layer => {
            if (layer.options.title === 'stop') {
                 liveBusMarkers.removeLayer(layer);
            }
        });
        
        // Új megálló marker hozzáadása
        L.marker([lat, lon], { title: 'stop' }).addTo(liveBusMarkers).bindPopup(`<b>${stopName}</b>`).openPopup();
        
        fetchDepartures(stopId, stopName);

        $('#search-input').val('');
        $('#search-results').empty();
    }

    /**
     * Indulások lekérése és megjelenítése
     */
    function fetchDepartures(stopId, stopName) {
        const departuresPanel = $('#departures-panel');
        const departuresList = $('#departures-list');
        
        departuresPanel.show();
        $('#departures-stop-name').text(stopName);
        departuresList.html('<div class="loading">Indulások betöltése...</div>');

        // API hívás a /api/departures végponthoz
        $.get(`${API_BASE}/departures/${stopId}`, function(data) {
            departuresList.empty();

            if (!data.departures || data.departures.length === 0) { 
                departuresList.html('<div class="no-results">Nincsenek aktuális indulások.</div>');
                return;
            }

            data.departures.forEach(dep => {
                const isRealtime = dep.delay !== undefined && dep.delay !== null;
                
                let delayText = '';
                let timeClass = 'scheduled';
                
                if (isRealtime) {
                    timeClass = 'realtime';
                    if (dep.delay > 0) {
                        delayText = `<span class="delay-late"> +${dep.delay}'</span>`; 
                    } else if (dep.delay < 0) {
                        delayText = `<span class="delay-early"> ${dep.delay}'</span>`;
                    } else {
                        delayText = `<span class="delay-ontime"> PONTOS</span>`;
                    }
                }
                
                const routeColor = dep.route_color || '0057B8'; 
                const textColor = dep.route_text_color || 'FFFFFF';

                const depHtml = `
                    <li class="departure-item">
                        <span class="route-pill" style="background-color: #${routeColor}; color: #${textColor};">
                            ${dep.line}
                        </span>
                        <div class="dep-info">
                            <div class="dep-destination">${dep.destination}</div>
                            <div class="dep-time ${timeClass}">${dep.time} ${delayText}</div>
                            <div class="dep-vehicle">${dep.vehicle_id ? `Jármű: ${dep.vehicle_id}` : ''}</div>
                        </div>
                    </li>
                `;
                departuresList.append(depHtml);
            });
        }).fail(function() {
            departuresList.html('<div class="error-message">Hiba történt az indulások lekérésekor.</div>');
        });
    }

    /**
     * Élő buszadatok lekérése és frissítése
     */
    function fetchLiveBusData() {
        $.get(`${API_BASE}/live_data`, function(data) {
            // Busz markerek törlése (csak a buszokat)
            liveBusMarkers.eachLayer(layer => {
                if (layer.options.title === 'bus') {
                    liveBusMarkers.removeLayer(layer);
                }
            });

            data.forEach(bus => {
                const lat = bus.lat;
                const lon = bus.lon;
                
                const routeShortName = bus.route_short_name || 'BUSZ'; 
                const routeColor = bus.route_color || '0057B8'; 
                const textColor = bus.route_text_color || 'FFFFFF';

                // Egyedi busz ikon létrehozása 
                const busIconHtml = `
                    <div class="bus-marker-icon" style="background-color: #${routeColor}; color: #${textColor};">
                        ${routeShortName}
                    </div>
                `;
                const customIcon = L.divIcon({
                    className: 'custom-bus-marker',
                    html: busIconHtml,
                    iconSize: [40, 40],
                    iconAnchor: [20, 20]
                });

                // Marker hozzáadása (title: 'bus' a későbbi szűréshez)
                const marker = L.marker([lat, lon], { icon: customIcon, title: 'bus' })
                    .bindPopup(`**Járat:** ${routeShortName}<br>**Cél:** ${bus.dest}<br>**Jármű:** ${bus.id}`);
                
                liveBusMarkers.addLayer(marker);
            });
        }).fail(function() {
            console.error("Hiba az élő adatok lekérésekor.");
        });
    }

    /**
     * Élő frissítés indítása (5 másodpercenként)
     */
    function startLiveUpdates() {
        fetchLiveBusData(); 
        updateInterval = setInterval(fetchLiveBusData, 5000); 
    }

    // Eseménykezelők hozzáadása a DOM betöltése után
    $(document).ready(function() {
        initMap();
        $('#search-input').on('input', handleSearchInput);
        
        // Indulások panel bezárása
        $('#close-departures').on('click', function() {
            $('#departures-panel').hide();
            if (routePolyline) {
                map.removeLayer(routePolyline);
            }
            // Törli a megálló markert is
            liveBusMarkers.eachLayer(layer => {
                if (layer.options.title === 'stop') {
                     liveBusMarkers.removeLayer(layer);
                }
            });
        });
    });

</script>
