{% extends "base.html" %}{% block content %}
<div class="h1">Keresés: "{{ q }}"</div>

<h3>Járatok</h3>
{% if not route_hits %}<div class="muted">Nincs találat.</div>{% endif %}
<ul>
  {% for r in route_hits %}
  <li><a href="/r/{{ r.route_id }}">{{ r.short_name }}</a></li>
  {% endfor %}
</ul>

<h3>Megállók</h3>
<ul>
  {% for s in stop_hits %}
  <li><a href="/stop/{{ s.stop_id }}">{{ s.name }}</a></li>
  {% endfor %}
</ul>
{% endblock %}
