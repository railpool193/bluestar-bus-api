<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Járat {{ route_short }}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <a href="/" class="logo">★ bluestar</a>
    <form action="/search">
      <input name="q" placeholder="Keresés">
    </form>
    <div class="clock">UK: {{ now_uk }}</div>
  </div>

  <h1>Járat {{ route_short }}</h1>

  <h2>Élő járművek</h2>

  {% if not live_vehicles %}
    <div class="muted">Jelenleg nincs élő adat.</div>
  {% endif %}

  {% for v in live_vehicles %}
    <div class="row live">
      <div>
        <strong>{{ v.fleet or "BUS" }}</strong><br>
        <span class="muted">
          {{ "%.5f"|format(v.lat) }}, {{ "%.5f"|format(v.lon) }}
        </span>
      </div>
    </div>
  {% endfor %}

</div>
</body>
</html>
