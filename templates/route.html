{% extends "base.html" %}
{% block content %}
<h1>Route {{ route_id }}</h1>
<h3>Élő járművek (Bluestar/Unilink)</h3>
<ul class="list">
  {% for v in vehicles %}
    <li class="list-row">
      <div>
        <div class="strong">{{ v.fleet or v.vehicle_ref }}</div>
        <div class="muted">{{ v.destination }}</div>
      </div>
      <div class="muted">{{ v.updated }}</div>
    </li>
  {% else %}
    <li class="muted">Jelenleg nincs élő jármű.</li>
  {% endfor %}
</ul>
{% endblock %}
