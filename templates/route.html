{% extends "base.html" %}{% block content %}
<div class="h1">Route <span class="badge">{{ route.route_short_name or route.route_id }}</span></div>

<h3>Élő járművek (Bluestar/Unilink)</h3>
<div id="map" class="map"></div>
<div class="tiny muted">Járművek: {{ veh_count }}</div>

<script>
  const vehicles = {{ vehicles | tojson }};
  const map = L.map('map').setView([50.9, -1.4], 11);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);
  const group = L.featureGroup().addTo(map);
  vehicles.forEach(v=>{
    const m = L.marker([v.lat, v.lon]).addTo(group);
    let txt = (v.headsign || "");
    if (v.vehicle_ref) txt += "<br/><small>fleet: "+v.vehicle_ref+"</small>";
    m.bindPopup(txt);
  });
  if (vehicles.length) map.fitBounds(group.getBounds().pad(0.2));
</script>
{% endblock %}
