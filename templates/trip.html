{% extends "base.html" %}{% block content %}
<div class="h1">Járat</div>
<div class="muted">Trip: {{ trip.trip_id }}
  {% if delay_txt %}<span class="badge live">{{ delay_txt }}</span>{% endif %}
</div>

<div id="map" class="map"></div>

<script>
  // Best-effort polyline (csak megállópontokból)
  const rows = {{ rows | tojson }};
  const stops = {{ stops | tojson }};
  const pts = [];
  rows.forEach(r=>{
    const s = stops[r.stop_id];
    if (s && s.stop_lat && s.stop_lon) pts.push([parseFloat(s.stop_lat), parseFloat(s.stop_lon)]);
  });
  const map = L.map('map').setView(pts.length?pts[0]:[50.9,-1.4], 12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);
  if (pts.length){
    const line = L.polyline(pts).addTo(map);
    L.featureGroup([line]).addTo(map);
    map.fitBounds(line.getBounds().pad(0.2));
  }
</script>

<h3>Következő megállók</h3>
{% for r in rows %}
  <div class="card">
    <div class="row">
      <div class="pill">{{ (r.departure_time or r.arrival_time)[:5] }}</div>
      <div>{{ stops[r.stop_id].stop_name }}</div>
    </div>
  </div>
{% endfor %}
{% endblock %}
