<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlueStar Bus Tracker (Statikus)</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
        /* ================================================= */
        /* CSS STÍLUSOK A VIDEÓBAN LÁTOTT MEGJELENÉSHEZ */
        /* ================================================= */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background-color: #f4f7f6;
            display: flex;
            height: 100vh;
        }

        /* Térkép konténer a bal oldalon, teljes magasságban */
        #map {
            width: 70%; 
            height: 100%;
            position: sticky; /* Vagy 'fixed', ha az egész oldalon marad */
            top: 0;
            border-right: 2px solid #ddd;
            z-index: 1;
        }

        /* Információs panel a jobb oldalon (Menetrend) */
        #info-panel {
            width: 30%;
            padding: 20px;
            overflow-y: auto; /* Görgethetővé teszi, ha sok járat van */
            background-color: #fff;
            z-index: 2;
        }

        h2 {
            color: #333;
            border-bottom: 2px solid #007bff;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        /* Busz járat kártya stílusa (a videóhoz hasonló megjelenés) */
        .route-card {
            display: flex;
            align-items: center;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            padding: 15px;
            margin-bottom: 15px;
            transition: transform 0.2s;
        }

        .route-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }

        /* Vonal szám jelvény (badge) */
        .line-badge {
            width: 40px;
            height: 40px;
            border-radius: 50%; /* Kör alakú */
            background-color: #007bff; /* Kék alapszín */
            color: white;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2em;
            margin-right: 15px;
            flex-shrink: 0;
        }

        /* Eltérő vonalszámokhoz eltérő színek (pl. 1-es vonal) */
        .line-badge.line-1 { background-color: #e74c3c; } /* Piros */
        .line-badge.line-2 { background-color: #2ecc71; } /* Zöld */

        /* Részletek és Idő */
        .details {
            flex-grow: 1;
        }

        .destination {
            font-size: 1.1em;
            font-weight: 600;
            color: #555;
            margin-bottom: 5px;
        }

        /* Menetrendi (Scheduled) idő kiemelése */
        .schedule-time {
            font-size: 0.9em;
            color: #999;
        }

        /* Élő előrejelzés (amikor működni fog) */
        .live-prediction {
            font-size: 1.6em;
            font-weight: 900;
            color: #2c3e50;
            margin-left: auto; /* Jobb oldalra tolja */
        }

        /* Kiemelés (pl. busz éppen érkezik) */
        .live-prediction.on-time { color: #27ae60; } /* Zöld */
        .live-prediction.delayed { color: #e67e22; } /* Narancs */
        /* ================================================= */
    </style>
</head>
<body>

    <div id="map"></div>

    <div id="info-panel">
        <h2>Buszjáratok a környéken</h2>
        <div id="live-departures">
            <div class="route-card">
                <div class="line-badge line-1">1</div>
                <div class="details">
                    <div class="destination">Southampton City Centre</div>
                    <div class="schedule-time">Menetrendi idő: 14:30</div>
                </div>
                <div class="live-prediction">
                    14:30
                </div>
            </div>

            <div class="route-card">
                <div class="line-badge line-2">2</div>
                <div class="details">
                    <div class="destination">Romsey (via Ampfield)</div>
                    <div class="schedule-time">Menetrendi idő: 14:45</div>
                </div>
                <div class="live-prediction">
                    14:45
                </div>
            </div>
            </div>
    </div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
        // IDE KÉNE BEILLESZTENI AZ AKTULIS JAVASCRIPT KÓDOT IS!

        // PÉLDA: Térkép inicializálása
        var map = L.map('map').setView([50.9097, -1.4044], 13); // Southampton koordinátái
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // A Python kódja a járatokat és a megállókat beilleszti a JavaScriptbe, 
        // ami ezeket a térképen elhelyezi.
    </script>
</body>
</html>
