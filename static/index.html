<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bluestar</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { background-color: #0d1220; color: #e7ecff; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #2a354d; border-radius: 3px; }
    ::-webkit-scrollbar-track { background: #0d1220; }
  </style>
</head>
<body class="flex flex-col min-h-screen">
  <header class="px-4 py-3 flex items-center justify-between border-b border-gray-800">
    <div class="flex items-center space-x-2">
      <span class="text-blue-400 text-2xl">★</span>
      <h1 class="text-lg font-bold">bluestar</h1>
    </div>
    <span id="status-time" class="text-sm text-gray-400"></span>
  </header>
  <main id="main" class="flex-1 overflow-auto">
    <!-- Home Tab -->
    <div id="home-tab" class="p-4 space-y-4">
      <input id="home-search" type="text" placeholder="Search stops..." class="w-full px-3 py-2 rounded bg-gray-800 text-white placeholder-gray-500 focus:outline-none" />
      <div id="home-results" class="max-h-40 overflow-y-auto border border-gray-800 rounded"></div>
      <div id="home-departures"></div>
    </div>
    <!-- Routes Tab -->
    <div id="routes-tab" class="p-4 space-y-4 hidden">
      <input id="routes-search" type="text" placeholder="Search routes..." class="w-full px-3 py-2 rounded bg-gray-800 text-white placeholder-gray-500 focus:outline-none" />
      <div id="routes-results" class="max-h-72 overflow-y-auto border border-gray-800 rounded divide-y divide-gray-800"></div>
    </div>
    <!-- Map Tab -->
    <div id="map-tab" class="p-4 hidden">
      <h2 id="map-title" class="text-lg mb-2"></h2>
      <div id="map" class="h-80 rounded overflow-hidden"></div>
    </div>
    <!-- Trip Tab -->
    <div id="trip-tab" class="p-4 hidden">
      <h2 id="trip-title" class="text-lg mb-2"></h2>
      <div id="trip-content" class="space-y-2"></div>
    </div>
    <!-- Settings Tab -->
    <div id="settings-tab" class="p-4 space-y-4 hidden">
      <h2 class="text-lg font-semibold mb-2">Settings</h2>
      <div id="settings-content" class="space-y-1 text-sm"></div>
      <hr class="my-4 border-gray-700">
      <h3 class="text-md font-semibold">GTFS &amp; Live feed</h3>
      <form id="gtfs-upload" enctype="multipart/form-data" class="space-y-2">
        <input type="file" name="file" accept=".zip" class="block w-full text-sm bg-gray-800 text-white p-2 rounded" />
        <button type="submit" class="px-3 py-1 bg-blue-600 rounded">Upload GTFS</button>
      </form>
      <input id="feed-url" type="text" placeholder="Feed URL..." class="w-full px-3 py-2 bg-gray-800 text-white placeholder-gray-500 rounded" />
      <button id="feed-submit" class="mt-2 px-3 py-1 bg-blue-600 rounded">Save feed</button>
    </div>
  </main>
  <nav class="border-t border-gray-800 bg-gray-900 flex justify-around py-2">
    <button id="nav-home"     class="flex flex-col items-center px-2 text-xs text-blue-400"><span class="text-lg leading-none">🏠</span><span>Home</span></button>
    <button id="nav-routes"   class="flex flex-col items-center px-2 text-xs text-gray-400 hover:text-blue-400"><span class="text-lg leading-none">🚌</span><span>Routes</span></button>
    <button id="nav-map"      class="flex flex-col items-center px-2 text-xs text-gray-400 hover:text-blue-400"><span class="text-lg leading-none">🗺️</span><span>Map</span></button>
    <button id="nav-settings" class="flex flex-col items-center px-2 text-xs text-gray-400 hover:text-blue-400"><span class="text-lg leading-none">⚙️</span><span>Settings</span></button>
    <button id="nav-trip" class="flex flex-col items-center px-2 text-xs text-gray-400 hidden"><span class="text-lg leading-one">🚏</span><span>Trip</span></button>
  </nav>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Tabkezelés
      const tabs = {
        home: document.getElementById('home-tab'),
        routes: document.getElementById('routes-tab'),
        map: document.getElementById('map-tab'),
        settings: document.getElementById('settings-tab'),
        trip: document.getElementById('trip-tab')
      };
      const navButtons = {
        home: document.getElementById('nav-home'),
        routes: document.getElementById('nav-routes'),
        map: document.getElementById('nav-map'),
        settings: document.getElementById('nav-settings'),
        trip: document.getElementById('nav-trip')
      };
      let currentTab = 'home';
      function showTab(name) {
        Object.keys(tabs).forEach(key => {
          tabs[key].classList.toggle('hidden', key !== name);
          navButtons[key].classList.toggle('text-blue-400', key === name);
          navButtons[key].classList.toggle('text-gray-400', key !== name);
        });
        currentTab = name;
        if (name === 'settings') loadSettings();
      }
      navButtons.home.addEventListener('click',    () => showTab('home'));
      navButtons.routes.addEventListener('click',  () => showTab('routes'));
      navButtons.map.addEventListener('click',     () => showTab('map'));
      navButtons.settings.addEventListener('click',() => showTab('settings'));

      // Státusz frissítés
      let statusCache = null;
      async function fetchStatus() {
        try {
          const res = await fetch('/api/status');
          if (!res.ok) return;
          const data = await res.json();
          document.getElementById('status-time').textContent = 'UK: ' + data.time;
          statusCache = data;
        } catch (e) {}
      }
      fetchStatus();
      setInterval(fetchStatus, 10000);

      // Home tab: megálló keresés és indulások
      const homeSearch  = document.getElementById('home-search');
      const homeResults = document.getElementById('home-results');
      const homeDeps    = document.getElementById('home-departures');
      let homeTimer = null;
      homeSearch.addEventListener('input', () => {
        if (homeTimer) clearTimeout(homeTimer);
        homeTimer = setTimeout(async () => {
          const q = homeSearch.value.trim();
          if (!q) { homeResults.innerHTML = ''; return; }
          try {
            const res = await fetch('/api/stops/search?q=' + encodeURIComponent(q));
            const data = await res.json();
            homeResults.innerHTML = '';
            if (data && data.length > 0) {
              data.forEach(st => {
                const div = document.createElement('div');
                div.className = 'p-2 border-b border-gray-800 hover:bg-gray-700 cursor-pointer';
                div.textContent = st.name;
                div.onclick = () => selectStop(st);
                homeResults.appendChild(div);
              });
            } else {
              homeResults.innerHTML = '<div class="p-2 text-gray-500">No stops found</div>';
            }
          } catch (e) {
            homeResults.innerHTML = '<div class="p-2 text-gray-500">Error</div>';
          }
        }, 300);
      });
      async function selectStop(stop) {
        homeResults.innerHTML = '';
        homeSearch.value = stop.name;
        homeDeps.innerHTML = '<p class="text-sm text-gray-500">Loading departures...</p>';
        try {
          const res = await fetch('/api/departures?stop_id=' + encodeURIComponent(stop.id) + '&window=120');
          const data = await res.json();
          const deps = data.departures || [];
          if (deps.length === 0) {
            homeDeps.innerHTML = '<p class="text-gray-500 text-sm">No departures in the next 2h.</p>';
          } else {
            const list = document.createElement('ul');
            list.className = 'divide-y divide-gray-800';
            deps.forEach(d => {
              const li = document.createElement('li');
              li.className = 'flex justify-between py-1 text-sm cursor-pointer';
              let timeClass;
              if (d.is_live) {
                if (d.is_due)                timeClass = 'text-green-400 animate-pulse';
                else if (d.delay_min > 0)    timeClass = 'text-red-400';
                else if (d.delay_min < 0)    timeClass = 'text-yellow-400';
                else                          timeClass = 'text-green-400';
              } else {
                timeClass = 'text-white';
              }
              li.innerHTML = `<span>${d.route} → ${d.destination}</span><span class="${timeClass}">${d.time_display}</span>`;
              li.onclick = () => showTrip(d.trip_id, d);
              list.appendChild(li);
            });
            homeDeps.innerHTML = '';
            homeDeps.appendChild(list);
          }
        } catch (e) {
          homeDeps.innerHTML = '<p class="text-red-400 text-sm">Error loading departures.</p>';
        }
      }

      // Routes tab: viszonylat keresés
      const routesSearch  = document.getElementById('routes-search');
      const routesResults = document.getElementById('routes-results');
      let routesTimer = null;
      let vehiclesCache = [];
      async function loadVehicles() {
        try {
          const res = await fetch('/api/vehicles');
          const data = await res.json();
          vehiclesCache = data.items || [];
        } catch (e) {
          vehiclesCache = [];
        }
      }
      loadVehicles();
      setInterval(loadVehicles, 15000);
      routesSearch.addEventListener('input', () => {
        if (routesTimer) clearTimeout(routesTimer);
        routesTimer = setTimeout(async () => {
          const q = routesSearch.value.trim();
          if (!q) { routesResults.innerHTML = ''; return; }
          try {
            const res = await fetch('/api/routes/search?q=' + encodeURIComponent(q));
            const data = await res.json();
            routesResults.innerHTML = '';
            if (data && data.length > 0) {
              const counts = {};
              vehiclesCache.forEach(v => {
                const lbl = v.label || '';
                const routeName = lbl.split('·')[0].trim();
                if (routeName) counts[routeName] = (counts[routeName] || 0) + 1;
              });
              data.forEach(r => {
                const div = document.createElement('div');
                div.className = 'p-3 flex justify-between items-center cursor-pointer hover:bg-gray-700';
                const count = counts[r.route] || 0;
                const busList = vehiclesCache.filter(v => {
                  const routeName = (v.label || '').split('·')[0].trim();
                  return routeName === r.route;
                }).map(v => v.vehicle_ref || '').filter(x => x);
                let sub;
                if (count > 0) {
                  sub = `Live (${count}): ${busList.join(', ')}`;
                } else {
                  sub = 'No buses';
                }
                div.innerHTML = `<span class="font-semibold text-sm text-blue-300">${r.route}</span><span class="${count ? 'text-green-400' : 'text-gray-500'} text-xs">${sub}</span>`;
                div.onclick = () => { selectedRoute = r.route; updateMap(); showTab('map'); };
                routesResults.appendChild(div);
              });
            } else {
              routesResults.innerHTML = '<div class="p-2 text-gray-500">No routes found</div>';
            }
          } catch (e) {
            routesResults.innerHTML = '<div class="p-2 text-red-400">Error</div>';
          }
        }, 300);
      });

      // Map tab: shape + élő buszok
      let map = null;
      let shapeLayer = null;
      let markers = [];
      let selectedRoute = null;
      function initMap() {
        if (!map) {
          map = L.map('map').setView([50.92, -1.40], 12);
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
        }
      }
      async function updateMap() {
        if (!selectedRoute) return;
        initMap();
        document.getElementById('map-title').textContent = 'Route ' + selectedRoute;
        try {
          const shapeRes = await fetch('/api/route-shape?route=' + encodeURIComponent(selectedRoute));
          const shapeData = await shapeRes.json();
          if (shapeLayer) { map.removeLayer(shapeLayer); shapeLayer = null; }
          if (shapeData.shape && shapeData.shape.length > 0) {
            const coords = shapeData.shape.map(([lat, lon]) => [lat, lon]);
            shapeLayer = L.polyline(coords, { color: '#007bff' }).addTo(map);
            map.fitBounds(shapeLayer.getBounds());
          }
        } catch (e) {}
        try {
          const vRes = await fetch('/api/vehicles?route=' + encodeURIComponent(selectedRoute));
          const vData = await vRes.json();
          markers.forEach(m => map.removeLayer(m));
          markers = [];
          (vData.items || []).forEach(it => {
            if (it.lat && it.lon) {
              const m = L.marker([it.lat, it.lon]);
              m.bindPopup(it.label || 'bus');
              m.addTo(map);
              markers.push(m);
            }
          });
        } catch (e) {}
      }
      setInterval(() => {
        if (currentTab === 'map' && selectedRoute) updateMap();
      }, 20000);

      // Settings tab
      async function loadSettings() {
        if (!statusCache) return;
        const c = statusCache;
        document.getElementById('settings-content').innerHTML = `
          <p>Version: ${c.version}</p>
          <p>Build: ${c.build}</p>
          <p>GTFS ready: ${c.gtfs_ready ? 'Yes' : 'No'} (${c.gtfs_stops})</p>
          <p>Live feed configured: ${c.live_feed_configured ? 'Yes' : 'No'}</p>
        `;
      }

      // Trip tab: teljes megállólista
      async function showTrip(trip_id, depInfo) {
        showTab('trip');
        const title   = document.getElementById('trip-title');
        const content = document.getElementById('trip-content');
        content.innerHTML = '<p class="text-sm text-gray-500">Loading trip…</p>';
        try {
          const [tripRes, vehRes] = await Promise.all([
            fetch('/api/trip?trip_id=' + encodeURIComponent(trip_id)),
            fetch('/api/vehicles?route=' + encodeURIComponent(depInfo.route))
          ]);
          const tripData = await tripRes.json();
          const vehData  = await vehRes.json();
          const stops    = (tripData && tripData.stops) ? tripData.stops : [];
          const fleets   = (vehData && vehData.items) ? vehData.items.map(v => v.vehicle_ref || '').filter(x => x) : [];
          title.textContent = `${depInfo.route} → ${depInfo.destination}${fleets.length ? ' (Fleet: ' + fleets.join(', ') + ')' : ''}`;
          if (!stops || stops.length === 0) {
            content.innerHTML = '<p class="text-gray-500 text-sm">No trip data.</p>';
            return;
          }
          const currentIndex = stops.findIndex(s => !s.is_past);
          const list = document.createElement('ul');
          list.className = 'divide-y divide-gray-800';
          stops.forEach((s, idx) => {
            const li = document.createElement('li');
            li.className = 'flex justify-between py-1 text-sm';
            let css;
            if (s.is_past)       css = 'text-gray-500';
            else if (idx === currentIndex) css = 'text-green-400 font-bold';
            else                css = '';
            li.innerHTML = `<span class="${css}">${s.stop_name}</span><span class="${css}">${s.time_display}</span>`;
            list.appendChild(li);
          });
          content.innerHTML = '';
          content.appendChild(list);
        } catch (e) {
          title.textContent = `${depInfo.route} → ${depInfo.destination}`;
          content.innerHTML = '<p class="text-red-400 text-sm">Error loading trip.</p>';
        }
      }

      // GTFS feltöltés (Settings)
      document.getElementById('gtfs-upload').addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        try {
          const res = await fetch('/api/gtfs/upload', { method: 'POST', body: formData });
          const data = await res.json();
          alert('GTFS uploaded: ' + JSON.stringify(data));
        } catch (err) {
          alert('Error uploading GTFS: ' + err);
        }
      });
      // Élő feed mentése (Settings)
      document.getElementById('feed-submit').addEventListener('click', async () => {
        const url = document.getElementById('feed-url').value.trim();
        if (!url) { alert('Please enter feed URL'); return; }
        try {
          const res = await fetch('/api/live/config', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ feed_url: url, refresh_sec: 30 })
          });
          const data = await res.json();
          alert('Live feed saved: ' + JSON.stringify(data));
        } catch (err) {
          alert('Error saving feed: ' + err);
        }
      });

      // Kezdőlap
      showTab('home');
    });
  </script>
</body>
</html>
