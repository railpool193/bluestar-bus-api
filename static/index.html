<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bluestar & Unilink – Menetrend / Live</title>

  <link rel="preconnect" href="https://unpkg.com" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

  <style>
    :root{
      --bg:#0b0f14;
      --card:#111824;
      --card2:#0f1620;
      --text:#e9eef6;
      --muted:#9fb0c7;
      --accent:#6aa7ff;
      --danger:#ff6a6a;
      --ok:#65d48b;
      --border: rgba(255,255,255,.08);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .app{
      max-width: 860px;
      margin: 0 auto;
      padding: 12px;
      min-height: 100vh;
      display:flex;
      flex-direction: column;
      gap: 10px;
    }
    .topbar{
      display:flex;
      align-items:center;
      justify-content: space-between;
      gap:10px;
      padding: 12px 12px;
      border: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
      border-radius: 16px;
    }
    .title{
      font-weight: 800;
      letter-spacing:.2px;
      font-size: 16px;
    }
    .pill{
      font-size: 12px;
      color: var(--muted);
      border:1px solid var(--border);
      padding: 6px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .tabs{
      display:flex;
      gap: 8px;
      padding: 6px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.03);
      border-radius: 16px;
    }
    .tab{
      flex:1;
      text-align:center;
      padding: 10px 8px;
      border-radius: 12px;
      border: 1px solid transparent;
      color: var(--muted);
      user-select:none;
      cursor:pointer;
      font-weight: 700;
    }
    .tab.active{
      background: rgba(106,167,255,.14);
      border-color: rgba(106,167,255,.35);
      color: var(--text);
    }
    .card{
      border: 1px solid var(--border);
      background: rgba(17,24,36,.96); /* ne legyen “túl átlátszó” */
      border-radius: 16px;
      overflow:hidden;
    }
    .cardHeader{
      padding: 12px 12px 10px;
      border-bottom: 1px solid var(--border);
      display:flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .cardHeader h2{
      margin:0;
      font-size: 16px;
      letter-spacing:.2px;
    }
    .btn{
      border:1px solid var(--border);
      background: rgba(255,255,255,.05);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 12px;
      cursor:pointer;
      font-weight: 700;
    }
    .btn:active{transform: translateY(1px)}
    .row{display:flex; gap:10px; padding:12px}
    .col{flex:1; min-width:0}
    input{
      width:100%;
      padding: 12px 12px;
      border-radius: 12px;
      border:1px solid var(--border);
      background: rgba(0,0,0,.25);
      color: var(--text);
      outline:none;
      font-size: 14px;
    }
    .hint{color: var(--muted); font-size: 12px; padding: 0 12px 12px}
    .list{
      display:flex;
      flex-direction: column;
      gap: 8px;
      padding: 12px;
    }
    .item{
      border:1px solid var(--border);
      background: rgba(255,255,255,.03);
      border-radius: 14px;
      padding: 10px 10px;
      display:flex;
      justify-content: space-between;
      gap: 10px;
      cursor:pointer;
    }
    .itemTitle{font-weight:800}
    .itemSub{color: var(--muted); font-size: 12px; margin-top: 2px}
    .time{font-weight:900; color: var(--accent)}
    .error{
      margin: 12px;
      border:1px solid rgba(255,106,106,.35);
      background: rgba(255,106,106,.12);
      color: #ffd9d9;
      border-radius: 14px;
      padding: 10px;
      white-space: pre-wrap;
      font-size: 12px;
    }
    .ok{
      margin: 12px;
      border:1px solid rgba(101,212,139,.35);
      background: rgba(101,212,139,.10);
      color: #d9ffe6;
      border-radius: 14px;
      padding: 10px;
      font-size: 12px;
    }
    #mapLive, #mapTrip{
      height: 300px;
      width:100%;
    }
    .split{
      display:grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }
    @media (min-width: 860px){
      .split{grid-template-columns: 1.1fr .9fr;}
      #mapLive, #mapTrip{height: 360px;}
    }
    .scrollBox{
      max-height: 360px; /* TRIP nézet görgethető */
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 12px;
    }
    .stopRow{
      display:flex;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 10px;
      border:1px solid var(--border);
      border-radius: 14px;
      background: rgba(255,255,255,.03);
      margin-bottom: 8px;
    }
    .stopName{font-weight:800}
    .stopCode{color: var(--muted); font-size: 12px}
    .muted{color: var(--muted)}
    .badge{
      font-size: 12px;
      font-weight: 900;
      padding: 4px 8px;
      border-radius: 999px;
      border:1px solid var(--border);
      color: var(--muted);
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="title">Bluestar & Unilink</div>
      <div class="pill" id="pillStatus">API: …</div>
    </div>

    <div class="tabs">
      <div class="tab active" data-tab="stop">MEGÁLLÓ</div>
      <div class="tab" data-tab="trip">MENETREND</div>
      <div class="tab" data-tab="live">LIVE</div>
    </div>

    <!-- STOP -->
    <div class="card" id="viewStop">
      <div class="cardHeader">
        <h2>Megálló keresés</h2>
        <button class="btn" id="btnHealth">Health</button>
      </div>
      <div class="row">
        <div class="col">
          <input id="stopQuery" placeholder="Írj be megálló nevet vagy kódot (pl. 1900HA...)" />
          <div class="hint">Tipp: ha nincs LIVE adat, a LIVE nézetben látod a backend hibát (pl. 403).</div>
        </div>
      </div>
      <div id="stopResults" class="list"></div>
      <div id="stopError" class="error" style="display:none"></div>
    </div>

    <!-- TRIP -->
    <div class="card" id="viewTrip" style="display:none">
      <div class="cardHeader">
        <h2 id="tripTitle">Trip</h2>
        <button class="btn" id="btnBackToStop">Vissza</button>
      </div>

      <div class="split">
        <div class="card" style="margin:12px;">
          <div id="mapTrip"></div>
          <div class="hint" id="tripMeta"></div>
        </div>

        <div class="card" style="margin:12px;">
          <div class="cardHeader" style="border-bottom:none">
            <h2>Megállók</h2>
            <span class="badge" id="tripStopCount">0</span>
          </div>
          <div class="scrollBox" id="tripStops"></div>
        </div>
      </div>

      <div id="tripError" class="error" style="display:none"></div>
    </div>

    <!-- LIVE -->
    <div class="card" id="viewLive" style="display:none">
      <div class="cardHeader">
        <h2>Élő térkép</h2>
        <button class="btn" id="btnRefreshLive">Frissítés</button>
      </div>
      <div class="row">
        <div class="col">
          <input id="operatorRefs" value="BLUS,UNIL" />
          <div class="hint">OperatorRef (NOC) vesszővel: pl. <b>BLUS,UNIL</b></div>
        </div>
      </div>
      <div style="padding: 0 12px 12px;">
        <div id="mapLive"></div>
      </div>
      <div id="liveError" class="error" style="display:none"></div>
      <div class="hint" id="liveMeta"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const $ = (sel) => document.querySelector(sel);

    // Tabs
    const tabs = document.querySelectorAll(".tab");
    tabs.forEach(t => t.addEventListener("click", () => {
      tabs.forEach(x => x.classList.remove("active"));
      t.classList.add("active");
      showView(t.dataset.tab);
    }));

    function showView(name){
      $("#viewStop").style.display = (name === "stop") ? "" : "none";
      $("#viewTrip").style.display = (name === "trip") ? "" : "none";
      $("#viewLive").style.display = (name === "live") ? "" : "none";
      if(name === "live"){
        setTimeout(() => { liveMap?.invalidateSize(); }, 100);
      }
      if(name === "trip"){
        setTimeout(() => { tripMap?.invalidateSize(); }, 100);
      }
    }

    // Health
    $("#btnHealth").addEventListener("click", async () => {
      const h = await apiGet("/health");
      if(h.ok){
        $("#pillStatus").textContent = "API: OK";
      }else{
        $("#pillStatus").textContent = "API: HIBA";
      }
    });

    async function apiGet(path){
      try{
        const r = await fetch(path, { cache: "no-store" });
        const ct = (r.headers.get("content-type")||"").toLowerCase();
        let data = null;
        if(ct.includes("application/json")) data = await r.json();
        else data = await r.text();
        if(!r.ok) return { ok:false, status:r.status, data };
        return { ok:true, status:r.status, data };
      }catch(e){
        return { ok:false, status:0, data: String(e) };
      }
    }

    // Stop search (debounce)
    let stopTimer = null;
    $("#stopQuery").addEventListener("input", () => {
      clearTimeout(stopTimer);
      stopTimer = setTimeout(runStopSearch, 250);
    });

    async function runStopSearch(){
      const q = $("#stopQuery").value.trim();
      $("#stopError").style.display = "none";
      $("#stopResults").innerHTML = "";
      if(q.length < 2) return;

      // FONTOS: limit INT -> NE legyen "20/" !!
      const res = await apiGet(`/api/stops/search?q=${encodeURIComponent(q)}&limit=20`);
      if(!res.ok){
        $("#stopError").style.display = "";
        $("#stopError").textContent = formatErr(res);
        return;
      }

      const stops = res.data.stops || [];
      if(!stops.length){
        $("#stopResults").innerHTML = `<div class="hint">Nincs találat.</div>`;
        return;
      }

      $("#stopResults").innerHTML = stops.map(s => `
        <div class="item" data-stop="${s.stop_id}">
          <div>
            <div class="itemTitle">${escapeHtml(s.stop_name || s.stop_id)}</div>
            <div class="itemSub">${escapeHtml(s.stop_id)}</div>
          </div>
          <div class="time">→</div>
        </div>
      `).join("");

      document.querySelectorAll("#stopResults .item").forEach(el => {
        el.addEventListener("click", () => openStop(el.dataset.stop));
      });
    }

    async function openStop(stopId){
      // Megnyitjuk a MENETREND / TRIP listát úgy, hogy lekérjük a megálló indulásait
      tabs.forEach(x => x.classList.remove("active"));
      document.querySelector(`.tab[data-tab="trip"]`).classList.add("active");
      showView("trip");

      $("#tripTitle").textContent = `Stop → ${stopId}`;
      $("#tripError").style.display = "none";
      $("#tripStops").innerHTML = "";
      $("#tripStopCount").textContent = "…";
      $("#tripMeta").textContent = "";

      const today = new Date();
      const yyyy = today.getFullYear();
      const mm = String(today.getMonth()+1).padStart(2,"0");
      const dd = String(today.getDate()).padStart(2,"0");
      const serviceDate = `${yyyy}-${mm}-${dd}`;

      // FONTOS: max_results INT -> NE legyen "20/" !!
      const dep = await apiGet(`/api/stop/${encodeURIComponent(stopId)}/departures?service_date=${serviceDate}&max_results=25`);
      if(!dep.ok){
        $("#tripError").style.display = "";
        $("#tripError").textContent = formatErr(dep);
        return;
      }

      const deps = dep.data.departures || [];
      $("#tripMeta").textContent = `${dep.data.stop?.stop_name || stopId} • ${dep.data.service_date} • from ${dep.data.time_from}`;
      $("#tripStopCount").textContent = deps.length;

      // trip nézet itt most indulás-lista lesz: rákatt -> trip detail
      $("#tripStops").innerHTML = deps.map(d => `
        <div class="stopRow" data-trip="${escapeAttr(d.trip_id)}">
          <div>
            <div class="stopName">${escapeHtml((d.route_short_name || "") + " → " + (d.headsign || ""))}</div>
            <div class="stopCode">${escapeHtml(d.trip_id)}</div>
          </div>
          <div class="time">${escapeHtml(d.departure_time || "")}</div>
        </div>
      `).join("");

      document.querySelectorAll("#tripStops .stopRow").forEach(el => {
        el.addEventListener("click", () => openTrip(el.dataset.trip, serviceDate));
      });

      // Térkép: középre Southampton környéke default
      initTripMapIfNeeded();
      clearTripMap();
      tripMap.setView([50.91, -1.40], 11);
    }

    $("#btnBackToStop").addEventListener("click", () => {
      tabs.forEach(x => x.classList.remove("active"));
      document.querySelector(`.tab[data-tab="stop"]`).classList.add("active");
      showView("stop");
    });

    // Trip detail view + polyline
    let tripMap = null;
    let tripLine = null;
    let tripMarkers = [];
    function initTripMapIfNeeded(){
      if(tripMap) return;
      tripMap = L.map("mapTrip");
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19 }).addTo(tripMap);
    }
    function clearTripMap(){
      if(tripLine){ tripMap.removeLayer(tripLine); tripLine = null; }
      tripMarkers.forEach(m => tripMap.removeLayer(m));
      tripMarkers = [];
    }

    async function openTrip(tripId, serviceDate){
      $("#tripTitle").textContent = `Trip: ${tripId}`;
      $("#tripError").style.display = "none";
      $("#tripMeta").textContent = `service_date: ${serviceDate}`;
      $("#tripStops").innerHTML = "";
      $("#tripStopCount").textContent = "…";

      initTripMapIfNeeded();
      clearTripMap();

      const res = await apiGet(`/api/trip?trip_id=${encodeURIComponent(tripId)}&service_date=${encodeURIComponent(serviceDate)}`);
      if(!res.ok){
        $("#tripError").style.display = "";
        $("#tripError").textContent = formatErr(res);
        return;
      }

      const t = res.data;
      const route = t.route || {};
      $("#tripMeta").textContent = `${route.route_short_name || ""} ${route.route_long_name || ""} • ${t.headsign || ""} • ${t.service_date}`;
      const stops = t.stops || [];
      $("#tripStopCount").textContent = stops.length;

      // Stops list scrollable
      $("#tripStops").innerHTML = stops.map(s => `
        <div class="stopRow">
          <div>
            <div class="stopName">${escapeHtml(s.stop_name || s.stop_id)}</div>
            <div class="stopCode">${escapeHtml(s.stop_id)}</div>
          </div>
          <div class="muted">${escapeHtml((s.departure_time || "").slice(0,5))}</div>
        </div>
      `).join("");

      // Draw shape polyline
      const shape = t.shape || [];
      if(shape.length){
        const latlngs = shape.map(p => [p.lat, p.lon]);
        tripLine = L.polyline(latlngs).addTo(tripMap);
        tripMap.fitBounds(tripLine.getBounds(), { padding:[16,16] });
      }else{
        // fallback: fit to stops if coords exist
        const coords = stops.filter(s => s.stop_lat && s.stop_lon).map(s => [s.stop_lat, s.stop_lon]);
        if(coords.length){
          tripLine = L.polyline(coords).addTo(tripMap);
          tripMap.fitBounds(tripLine.getBounds(), { padding:[16,16] });
        }else{
          tripMap.setView([50.91, -1.40], 11);
        }
      }

      // Optional: megálló pöttyök
      stops.forEach(s => {
        if(s.stop_lat && s.stop_lon){
          const m = L.circleMarker([s.stop_lat, s.stop_lon], { radius:4 });
          m.addTo(tripMap);
          tripMarkers.push(m);
        }
      });
    }

    // LIVE map
    let liveMap = null;
    let liveMarkers = [];
    function initLiveMapIfNeeded(){
      if(liveMap) return;
      liveMap = L.map("mapLive");
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19 }).addTo(liveMap);
      liveMap.setView([50.91, -1.40], 11);
    }
    function clearLiveMarkers(){
      liveMarkers.forEach(m => liveMap.removeLayer(m));
      liveMarkers = [];
    }

    $("#btnRefreshLive").addEventListener("click", refreshLive);

    async function refreshLive(){
      initLiveMapIfNeeded();
      clearLiveMarkers();
      $("#liveError").style.display = "none";
      $("#liveMeta").textContent = "";

      const op = $("#operatorRefs").value.trim() || "BLUS,UNIL";
      const res = await apiGet(`/api/live/vehicles?operatorRef=${encodeURIComponent(op)}`);
      if(!res.ok){
        $("#liveError").style.display = "";
        $("#liveError").textContent = formatErr(res);
        return;
      }

      const meta = res.data.meta || {};
      $("#liveMeta").textContent = `LIVE: ${res.data.count} jármű • cached=${!!meta.cached} • status=${meta.status}`;

      const vehicles = res.data.vehicles || [];
      vehicles.forEach(v => {
        if(!v.latitude || !v.longitude) return;
        const label = `${v.publishedLineName || v.lineRef || "?"} → ${v.destinationName || v.destinationRef || ""}\nveh: ${v.vehicleRef || ""}`;
        const m = L.marker([v.latitude, v.longitude]).addTo(liveMap).bindPopup(escapeHtml(label));
        liveMarkers.push(m);
      });
    }

    function formatErr(res){
      if(typeof res.data === "string") return `HTTP ${res.status}\n${res.data}`;
      try{
        return `HTTP ${res.status}\n${JSON.stringify(res.data, null, 2)}`;
      }catch(e){
        return `HTTP ${res.status}\n${String(res.data)}`;
      }
    }
    function escapeHtml(s){
      return String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    function escapeAttr(s){
      return escapeHtml(s).replace(/"/g, "&quot;");
    }

    // initial health
    (async () => {
      const h = await apiGet("/health");
      $("#pillStatus").textContent = h.ok ? "API: OK" : "API: HIBA";
      // előkészít maps (lazy)
      initLiveMapIfNeeded();
    })();
  </script>
</body>
</html>
