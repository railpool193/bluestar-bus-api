<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>bluestar</title>

  <!-- Leaflet (térkép a triphez – opcionális, ha nincs koordináta, nem rajzol) -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <style>
    :root{
      --bg:#0d1117; --card:#0f172a; --border:#1f2937; --text:#e5e7eb; --sub:#94a3b8;
      --brand:#60a5fa; --live:#34d399; --sched:#e5e7eb;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
    .wrap{max-width:960px;margin:0 auto;padding:0 12px}
    header{display:flex;align-items:center;justify-content:space-between;padding:16px;border-bottom:1px solid var(--border);background:#0b1220}
    header .brand{display:flex;align-items:center;gap:8px;color:#7dd3fc;font-weight:600;font-size:22px}
    header .brand .star{filter:saturate(1.4)}
    header .clock{color:var(--sub);font-size:12px}
    h1{margin:14px 0 8px 0;font-size:22px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden}
    .section{margin:18px 0}
    .row{display:flex;align-items:center;padding:10px 12px;border-bottom:1px solid var(--border)}
    .row:last-child{border-bottom:none}
    .left{width:82px;text-align:right;padding-right:8px;font-variant-numeric:tabular-nums}
    .middle{flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .right{width:96px;text-align:right;padding-left:8px;color:#cbd5e1;font-variant-numeric:tabular-nums}
    .time-live{color:var(--live)}
    .time-sched{color:var(--sched)}
    .muted{color:var(--sub)}
    .grid{display:grid;grid-template-columns:1fr;gap:14px}
    #map{height:300px;border-radius:12px;overflow:hidden}
    .pill{display:inline-block;padding:2px 8px;border:1px solid var(--border);border-radius:999px;color:var(--sub);font-size:12px}
    .hint{font-size:12px;color:var(--sub);margin-top:6px}
    .titlebar{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
    .titlebar .sub{color:var(--sub);font-size:14px}
    a{color:#93c5fd;text-decoration:none}
    a:hover{text-decoration:underline}
    .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
    .toolbar input{background:#0b1220;border:1px solid var(--border);color:var(--text);border-radius:10px;padding:8px 10px;min-width:180px}
    .toolbar button{background:#1d4ed8;border:none;color:white;border-radius:10px;padding:8px 12px;cursor:pointer}
    .toolbar button.secondary{background:#374151}
    .toolbar button:disabled{opacity:.6;cursor:not-allowed}
  </style>
</head>
<body>
  <header>
    <div class="brand"><span class="star">★</span><span>bluestar</span></div>
    <div class="clock" id="clock">UK: --:--:--</div>
  </header>

  <main class="wrap">
    <!-- TRIP NÉZET -->
    <section class="section" id="tripSection" hidden>
      <div class="titlebar">
        <h1 id="tripTitle">Trip</h1>
        <span class="sub" id="tripSub"></span>
      </div>

      <div class="toolbar">
        <input id="tripIdInput" placeholder="tripId…" />
        <input id="vehicleIdInput" placeholder="vehicleId (opcionális)…" />
        <button id="tripLoadBtn">Betölt</button>
        <span class="pill" id="tripAgencyPill">—</span>
      </div>

      <div class="card" id="tripList"></div>
      <div class="hint">A bal oldali idő <span class="time-live">zöld</span> ha *LIVE*, egyébként fehér (menetrend). A jobb oldalon visszaszámláló látható az érkezésig.</div>

      <div class="section">
        <div id="map" class="card"></div>
      </div>
    </section>

    <!-- MEGÁLLÓ NÉZET -->
    <section class="section" id="stopSection" hidden>
      <div class="titlebar">
        <h1 id="stopTitle">Megálló</h1>
        <span class="sub" id="stopRole"></span>
      </div>

      <div class="toolbar">
        <input id="stopIdInput" placeholder="stopId…" />
        <button id="stopLoadBtn">Betölt</button>
        <span class="pill" id="stopAgencyPill">Bluestar/Unilink szűrés aktív</span>
      </div>

      <div class="card" id="stopList"></div>
      <div class="hint">Ha a megálló **végállomás**, csak indulások látszanak (érkezők elrejtve).</div>
    </section>
  </main>

  <script>
    /* ======== KONFIG ======== */
    const CONFIG = {
      // API útvonalak: ha nálad más, itt állítsd
      api: {
        trip: (tripId) => `/api/trip/${encodeURIComponent(tripId)}`,
        vehiclesByTrip: (tripId) => `/api/vehicles?tripId=${encodeURIComponent(tripId)}`,
        stopBoard: (stopId) => `/api/stop/${encodeURIComponent(stopId)}/board`,
      },
      allowedAgencies: ["bluestar", "unilink", "uni-link", "uni link"],
    };

    /* ======== HASZNOS FÜGGVÉNYEK ======== */
    const $ = (sel) => document.querySelector(sel);
    const pad2 = (n) => String(n).padStart(2, "0");
    const hhmm = (ts) => {
      if (!ts) return "—";
      const d = new Date(ts);
      return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
    };
    const msUntil = (ts) => ts - Date.now();
    const fmtCountdown = (ms) => {
      if (ms <= 0) return "0:00";
      const sec = Math.floor(ms / 1000);
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;
      return h > 0 ? `${h}:${pad2(m)}:${pad2(s)}` : `${m}:${pad2(s)}`;
    };
    const agencyAllowed = (a) => {
      if (!a) return false;
      const name = (a.name || a || "").toString().toLowerCase();
      return CONFIG.allowedAgencies.some(x => name.includes(x));
    };

    function setClock() {
      const d = new Date();
      $("#clock").textContent = `UK: ${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`;
    }
    setClock(); setInterval(setClock, 1000);

    /* ======== TRIP NÉZET ======== */
    const tripSection = $("#tripSection");
    const tripList = $("#tripList");
    const tripTitle = $("#tripTitle");
    const tripSub = $("#tripSub");
    const tripAgencyPill = $("#tripAgencyPill");
    const tripIdInput = $("#tripIdInput");
    const vehicleIdInput = $("#vehicleIdInput");
    const tripLoadBtn = $("#tripLoadBtn");

    let map, vehicleMarker, routeLine;
    function ensureMap() {
      if (map) return map;
      map = L.map("map");
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap contributors",
      }).addTo(map);
      map.setView([50.9097, -1.4044], 11); // Southampton környék alap nézet
      return map;
    }

    function renderStopRow(container, stopName, schedTs, liveTs) {
      const row = document.createElement("div"); row.className = "row";
      const left = document.createElement("div"); left.className = "left " + (liveTs ? "time-live" : "time-sched");
      left.textContent = hhmm(liveTs ?? schedTs);
      const mid = document.createElement("div"); mid.className = "middle"; mid.textContent = stopName;
      const right = document.createElement("div"); right.className = "right";
      row.append(left, mid, right);
      container.appendChild(row);

      function tick() {
        const ts = (liveTs ?? schedTs);
        right.textContent = ts ? fmtCountdown(msUntil(ts)) : "";
      }
      tick(); const t = setInterval(tick, 1000);
      row._timer = t;
    }

    async function loadTrip(tripId, vehicleId) {
      tripList.innerHTML = `<div class="row"><div class="middle muted">Betöltés…</div></div>`;

      const trip = await fetch(CONFIG.api.trip(tripId)).then(r => r.json());
      // Ügynökség szűrés
      if (trip?.agency && !agencyAllowed(trip.agency)) {
        tripList.innerHTML = `<div class="row"><div class="middle muted">Ez a trip nem Bluestar/Unilink ügynökséghez tartozik.</div></div>`;
        tripTitle.textContent = "Trip";
        tripSub.textContent = "";
        tripAgencyPill.textContent = trip?.agency?.name ?? "—";
        return;
      }

      // Járművek (csak a triphez tartozó + opcionális vehicleId)
      const vehicles = await fetch(CONFIG.api.vehiclesByTrip(tripId)).then(r => r.json());
      const allowedVehicles = (vehicles || [])
        .filter(v => agencyAllowed(v.agency))
        .filter(v => v.tripId === tripId);
      const filtered = vehicleId
        ? allowedVehicles.filter(v => (v.id === vehicleId) || (v.label === vehicleId))
        : allowedVehicles;
      filtered.sort((a,b) => (b.lastUpdate||0)-(a.lastUpdate||0));
      const vehicle = filtered[0] || null;

      // Fejléc
      const titleLeft = (trip.routeShortName ? trip.routeShortName + " " : "");
      tripTitle.textContent = `${titleLeft}${trip.headsign ? "→ " + trip.headsign : ""}`.trim() || "Trip";
      tripSub.textContent = vehicle ? `Jármű: ${vehicle.label || vehicle.id}` : "Nincs bejelentkezett jármű ehhez a triphez";
      tripAgencyPill.textContent = trip?.agency?.name || "—";

      // Lista kirajzolása
      tripList.innerHTML = "";
      (trip.stopTimes || []).forEach(st => {
        renderStopRow(tripList, st.stopName, st.schedTs, st.liveTs);
      });

      // TÉRKÉP (ha van koordináta a stopTimes sorokban)
      try {
        ensureMap();
        const pts = (trip.stopTimes || [])
          .filter(st => typeof st.lat === "number" && typeof st.lon === "number")
          .map(st => [st.lat, st.lon]);
        if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
        if (pts.length >= 2) {
          routeLine = L.polyline(pts, { weight: 4 }).addTo(map);
          map.fitBounds(routeLine.getBounds(), { padding: [20, 20] });
        }
        if (vehicleMarker) { map.removeLayer(vehicleMarker); vehicleMarker = null; }
        if (vehicle && typeof vehicle.lat === "number" && typeof vehicle.lon === "number") {
          vehicleMarker = L.marker([vehicle.lat, vehicle.lon]).addTo(map);
        }
      } catch (e) {
        console.warn("Map render skipped:", e);
      }
    }

    tripLoadBtn.addEventListener("click", () => {
      const t = tripIdInput.value.trim();
      if (!t) return;
      const v = vehicleIdInput.value.trim() || undefined;
      const url = new URL(location.href);
      url.searchParams.set("tripId", t);
      v ? url.searchParams.set("vehicleId", v) : url.searchParams.delete("vehicleId");
      history.replaceState({}, "", url);
      loadTrip(t, v);
      // stop kontextushoz is jól jön a trip – alább a stopnál felhasználjuk
      window.__CTX_TRIPID__ = t;
    });

    /* ======== MEGÁLLÓ NÉZET ======== */
    const stopSection = $("#stopSection");
    const stopList = $("#stopList");
    const stopTitle = $("#stopTitle");
    const stopRole = $("#stopRole");
    const stopIdInput = $("#stopIdInput");
    const stopLoadBtn = $("#stopLoadBtn");
    const stopAgencyPill = $("#stopAgencyPill");

    async function loadStop(stopId, ctxTripId) {
      stopList.innerHTML = `<div class="row"><div class="middle muted">Betöltés…</div></div>`;

      // Board lekérés + Bluestar/Unilink szűrés
      const sb = await fetch(CONFIG.api.stopBoard(stopId)).then(r => r.json());
      sb.rows = (sb.rows || []).filter(r => agencyAllowed(r.agency));

      stopTitle.textContent = sb?.stop?.name || "Megálló";

      // Ha kapunk context trip-et, eldöntjük: induló / végállomás / normál
      let role = "NO";
      try {
        if (ctxTripId) {
          const t = await fetch(CONFIG.api.trip(ctxTripId)).then(r => r.json());
          const sts = t.stopTimes || [];
          const first = sts[0]?.stopId, last = sts[sts.length-1]?.stopId;
          if (stopId === last) role = "END";
          else if (stopId === first) role = "START";
        }
      } catch(e){/* ignore */ }

      stopRole.textContent = role === "END"
        ? "Végállomás – csak indulások jelennek meg"
        : role === "START"
          ? "Induló megálló"
          : "";

      // Sorok – VÉGÁLLOMÁSNÁL CSAK INDULÁSOK
      const rows = (sb.rows || []).filter(r => {
        if (role === "END") {
          const hasDeparture = !!(r.depLiveTs ?? r.depTs);
          const canBoard = (r.canBoard !== false);
          return hasDeparture && canBoard;
        }
        return true;
      });

      stopList.innerHTML = "";
      if (!rows.length) {
        stopList.innerHTML = `<div class="row"><div class="middle muted">Nincs megjeleníthető indulás.</div></div>`;
        return;
      }

      rows.forEach(r => {
        const name = `${r.routeShortName || ""} → ${r.headsign || ""}`.trim();
        const sched = r.depTs ?? r.arrTs;
        const live  = r.depLiveTs ?? r.arrLiveTs;
        renderStopRow(stopList, name, sched, live);
      });
    }

    stopLoadBtn.addEventListener("click", () => {
      const s = stopIdInput.value.trim();
      if (!s) return;
      const url = new URL(location.href);
      url.searchParams.set("stopId", s);
      history.replaceState({}, "", url);
      loadStop(s, window.__CTX_TRIPID__);
    });

    /* ======== INDULÁSKORI PARAMÉTEREK ======== */
    (function initFromQuery() {
      const q = new URLSearchParams(location.search);
      const tripId = q.get("tripId");
      const vehicleId = q.get("vehicleId") || undefined;
      const stopId = q.get("stopId");

      // mely szekciók látszanak
      tripSection.hidden = !tripId;
      stopSection.hidden = !stopId;

      if (tripId) {
        tripIdInput.value = tripId;
        if (vehicleId) vehicleIdInput.value = vehicleId;
        loadTrip(tripId, vehicleId);
        window.__CTX_TRIPID__ = tripId;
      }
      if (stopId) {
        stopIdInput.value = stopId;
        loadStop(stopId, window.__CTX_TRIPID__);
      }

      // ha egyik sincs, legalább az egyik panel legyen látható
      if (!tripId && !stopId) tripSection.hidden = false;
    })();
  </script>
</body>
</html>
