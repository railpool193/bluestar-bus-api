<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Bluestar menetrend & live</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--bg:#0d1220;--card:#10172a;--text:#e7ecff;--muted:#9aa3b2;--accent:#7c8cff;--good:#2bd576;}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,Arial}
.container{max-width:1000px;margin:24px auto;padding:0 14px}
.card{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 8px 26px rgba(0,0,0,.35);margin-bottom:16px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
input,button{font:inherit} input{flex:1;background:#0f1426;color:#fff;border:1px solid #1c2745;border-radius:12px;padding:10px}
button{background:var(--accent);color:#fff;border:none;border-radius:12px;padding:10px 14px;font-weight:700;cursor:pointer}
.badge{display:inline-block;background:#0f1426;border:1px solid #1c2745;padding:6px 10px;border-radius:999px;margin-right:8px}
h1{margin:0 0 8px} small{color:var(--muted)}
.list li{padding:6px 4px;border-bottom:1px dashed #223}
#map{height:420px;border-radius:16px;overflow:hidden}
</style>
</head>
<body>
<div class="container">
  <h1>🚌 Bluestar menetrend & megálló kereső</h1>
  <div class="card"><div class="row">
    <div class="badge" id="uk">UK: --:--:--</div>
    <div class="badge" id="gtfs">GTFS: …</div>
    <div class="badge" id="live">Live: …</div>
  </div></div>

  <div class="card">
    <h3>Megálló kereső</h3>
    <div class="row">
      <input id="qstop" placeholder="Megálló neve…">
      <button onclick="searchStops()">Keresés</button>
    </div>
    <ul id="stops" class="list"></ul>
  </div>

  <div class="card">
    <h3>Indulások</h3>
    <ul id="deps" class="list"></ul>
  </div>

  <div class="card">
    <h3>Viszonylat & élő járművek</h3>
    <div class="row">
      <input id="qroute" placeholder="Pl. 17, U1, 19a…">
      <button onclick="loadVehicles()">Frissítés</button>
    </div>
    <div id="map"></div>
  </div>
</div>

<script>
const API = location.origin; // ugyanarról a domainről szolgáljuk

async function refreshStatus(){
  try{
    const r = await fetch(`${API}/api/status`); const s = await r.json();
    document.getElementById('uk').textContent = `UK: ${s.time}`;
    document.getElementById('gtfs').textContent = s.gtfs_ready ? `GTFS: ${s.gtfs_stops} stops` : `GTFS: not loaded`;
    document.getElementById('live').textContent = s.live_feed_configured ? `Live: configured` : `Live: not configured`;
  }catch(e){}
}
setInterval(refreshStatus, 5000); refreshStatus();

async function searchStops(){
  const q = document.getElementById('qstop').value.trim();
  const ul = document.getElementById('stops'); ul.innerHTML = '';
  if(!q) return;
  let res = await fetch(`${API}/api/stops/search?q=`+encodeURIComponent(q));
  if(!res.ok){ ul.innerHTML = `<li>Hiba: ${res.status}</li>`; return; }
  let arr = await res.json();
  arr.forEach(st => {
    const li = document.createElement('li');
    li.textContent = `${st.name}  (id: ${st.id})`;
    li.style.cursor = 'pointer';
    li.onclick = ()=> loadDepartures(st.id, st.name);
    ul.appendChild(li);
  });
}

async function loadDepartures(stop_id, stop_name){
  const ul = document.getElementById('deps'); ul.innerHTML = `<li>Megálló: ${stop_name} (#${stop_id})</li>`;
  let res = await fetch(`${API}/api/departures?stop_id=${encodeURIComponent(stop_id)}&window=120`);
  if(!res.ok){ ul.innerHTML += `<li>Hiba: ${res.status}</li>`; return; }
  let obj = await res.json();
  if(!obj.departures || obj.departures.length===0){ ul.innerHTML += `<li>Nincs indulás az ablakban.</li>`; return; }
  obj.departures.forEach(d=>{
    const li = document.createElement('li');
    li.innerHTML = `<b>${d.route}</b> → ${d.destination}&nbsp;&nbsp; <span>${d.time_display}</span>`;
    ul.appendChild(li);
  });
}

// ---- Leaflet térkép
const map = L.map('map').setView([50.910, -1.404], 12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom: 19}).addTo(map);
let markers = [];

function clearMarkers(){ markers.forEach(m => m.remove()); markers=[]; }

async function loadVehicles(){
  const route = document.getElementById('qroute').value.trim();
  const url = route ? `${API}/api/vehicles?route=${encodeURIComponent(route)}` : `${API}/api/vehicles`;
  const res = await fetch(url);
  const obj = await res.json();
  clearMarkers();
  if(!obj.items || obj.items.length===0) return;
  obj.items.forEach(v=>{
    const m = L.marker([v.lat, v.lon]).addTo(map);
    m.bindPopup(v.label || 'vehicle');
    markers.push(m);
  });
}
</script>
</body>
</html>
