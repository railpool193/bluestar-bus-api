<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bluestar / Unilink</title>

  <!-- Leaflet + MarkerCluster -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">

  <style>
    :root{
      --bg:#0b1220;
      --panel:#101a2b;
      --panel2:#0f1726;
      --text:#e8eefc;
      --muted:#93a4c7;
      --stroke:rgba(255,255,255,.10);
      --chip:#0c1b2f;
      --blue:#2b6cff;
      --green:#28d17c;
      --shadow:0 10px 30px rgba(0,0,0,.35);
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial}
    .wrap{max-width:980px;margin:0 auto;padding:14px}
    .topbar{
      display:flex;align-items:center;gap:12px;
      background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
      border:1px solid var(--stroke);
      border-radius:18px;
      padding:12px 14px;
      box-shadow:var(--shadow);
    }
    .logo{
      width:42px;height:42px;border-radius:14px;background:rgba(43,108,255,.18);
      display:flex;align-items:center;justify-content:center;border:1px solid rgba(43,108,255,.35);
    }
    .logo svg{width:22px;height:22px}
    .title{display:flex;flex-direction:column;line-height:1.1}
    .title b{font-size:16px}
    .title span{font-size:12px;color:var(--muted)}
    .spacer{flex:1}
    .chip{
      display:inline-flex;align-items:center;gap:8px;
      padding:8px 12px;border-radius:999px;
      background:rgba(12,27,47,.8);
      border:1px solid var(--stroke);
      font-size:12px;color:var(--muted);
      white-space:nowrap;
    }
    .dot{width:10px;height:10px;border-radius:50%;}
    .dot.green{background:var(--green)}
    .dot.gray{background:rgba(255,255,255,.25)}
    .tabs{
      display:flex;gap:10px;margin:12px 0 6px;
    }
    .tab{
      flex:1;
      background:rgba(255,255,255,.03);
      border:1px solid var(--stroke);
      padding:10px 12px;border-radius:999px;
      color:var(--muted);
      text-align:center;
      user-select:none;
    }
    .tab.active{
      background:rgba(43,108,255,.18);
      border-color:rgba(43,108,255,.35);
      color:var(--text);
    }
    .panel{
      background:rgba(255,255,255,.03);
      border:1px solid var(--stroke);
      border-radius:18px;
      overflow:hidden;
      box-shadow:var(--shadow);
    }
    .panel-header{
      display:flex;align-items:center;justify-content:space-between;
      padding:12px 14px;
      border-bottom:1px solid var(--stroke);
      background:rgba(0,0,0,.10);
    }
    .panel-header h2{margin:0;font-size:14px;color:var(--text)}
    .btn{
      background:rgba(255,255,255,.04);
      border:1px solid var(--stroke);
      color:var(--text);
      padding:8px 10px;
      border-radius:12px;
      font-size:12px;
    }
    .btn:active{transform:translateY(1px)}
    .content{padding:12px 14px}
    .search{
      display:flex;gap:10px;align-items:center;
      padding:12px 14px;border-bottom:1px solid var(--stroke);
      background:rgba(16,26,43,.45);
    }
    .search input{
      width:100%;
      background:rgba(255,255,255,.03);
      border:1px solid var(--stroke);
      color:var(--text);
      padding:12px 12px;border-radius:14px;
      outline:none;
      font-size:14px;
    }
    .list{display:flex;flex-direction:column;gap:10px}
    .card{
      background:rgba(0,0,0,.14);
      border:1px solid var(--stroke);
      border-radius:16px;
      padding:12px 12px;
    }
    .row{display:flex;align-items:center;gap:12px}
    .route-badge{
      min-width:46px;height:46px;border-radius:14px;
      background:rgba(43,108,255,.18);
      border:1px solid rgba(43,108,255,.35);
      display:flex;align-items:center;justify-content:center;
      font-weight:800;color:#fff;
    }
    .route-badge.small{min-width:42px;height:42px;border-radius:14px}
    .maincol{flex:1;min-width:0}
    .maincol .name{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .maincol .sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .timecol{text-align:right;min-width:90px}
    .timecol .t{font-weight:800}
    .timecol .m{font-size:12px;color:var(--muted)}
    .timecol.live .t, .timecol.live .m{color:var(--green)}
    .timecol.sched .t{color:var(--text)}
    .favstar{
      width:44px;height:44px;border-radius:14px;
      border:1px solid var(--stroke);
      background:rgba(255,255,255,.03);
      display:flex;align-items:center;justify-content:center;
    }
    .favstar.active{border-color:rgba(255,215,0,.45); background:rgba(255,215,0,.10)}
    .favstar svg{width:18px;height:18px}

    /* Trip view stoplist */
    .stopline{
      display:flex;align-items:center;gap:10px;
      padding:10px 8px;border-bottom:1px solid rgba(255,255,255,.06);
    }
    .stopline:last-child{border-bottom:none}
    .stopline .hh{width:64px;font-weight:800;color:var(--muted)}
    .stopline .sn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .stopline .right{width:64px;text-align:right;font-weight:800;color:var(--muted)}
    .stopline.live .hh, .stopline.live .right{color:var(--green)}
    .blink{
      animation: blink 1s linear infinite;
    }
    @keyframes blink{
      0%,49%{opacity:1}
      50%,100%{opacity:.25}
    }

    /* Map */
    #map{height:520px;width:100%}
    .mapbar{
      display:flex;gap:10px;flex-wrap:wrap;
      padding:10px 14px;border-bottom:1px solid var(--stroke);
      background:rgba(16,26,43,.45);
    }

    /* bustimes-like marker */
    .busMarker{
      position:relative;
      padding:6px 10px;
      border-radius:10px;
      background:rgba(43,108,255,.95);
      color:#fff;
      font-weight:900;
      font-size:14px;
      line-height:1;
      border:1px solid rgba(255,255,255,.20);
      box-shadow:0 10px 22px rgba(0,0,0,.25);
      transform: translate(-50%,-100%);
      white-space:nowrap;
    }
    .busMarker:after{
      content:"";
      position:absolute;
      left:50%;
      bottom:-8px;
      transform:translateX(-50%);
      width:0;height:0;
      border-left:8px solid transparent;
      border-right:8px solid transparent;
      border-top:8px solid rgba(43,108,255,.95);
      filter: drop-shadow(0 4px 4px rgba(0,0,0,.25));
    }

    .hidden{display:none !important}
    .muted{color:var(--muted)}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M6 16V7.5C6 6.12 7.12 5 8.5 5h7C16.88 5 18 6.12 18 7.5V16" stroke="white" stroke-width="2" stroke-linecap="round"/>
          <path d="M6 11h12" stroke="white" stroke-width="2" stroke-linecap="round"/>
          <path d="M8 19a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Zm8 0a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Z" fill="white"/>
        </svg>
      </div>
      <div class="title">
        <b>Bluestar<br>Unilink</b>
      </div>
      <div class="spacer"></div>
      <div class="chip" id="liveChip"><span class="dot gray"></span><span>LIVE: ...</span></div>
      <div class="chip" id="gtfsChip"><span class="dot gray"></span><span>GTFS: ...</span></div>
    </div>

    <div class="tabs">
      <div class="tab active" data-tab="search">Keresés</div>
      <div class="tab" data-tab="fav">Kedvencek</div>
      <div class="tab" data-tab="map">Térkép</div>
    </div>

    <!-- SEARCH -->
    <div class="panel" id="view-search">
      <div class="search">
        <input id="q" placeholder="Megálló vagy járat keresése..." />
      </div>
      <div class="content">
        <div class="list" id="searchResults"></div>
      </div>
    </div>

    <!-- STOP BOARD -->
    <div class="panel hidden" id="view-stop">
      <div class="panel-header">
        <button class="btn" id="backToSearch">←</button>
        <h2 id="stopTitle">Megálló</h2>
        <button class="favstar" id="stopFavBtn" title="Kedvenc">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M12 17.3 6.8 20l1-5.9L3.7 10l6-.9L12 3.8l2.3 5.3 6 .9-4.1 4.1 1 5.9L12 17.3Z" stroke="white" stroke-width="1.7" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
      <div class="content">
        <div class="list" id="depList"></div>
        <div class="muted" id="stopHint" style="margin-top:8px"></div>
      </div>
    </div>

    <!-- TRIP -->
    <div class="panel hidden" id="view-trip">
      <div class="panel-header">
        <button class="btn" id="backToStop">←</button>
        <h2 id="tripTitle">Járat</h2>
        <span class="muted" id="tripDelay"></span>
      </div>
      <div class="content" id="tripStops"></div>
    </div>

    <!-- FAV -->
    <div class="panel hidden" id="view-fav">
      <div class="panel-header">
        <h2>Kedvencek</h2>
        <button class="btn" id="clearFav">Törlés</button>
      </div>
      <div class="content">
        <div class="list" id="favList"></div>
      </div>
    </div>

    <!-- MAP -->
    <div class="panel hidden" id="view-map">
      <div class="panel-header">
        <h2>Térkép</h2>
        <span class="muted">Live vehicles</span>
      </div>
      <div class="mapbar">
        <button class="btn" id="mapFilterBtn">Szűrő: mind</button>
        <button class="btn" id="mapClearBtn">Szűrő törlése</button>
        <button class="btn" id="mapRefreshBtn">Frissítés</button>
      </div>
      <div id="map"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <script>
    // -----------------------
    // Helpers
    // -----------------------
    const $ = (q)=>document.querySelector(q);
    const $$ = (q)=>Array.from(document.querySelectorAll(q));

    async function jget(url){
      const r = await fetch(url, {cache:"no-store"});
      if(!r.ok) throw new Error(await r.text());
      return r.json();
    }

    function hhmm(iso){
      if(!iso) return "";
      const d = new Date(iso);
      return d.toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
    }

    function signDelay(min){
      if(min === null || min === undefined) return "";
      if(min === 0) return "0";
      return (min>0? `+${min}` : `${min}`);
    }

    // -----------------------
    // State
    // -----------------------
    let currentStopId = null;
    let currentTripId = null;
    let currentVehicleRef = null;

    let map = null;
    let markerLayer = null;
    let mapFilterLine = null;

    // -----------------------
    // Favorites (localStorage)
    // -----------------------
    const FKEY = "bsu_favs_v1";
    function loadFav(){
      try{ return JSON.parse(localStorage.getItem(FKEY)||"[]"); }catch(e){ return []; }
    }
    function saveFav(list){
      localStorage.setItem(FKEY, JSON.stringify(list));
    }
    function isFav(type,id){
      return loadFav().some(x=>x.type===type && x.id===id);
    }
    function toggleFav(item){
      const list = loadFav();
      const i = list.findIndex(x=>x.type===item.type && x.id===item.id);
      if(i>=0) list.splice(i,1); else list.unshift(item);
      saveFav(list);
    }

    // -----------------------
    // Tabs / Views
    // -----------------------
    function showTab(name){
      $$(".tab").forEach(t=>t.classList.toggle("active", t.dataset.tab===name));
      $("#view-search").classList.toggle("hidden", name!=="search");
      $("#view-stop").classList.add("hidden");
      $("#view-trip").classList.add("hidden");
      $("#view-fav").classList.toggle("hidden", name!=="fav");
      $("#view-map").classList.toggle("hidden", name!=="map");
      if(name==="fav") renderFav();
      if(name==="map") initMapIfNeeded();
    }

    $$(".tab").forEach(t=>{
      t.addEventListener("click", ()=> showTab(t.dataset.tab));
    });

    // -----------------------
    // Status chips
    // -----------------------
    async function refreshStatus(){
      try{
        const s = await jget("/api/status");
        const liveOk = s.live.ok;
        const liveN = s.live.activeCount;
        const gtfsOk = s.gtfs.ok;

        $("#liveChip").innerHTML = `<span class="dot ${liveOk?'green':'gray'}"></span><span>LIVE: ${liveOk?'ON':'OFF'} (${liveN})</span>`;
        $("#gtfsChip").innerHTML = `<span class="dot ${gtfsOk?'green':'gray'}"></span><span>GTFS: ${gtfsOk?'OK':'ERR'}</span>`;
      }catch(e){
        $("#liveChip").innerHTML = `<span class="dot gray"></span><span>LIVE: ERR</span>`;
        $("#gtfsChip").innerHTML = `<span class="dot gray"></span><span>GTFS: ERR</span>`;
      }
    }

    // -----------------------
    // Search
    // -----------------------
    let searchTimer = null;
    $("#q").addEventListener("input", ()=>{
      clearTimeout(searchTimer);
      searchTimer = setTimeout(doSearch, 250);
    });

    async function doSearch(){
      const q = ($("#q").value||"").trim();
      if(q.length<1){
        $("#searchResults").innerHTML = `<div class="muted">Írj be megállót vagy járatot…</div>`;
        return;
      }
      const data = await jget(`/api/search?q=${encodeURIComponent(q)}`);
      const blocks = [];

      if(data.stops?.length){
        blocks.push(`<div class="muted">Megállók</div>`);
        data.stops.forEach(s=>{
          blocks.push(`
            <div class="card" data-stop="${s.stop_id}">
              <div class="row">
                <div class="route-badge small">🚌</div>
                <div class="maincol">
                  <div class="name">${s.stop_name}</div>
                  <div class="sub">${s.stop_id}</div>
                </div>
                <div class="muted">→</div>
              </div>
            </div>
          `);
        });
      }

      if(data.routes?.length){
        blocks.push(`<div class="muted" style="margin-top:8px">Járatok</div>`);
        data.routes.forEach(r=>{
          const line = (r.short_name || r.long_name || "").trim();
          blocks.push(`
            <div class="card" data-route="${line}">
              <div class="row">
                <div class="route-badge small">${line || "?"}</div>
                <div class="maincol">
                  <div class="name">${line}</div>
                  <div class="sub">${(r.long_name||"").trim()}</div>
                </div>
                <div class="muted">→</div>
              </div>
            </div>
          `);
        });
      }

      $("#searchResults").innerHTML = blocks.join("") || `<div class="muted">Nincs találat.</div>`;

      $$("#searchResults .card[data-stop]").forEach(el=>{
        el.addEventListener("click", ()=> openStop(el.dataset.stop));
      });

      $$("#searchResults .card[data-route]").forEach(el=>{
        el.addEventListener("click", ()=>{
          // route -> map filter
          mapFilterLine = el.dataset.route;
          showTab("map");
          setTimeout(()=> refreshMap(), 250);
          $("#mapFilterBtn").textContent = `Szűrő: ${mapFilterLine}`;
        });
      });
    }

    // -----------------------
    // Stop board
    // -----------------------
    $("#backToSearch").addEventListener("click", ()=> showTab("search"));
    $("#backToStop").addEventListener("click", ()=> openStop(currentStopId));

    $("#stopFavBtn").addEventListener("click", ()=>{
      if(!currentStopId) return;
      toggleFav({type:"stop", id: currentStopId, name: $("#stopTitle").textContent});
      renderStopFav();
      renderFav();
    });

    function renderStopFav(){
      const on = isFav("stop", currentStopId);
      $("#stopFavBtn").classList.toggle("active", on);
    }

    async function openStop(stopId){
      currentStopId = stopId;
      $("#view-search").classList.add("hidden");
      $("#view-fav").classList.add("hidden");
      $("#view-map").classList.add("hidden");
      $("#view-trip").classList.add("hidden");
      $("#view-stop").classList.remove("hidden");
      $$(".tab").forEach(t=>t.classList.toggle("active", t.dataset.tab==="search"));

      renderStopFav();

      $("#depList").innerHTML = `<div class="muted">Betöltés…</div>`;
      $("#stopHint").textContent = "";

      const board = await jget(`/api/stop/${encodeURIComponent(stopId)}/departures`);
      $("#stopTitle").textContent = board.stop.stop_name || stopId;

      const nowIso = board.now;
      const deps = board.departures || [];

      const items = deps.map(d=>{
        const isLive = !!d.isLive;
        const tIso = d.expectedTime || d.scheduledTime;
        const t = hhmm(tIso);
        const mins = (d.inMin!=null) ? `${d.inMin} min` : "";
        const line = d.line || "?";
        const dest = d.destination || "";
        const timeClass = isLive ? "live" : "sched";
        const small = isLive ? `<div class="m">${mins}</div>` : `<div class="m">${mins}</div>`;

        return `
          <div class="card dep" data-trip="${d.trip_id||""}" data-veh="${d.vehicleRef||""}">
            <div class="row">
              <div class="route-badge">${line}</div>
              <div class="maincol">
                <div class="name">${dest || "—"}</div>
                <div class="sub">platform: ${stopId}</div>
              </div>
              <div class="timecol ${timeClass}">
                <div class="t">${t}</div>
                ${small}
              </div>
            </div>
          </div>
        `;
      });

      $("#depList").innerHTML = items.join("") || `<div class="muted">Nincs indulás a következő időablakban.</div>`;

      // click -> trip view (ha van trip_id)
      $$("#depList .dep").forEach(el=>{
        el.addEventListener("click", ()=>{
          const tripId = el.dataset.trip;
          const veh = el.dataset.veh || null;
          if(!tripId){
            // ha nincs GTFS trip match, akkor maradj stopboardon
            return;
          }
          openTrip(tripId, veh);
        });
      });

      $("#stopHint").textContent = "Fehér: menetrend (GTFS) • Zöld: élő (LIVE)";
    }

    // -----------------------
    // Trip view (GTFS + LIVE overlay)
    // -----------------------
    async function openTrip(tripId, vehicleRef){
      currentTripId = tripId;
      currentVehicleRef = vehicleRef || null;

      $("#view-stop").classList.add("hidden");
      $("#view-trip").classList.remove("hidden");
      $("#tripStops").innerHTML = `<div class="muted">Betöltés…</div>`;
      $("#tripDelay").textContent = "";

      const trip = await jget(`/api/trip/${encodeURIComponent(tripId)}`);
      $("#tripTitle").textContent = `${trip.line || ""} ${trip.destination || ""}`.trim();

      let live = null;
      if(currentVehicleRef){
        try{
          live = await jget(`/api/vehicle/${encodeURIComponent(currentVehicleRef)}`);
        }catch(e){
          live = null;
        }
      }

      const calls = live?.calls || {};
      const currentStopRef = live?.currentStopRef || null;
      const atStop = !!live?.vehicleAtStop;

      // compute delay estimate at first stop we have both sched + live
      let delayMin = null;

      const lines = (trip.stops||[]).map(st=>{
        const schedIso = st.scheduledTime;
        const liveIso = calls[st.stop_id] || null;

        let cls = "stopline";
        let right = "";
        let hh = hhmm(schedIso);

        if(liveIso){
          cls += " live";
          const dSched = new Date(schedIso);
          const dLive = new Date(liveIso);
          const dm = Math.round((dLive - dSched)/60000);
          right = signDelay(dm) + "'";
          hh = hhmm(liveIso); // LIVE time shown
          if(delayMin===null) delayMin = dm;
        }

        const blink = (atStop && currentStopRef && currentStopRef === st.stop_id) ? " blink" : "";

        return `
          <div class="${cls}">
            <div class="hh">${hh}</div>
            <div class="sn${blink}">${st.stop_name}</div>
            <div class="right">${right}</div>
          </div>
        `;
      });

      $("#tripStops").innerHTML = `<div class="card">${lines.join("")}</div>`;
      if(delayMin!==null){
        $("#tripDelay").textContent = `(${delayMin>0?'+':''}${delayMin} min)`;
      }else{
        $("#tripDelay").textContent = "";
      }
    }

    // -----------------------
    // Favorites view
    // -----------------------
    $("#clearFav").addEventListener("click", ()=>{
      saveFav([]);
      renderFav();
    });

    function renderFav(){
      const list = loadFav();
      if(!list.length){
        $("#favList").innerHTML = `<div class="muted">Nincsenek kedvencek</div>`;
        return;
      }
      $("#favList").innerHTML = list.map(f=>{
        const badge = f.type==="stop" ? "🚌" : (f.id || "?");
        return `
          <div class="card fav" data-type="${f.type}" data-id="${f.id}">
            <div class="row">
              <div class="route-badge small">${badge}</div>
              <div class="maincol">
                <div class="name">${f.name || f.id}</div>
                <div class="sub">${f.type==="stop" ? f.id : "járat"}</div>
              </div>
              <div class="muted">→</div>
            </div>
          </div>
        `;
      }).join("");

      $$("#favList .fav").forEach(el=>{
        el.addEventListener("click", ()=>{
          const type = el.dataset.type;
          const id = el.dataset.id;
          if(type==="stop") openStop(id);
          if(type==="route"){
            mapFilterLine = id;
            showTab("map");
            setTimeout(()=> refreshMap(), 250);
            $("#mapFilterBtn").textContent = `Szűrő: ${mapFilterLine}`;
          }
        });
      });
    }

    // -----------------------
    // Map
    // -----------------------
    function initMapIfNeeded(){
      if(map) return;

      map = L.map('map', { zoomControl: true });
      map.setView([50.91, -1.404], 11); // Southampton default

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap'
      }).addTo(map);

      markerLayer = L.markerClusterGroup({
        showCoverageOnHover: false,
        spiderfyOnMaxZoom: true,
        disableClusteringAtZoom: 15
      });
      map.addLayer(markerLayer);

      refreshMap();
    }

    function busIcon(line){
      return L.divIcon({
        className: '',
        html: `<div class="busMarker">${line || "?"}</div>`,
        iconSize: [1, 1],
        iconAnchor: [0, 0]
      });
    }

    async function refreshMap(){
      if(!map || !markerLayer) return;

      try{
        const url = mapFilterLine
          ? `/api/vehicles?line=${encodeURIComponent(mapFilterLine)}`
          : `/api/vehicles`;

        const data = await jget(url);
        const vehicles = data.vehicles || [];

        markerLayer.clearLayers();

        vehicles.forEach(v=>{
          if(v.latitude==null || v.longitude==null) return;
          const line = (v.publishedLineName || v.lineRef || "").trim();
          const dest = (v.destinationName || "").trim();
          const origin = (v.originName || "").trim();
          const age = v.ageSeconds!=null ? `${v.ageSeconds}s` : "—";

          const m = L.marker([v.latitude, v.longitude], { icon: busIcon(line) });
          const popup = `
            <div style="font-family:system-ui;min-width:220px">
              <div style="font-weight:800">${line || "?"}</div>
              <div style="color:#666">to ${dest || "—"}</div>
              <div style="font-size:12px;color:#666;margin-top:6px">
                veh: ${v.vehicleRef || "—"} • age: ${age}
              </div>
              ${v.currentStopRef ? `<div style="font-size:12px;color:#666">stop: ${v.currentStopRef}${v.vehicleAtStop ? " (AT STOP)" : ""}</div>` : ""}
            </div>
          `;
          m.bindPopup(popup);
          markerLayer.addLayer(m);
        });

        await refreshStatus();
      }catch(e){
        // ignore
      }
    }

    $("#mapRefreshBtn").addEventListener("click", refreshMap);
    $("#mapClearBtn").addEventListener("click", ()=>{
      mapFilterLine = null;
      $("#mapFilterBtn").textContent = "Szűrő: mind";
      refreshMap();
    });
    $("#mapFilterBtn").addEventListener("click", ()=>{
      // quick cycle: mind -> kérdezzen route-ot
      const x = prompt("Add meg a járatszámot (pl. 1, 2, U1A). Üres = mind:");
      if(x === null) return;
      const v = (x||"").trim();
      mapFilterLine = v ? v : null;
      $("#mapFilterBtn").textContent = mapFilterLine ? `Szűrő: ${mapFilterLine}` : "Szűrő: mind";
      refreshMap();
    });

    // -----------------------
    // Init
    // -----------------------
    (async function boot(){
      await refreshStatus();
      $("#searchResults").innerHTML = `<div class="muted">Írj be megállót vagy járatot…</div>`;
      renderFav();
      // periodic live refresh for chips
      setInterval(refreshStatus, 15000);
    })();
  </script>
</body>
</html>
