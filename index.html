<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Megálló kereső & indulások</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    :root{
      --bg:#070b13;
      --card:#0b1220;
      --card2:#0a0f1b;
      --text:#e7edf8;
      --muted:#9fb0ca;
      --line:#182338;
      --accent:#76a7ff;
      --danger:#ff6b6b;
      --ok:#7CFFB2;
    }
    html,body{height:100%}
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(1200px 600px at 40% -10%, #17325a 0%, var(--bg) 60%);
      color: var(--text);
    }
    .wrap{max-width: 760px; margin:0 auto; padding:18px 14px 60px;}
    h1{font-size:28px; margin:10px 0 6px;}
    .sub{color:var(--muted); margin:0 0 14px; line-height:1.3;}
    .card{
      background: rgba(11,18,32,0.92);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 18px;
      padding:14px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.35);
      backdrop-filter: blur(10px);
    }
    .row{display:flex; gap:10px; align-items:center;}
    .grow{flex:1}
    input{
      width:100%;
      padding:14px 14px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(8,12,20,0.6);
      color: var(--text);
      outline:none;
      font-size:16px;
    }
    button{
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.10);
      background: rgba(18,28,44,0.85);
      color: var(--text);
      cursor:pointer;
      font-weight:600;
    }
    button:hover{filter:brightness(1.08)}
    .pill{
      display:inline-flex; align-items:center; gap:8px;
      padding:10px 12px; border-radius: 999px;
      border:1px solid rgba(255,255,255,0.08);
      background: rgba(8,12,20,0.45);
      color: var(--text);
      font-weight:600;
      white-space:nowrap;
    }
    .mt12{margin-top:12px}
    .mt16{margin-top:16px}
    .title{font-size:18px; font-weight:800; margin-bottom:2px;}
    .muted{color:var(--muted)}
    .table{
      width:100%;
      border-collapse: collapse;
      margin-top: 12px;
      font-variant-numeric: tabular-nums;
    }
    .table th, .table td{
      padding: 12px 10px;
      border-top: 1px solid rgba(255,255,255,0.06);
      text-align:left;
    }
    .table th{color:var(--muted); font-size:12px; letter-spacing:0.06em;}
    .badge{
      display:inline-flex; align-items:center; justify-content:center;
      min-width:44px;
      padding: 8px 10px;
      border-radius: 999px;
      border:1px solid rgba(255,255,255,0.10);
      background: rgba(10,15,27,0.6);
      font-weight:800;
    }
    .due{color:var(--ok); font-weight:900}
    .neg{color:#ffd27c; font-weight:900}

    #map, #tripMap{
      height: 290px;
      border-radius: 18px;
      overflow:hidden;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .error{
      margin-top:10px;
      color: var(--danger);
      font-weight:800;
      background: rgba(255,107,107,0.10);
      border: 1px solid rgba(255,107,107,0.25);
      padding: 10px 12px;
      border-radius: 14px;
    }

    /* Trip modal */
    .modal{
      position: fixed;
      inset: 0;
      display:none;
      background: rgba(0,0,0,0.55);
      z-index: 9999;
    }
    .modal.open{display:block;}
    .modalInner{
      position: absolute;
      inset: 10px;
      max-width: 820px;
      margin: 0 auto;
      background: rgba(9,13,20,0.96); /* FIX: kevésbé átlátszó */
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 22px;
      overflow:hidden;
      box-shadow: 0 30px 80px rgba(0,0,0,0.55);
    }
    .modalHeader{
      padding: 14px 14px 10px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      display:flex;
      gap:10px;
      align-items:center;
      justify-content:space-between;
      background: rgba(12,18,30,0.90);
    }
    .modalTitle{
      font-size:22px;
      font-weight:900;
      line-height:1.2;
    }
    .modalSub{color:var(--muted); font-size:13px; margin-top:2px;}
    .modalBody{
      height: calc(100vh - 140px);
      overflow:auto; /* görgethető */
      padding: 14px;
    }
    .tabs{
      display:flex; gap:10px;
      margin-top:12px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      padding-bottom:10px;
    }
    .tab{
      opacity:0.9;
      padding:10px 12px;
      border-radius: 14px;
      border:1px solid rgba(255,255,255,0.08);
      background: rgba(8,12,20,0.55);
      cursor:pointer;
      font-weight:800;
      user-select:none;
    }
    .tab.active{
      outline: 2px solid rgba(118,167,255,0.40);
      opacity: 1;
    }
    .hint{color:var(--muted); margin-top:10px; line-height:1.35;}
  </style>
</head>

<body>
  <div class="wrap">
    <h1>Megálló kereső & indulások</h1>
    <p class="sub">Keresd meg a megállót → nézd a következő ~30–120 perc indulásait → opcionális élő jármű térkép</p>

    <div class="card">
      <div class="row">
        <div class="grow">
          <input id="q" placeholder="Pl. Vincent / Hanover / 1980SN..." />
        </div>
        <button id="searchBtn">Közeliek</button>
      </div>

      <div id="results" class="mt12"></div>
    </div>

    <div id="stopCard" class="card mt16" style="display:none;"></div>
  </div>

  <!-- Trip modal -->
  <div id="tripModal" class="modal" aria-hidden="true">
    <div class="modalInner">
      <div class="modalHeader">
        <div>
          <div id="tripTitle" class="modalTitle">Trip</div>
          <div id="tripSub" class="modalSub"></div>
        </div>
        <button id="tripClose">Vissza</button>
      </div>
      <div class="modalBody">
        <div id="tripMap" class="mt12"></div>

        <div class="tabs">
          <div class="tab active" data-tab="timetable">MENETREND</div>
          <div class="tab" data-tab="stops">MEGÁLLÓ</div>
          <div class="tab" data-tab="live">LIVE</div>
        </div>

        <div id="tripContent" class="mt12"></div>
        <div class="hint">Tipp: ha nincs LIVE adat, nézd meg a STOP oldalon a „LIVE feed” hibát – ott kiírja a backend részletes okát.</div>
      </div>
    </div>
  </div>

<script>
  const API = ""; // same origin
  let selectedStop = null;
  let map = null;
  let tripMap = null;
  let liveMarkersLayer = null;
  let tripRouteLayer = null;
  let tripVehicleMarker = null;

  const el = (id) => document.getElementById(id);

  function fmtMinutes(mins){
    if (mins === null || mins === undefined) return "—";
    if (mins === 0) return "<span class='due'>Due</span>";
    if (mins < 0) return `<span class='neg'>${mins} min</span>`;
    return `${mins} min`;
  }

  async function apiGet(url){
    const res = await fetch(url, { cache: "no-store" });
    let data = null;
    try{ data = await res.json(); } catch(e){ data = null; }
    // NE dobjuk el csak azért, mert nem 200
    return { ok: res.ok, status: res.status, data };
  }

  async function searchStops(q){
    const {ok, status, data} = await apiGet(`/api/stop_search?q=${encodeURIComponent(q)}&limit=10`);
    if(!data) return [];
    return data.stops || [];
  }

  function renderResults(stops){
    const box = el("results");
    if(!stops.length){
      box.innerHTML = `<div class="muted">Nincs találat.</div>`;
      return;
    }
    box.innerHTML = stops.map(s => `
      <div class="card mt12" style="padding:12px;">
        <div class="title">${escapeHtml(s.stop_name)}</div>
        <div class="muted">stop_id: ${escapeHtml(s.stop_id)}</div>
        <div class="mt12"><button data-stop="${escapeHtml(s.stop_id)}">Megnyit</button></div>
      </div>
    `).join("");

    box.querySelectorAll("button[data-stop]").forEach(btn=>{
      btn.addEventListener("click", ()=> openStop(btn.getAttribute("data-stop")));
    });
  }

  async function openStop(stop_id){
    const {ok, data} = await apiGet(`/api/stop/${encodeURIComponent(stop_id)}/departures?minutes=120`);
    if(!data || !data.stop){
      alert("Nem sikerült lekérni a megállót.");
      return;
    }
    selectedStop = data.stop;
    renderStopCard(data);
  }

  function ensureMap(lat, lon){
    if(!map){
      map = L.map("map", { zoomControl: true });
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19 }).addTo(map);
      liveMarkersLayer = L.layerGroup().addTo(map);
    }
    map.setView([lat, lon], 14);
  }

  function renderStopCard(payload){
    const box = el("stopCard");
    box.style.display = "block";

    const stop = payload.stop;
    const deps = payload.departures || [];
    const nowIso = payload.now;

    box.innerHTML = `
      <div class="title">${escapeHtml(stop.stop_name)}</div>
      <div class="muted">stop_id: ${escapeHtml(stop.stop_id)}</div>

      <div class="row mt12" style="flex-wrap:wrap;">
        <div class="pill">🕒 ${new Date(nowIso).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</div>
        <div class="pill">🚌 ${deps.length} indulás</div>
        <div class="pill">🗺️ <button id="toggleMap" style="padding:8px 10px;">Térkép</button></div>
      </div>

      <table class="table">
        <thead>
          <tr>
            <th>IDŐ</th>
            <th>VONAL</th>
            <th>IRÁNY</th>
            <th>PERC</th>
          </tr>
        </thead>
        <tbody>
          ${deps.map(d => `
            <tr class="depRow" data-trip="${escapeHtml(d.trip_id)}" data-date="${escapeHtml(d.service_date)}">
              <td>${escapeHtml(d.time)}</td>
              <td><span class="badge">${escapeHtml(d.line || "—")}</span></td>
              <td>${escapeHtml(d.headsign || "—")}</td>
              <td>${fmtMinutes(d.minutes)}</td>
            </tr>
          `).join("")}
        </tbody>
      </table>

      <div class="row mt12" style="flex-wrap:wrap;">
        <div class="pill">🚍 Élő járművek (ha elérhető)</div>
        <div class="grow"><input id="lineFilter" placeholder="Szűrés vonalra (pl. 1, U1...)" /></div>
        <button id="liveRefresh">Frissítés</button>
      </div>

      <div id="liveError"></div>
      <div id="mapWrap" class="mt12" style="display:none;">
        <div id="map"></div>
      </div>

      <div class="hint">Tipp: a térképes élő adat a SIRI VehicleMonitoring feedből jön. Ha nincs marker, a feed lehet üres / API-key gond / rossz URL.</div>
    `;

    // departure click -> trip modal
    box.querySelectorAll(".depRow").forEach(r=>{
      r.addEventListener("click", ()=> {
        const trip_id = r.getAttribute("data-trip");
        const service_date = r.getAttribute("data-date");
        openTrip(trip_id, service_date);
      });
    });

    el("toggleMap").addEventListener("click", ()=>{
      const mapWrap = el("mapWrap");
      const on = mapWrap.style.display !== "none";
      mapWrap.style.display = on ? "none" : "block";
      if(!on && stop.lat && stop.lon){
        ensureMap(stop.lat, stop.lon);
        // pin stop
        liveMarkersLayer.clearLayers();
        L.marker([stop.lat, stop.lon]).addTo(liveMarkersLayer).bindPopup(stop.stop_name).openPopup();
      }
    });

    el("liveRefresh").addEventListener("click", refreshLiveVehicles);
  }

  async function refreshLiveVehicles(){
    const errBox = el("liveError");
    errBox.innerHTML = "";
    const mapWrap = el("mapWrap");
    mapWrap.style.display = "block";

    if(selectedStop?.lat && selectedStop?.lon){
      ensureMap(selectedStop.lat, selectedStop.lon);
    }

    const line = (el("lineFilter")?.value || "").trim();
    const url = line ? `/api/vehicles?max_results=60&line=${encodeURIComponent(line)}` : `/api/vehicles?max_results=60`;
    const {ok, status, data} = await apiGet(url);

    if(!data){
      errBox.innerHTML = `<div class="error">LIVE feed hiba: nem kaptam JSON választ (HTTP ${status}).</div>`;
      return;
    }

    if(data.error){
      errBox.innerHTML = `<div class="error">LIVE feed hiba: ${escapeHtml(data.error)}<br><span class="muted">${escapeHtml(data.error_detail || "")}</span></div>`;
    }

    const vehicles = data.vehicles || [];
    if(!map || !liveMarkersLayer) return;

    // keep stop marker too
    liveMarkersLayer.clearLayers();
    if(selectedStop?.lat && selectedStop?.lon){
      L.marker([selectedStop.lat, selectedStop.lon]).addTo(liveMarkersLayer).bindPopup(selectedStop.stop_name);
    }

    vehicles.forEach(v=>{
      if(v.lat == null || v.lon == null) return;
      const title = `🚌 ${v.line || "—"} → ${v.destination || "—"}<br>Fleet: ${v.vehicle_id || "—"}<br>${v.recorded_at || ""}`;
      L.circleMarker([v.lat, v.lon], { radius: 7 }).addTo(liveMarkersLayer).bindPopup(title);
    });
  }

  async function openTrip(trip_id, service_date){
    const modal = el("tripModal");
    modal.classList.add("open");

    el("tripTitle").textContent = "Betöltés…";
    el("tripSub").textContent = `trip_id: ${trip_id} · service_date: ${service_date}`;
    el("tripContent").innerHTML = "";

    // load trip
    const {data} = await apiGet(`/api/trip/${encodeURIComponent(trip_id)}?service_date=${encodeURIComponent(service_date)}`);
    if(!data || !data.trip){
      el("tripTitle").textContent = "Trip hiba";
      el("tripContent").innerHTML = `<div class="error">Nem tudtam lekérni a tripet.</div>`;
      return;
    }

    el("tripTitle").textContent = `${data.trip.line || "—"} → ${data.trip.headsign || "—"}`;
    el("tripSub").textContent = `trip_id: ${data.trip.trip_id} · service_date: ${data.trip.service_date}`;

    // map init
    if(!tripMap){
      tripMap = L.map("tripMap", { zoomControl: true });
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19 }).addTo(tripMap);
    }
    if(tripRouteLayer){
      tripRouteLayer.remove();
      tripRouteLayer = null;
    }
    if(tripVehicleMarker){
      tripVehicleMarker.remove();
      tripVehicleMarker = null;
    }

    const shape = data.shape || [];
    if(shape.length){
      tripRouteLayer = L.polyline(shape, { weight: 5 }).addTo(tripMap);
      tripMap.fitBounds(tripRouteLayer.getBounds().pad(0.15));
    }else{
      // fallback
      tripMap.setView([50.91, -1.40], 12);
    }

    // live match marker
    const match = data.live?.match || null;
    const liveBox = buildLiveBox(data.live);
    const stopsTable = buildStopsTable(data.stops || []);

    // default tab content
    el("tripContent").innerHTML = stopsTable;

    if(match && match.lat != null && match.lon != null){
      tripVehicleMarker = L.marker([match.lat, match.lon]).addTo(tripMap)
        .bindPopup(`Fleet: ${match.vehicle_id || "—"}<br>Score: ${match.score || "—"}`)
        .openPopup();
    }

    // tabs
    document.querySelectorAll(".tab").forEach(t=>{
      t.addEventListener("click", ()=>{
        document.querySelectorAll(".tab").forEach(x=> x.classList.remove("active"));
        t.classList.add("active");
        const k = t.getAttribute("data-tab");
        if(k === "timetable" || k === "stops"){
          el("tripContent").innerHTML = stopsTable;
        }else{
          el("tripContent").innerHTML = liveBox;
        }
      });
    });
  }

  function buildStopsTable(stops){
    return `
      <table class="table">
        <thead>
          <tr><th>IDŐ</th><th>MEGÁLLÓ</th><th>LIVE</th></tr>
        </thead>
        <tbody>
          ${(stops || []).map(s => `
            <tr>
              <td>${escapeHtml(s.time || "—")}</td>
              <td>${escapeHtml(s.stop_name || s.stop_id || "—")}<div class="muted">${escapeHtml(s.stop_id || "")}</div></td>
              <td class="muted">—</td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    `;
  }

  function buildLiveBox(live){
    if(!live) return `<div class="muted">Nincs live adat.</div>`;
    if(live.error){
      return `<div class="error">
        LIVE backend hiba: ${escapeHtml(live.error)}<br>
        <span class="muted">${escapeHtml(live.error_detail || "")}</span>
      </div>`;
    }
    const m = live.match;
    if(!m) return `<div class="muted">Nincs találat (jármű) ehhez a triphez.</div>`;
    return `
      <div class="card" style="padding:12px;">
        <div class="title">Talált jármű</div>
        <div class="muted">Fleet: ${escapeHtml(m.vehicle_id || "—")} · Score: ${escapeHtml(String(m.score || "—"))}</div>
        <div class="mt12">
          <div class="pill">🚌 ${escapeHtml(m.line || "—")} → ${escapeHtml(m.destination || "—")}</div>
          <div class="pill">🕒 ${escapeHtml(m.recorded_at || "—")}</div>
        </div>
      </div>
    `;
  }

  function closeTrip(){
    el("tripModal").classList.remove("open");
  }

  el("tripClose").addEventListener("click", closeTrip);
  el("tripModal").addEventListener("click", (e)=>{
    if(e.target === el("tripModal")) closeTrip();
  });

  // Search btn
  el("searchBtn").addEventListener("click", async ()=>{
    const q = el("q").value.trim();
    if(!q){ return; }
    const stops = await searchStops(q);
    renderResults(stops);
  });

  // Enter
  el("q").addEventListener("keydown", async (e)=>{
    if(e.key === "Enter"){
      const q = el("q").value.trim();
      if(!q) return;
      const stops = await searchStops(q);
      renderResults(stops);
    }
  });

  function escapeHtml(s){
    return String(s ?? "").replace(/[&<>"']/g, (c)=>({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
    }[c]));
  }
</script>

</body>
</html>
