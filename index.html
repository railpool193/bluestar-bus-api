<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bluestar & Unilink – Live + GTFS</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root{
      --bg:#0f1115; --panel:#171a21; --text:#e9eef7; --muted:#a9b2c3; --border:#2a3142;
      --shadow: 0 10px 30px rgba(0,0,0,.35); --radius:16px;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);}
    .topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px;background:linear-gradient(180deg,#1a1d26,#141724);border-bottom:1px solid var(--border);}
    .brand{display:flex;gap:10px;align-items:center;font-weight:800;}
    .pill{padding:6px 10px;border:1px solid var(--border);border-radius:999px;color:var(--muted);font-size:12px;max-width:60vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .tabs{display:flex;gap:8px;align-items:center;}
    .tabbtn{border:1px solid var(--border);background:rgba(255,255,255,.02);color:var(--text);padding:10px 12px;border-radius:999px;font-weight:700;cursor:pointer;}
    .tabbtn.active{background:rgba(255,255,255,.06);}
    .wrap{padding:14px;max-width:980px;margin:0 auto;}
    .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}
    .row{display:flex;gap:12px;align-items:center;padding:12px;border-top:1px solid rgba(255,255,255,.04);}
    .row:first-child{border-top:0}
    .grow{flex:1}
    .small{color:var(--muted);font-size:12px}
    .h2{font-size:14px;font-weight:800;margin:0}
    .mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
    .searchbox{display:flex;gap:10px;align-items:center;padding:12px;border-radius:var(--radius);border:1px solid var(--border);background:rgba(255,255,255,.03);}
    .searchbox input{width:100%;border:0;outline:none;background:transparent;color:var(--text);font-size:16px;}
    .iconbtn{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;border:1px solid var(--border);background:rgba(255,255,255,.02);cursor:pointer;color:var(--text);}
    .iconbtn:hover{background:rgba(255,255,255,.05)}
    .badge-route{min-width:44px;height:34px;padding:0 10px;display:flex;align-items:center;justify-content:center;background:rgba(30,136,229,.22);border:1px solid rgba(30,136,229,.45);color:#e8f3ff;border-radius:10px;font-weight:900;}
    .star{color:rgba(255,255,255,.35);font-size:18px;user-select:none;}
    .star.on{color:#ffd54f;}
    .sectionTitle{margin:14px 2px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
    .scrollBox{max-height:62vh;overflow:auto;}
    #map{height:calc(100vh - 120px);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden;}
    .hidden{display:none !important;}
    .hint{color:var(--muted);font-size:13px;margin:10px 2px 0;}
  </style>
</head>

<body>
  <div class="topbar">
    <div class="brand">
      <span style="font-size:18px">🚌</span>
      <span>Bluestar & Unilink</span>
      <span id="livePill" class="pill">LIVE: …</span>
    </div>
    <div class="tabs">
      <button class="tabbtn active" id="tabSearch">Keresés</button>
      <button class="tabbtn" id="tabFav">Kedvencek</button>
      <button class="tabbtn" id="tabMap">Térkép</button>
    </div>
  </div>

  <div class="wrap">
    <div id="viewSearch">
      <div class="searchbox">
        <span>🔎</span>
        <input id="q" placeholder="Megálló vagy járat keresése (pl. Hanover, Winchester, 1, U1...)" />
        <button class="iconbtn" id="clearBtn" title="Törlés">✕</button>
      </div>

      <div class="sectionTitle">
        <div class="h2">Találatok</div>
        <div class="small">Megállók + járatok</div>
      </div>

      <div class="card" id="resultsCard">
        <div class="row"><div class="small">Kezdj el gépelni…</div></div>
      </div>

      <div class="hint">Ha a menetrend üres: nézd meg a /api/debug/gtfs endpointot (calendar end_max).</div>
    </div>

    <div id="viewFav" class="hidden">
      <div class="sectionTitle"><div class="h2">Kedvencek</div></div>
      <div class="card" id="favCard">
        <div class="row"><div class="small">Nincs még kedvenced.</div></div>
      </div>
    </div>

    <div id="viewStop" class="hidden">
      <div class="sectionTitle">
        <div>
          <div class="h2" id="stopName">Stop</div>
          <div class="small mono" id="stopId"></div>
        </div>
        <div style="display:flex; gap:8px;">
          <button class="iconbtn" id="stopBack" title="Vissza">←</button>
        </div>
      </div>

      <div class="card" id="departuresCard">
        <div class="row"><div class="small">Betöltés…</div></div>
      </div>
      <div class="hint" id="stopHint"></div>
    </div>

    <div id="viewMap" class="hidden">
      <div class="card" id="map"></div>
      <div class="hint">Ha üres a térkép: /api/debug/live megmondja mi a baj (kulcs/HTTP/XML).</div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const $ = (id) => document.getElementById(id);

    async function api(path){
      const r = await fetch(path, {cache:"no-store"});
      if(!r.ok) throw new Error(await r.text());
      return await r.json();
    }

    const views = ["viewSearch","viewFav","viewStop","viewMap"];
    function show(viewId){
      views.forEach(v => $(v).classList.toggle("hidden", v !== viewId));
      $("tabSearch").classList.toggle("active", viewId==="viewSearch");
      $("tabFav").classList.toggle("active", viewId==="viewFav");
      $("tabMap").classList.toggle("active", viewId==="viewMap");
    }

    $("tabSearch").onclick = () => show("viewSearch");
    $("tabFav").onclick = () => show("viewFav");
    $("tabMap").onclick = () => show("viewMap");

    $("clearBtn").onclick = () => { $("q").value=""; $("resultsCard").innerHTML=`<div class="row"><div class="small">Kezdj el gépelni…</div></div>`; };

    let t = null;
    $("q").addEventListener("input", () => {
      clearTimeout(t);
      const q = $("q").value.trim();
      if(!q){
        $("resultsCard").innerHTML=`<div class="row"><div class="small">Kezdj el gépelni…</div></div>`;
        return;
      }
      t = setTimeout(() => runSearch(q), 180);
    });

    function esc(s){
      return (s||"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
    }

    async function runSearch(q){
      const data = await api(`/api/search?q=${encodeURIComponent(q)}`);
      const stops = data.stops || [];
      const routes = data.routes || [];

      let html = "";
      if(stops.length){
        html += `<div class="row" style="background:rgba(255,255,255,.02)"><div class="small">Megállók</div></div>`;
        for(const s of stops){
          html += `
            <div class="row" data-stop="${esc(s.stop_id)}">
              <div style="width:34px">📍</div>
              <div class="grow">
                <div class="h2">${esc(s.stop_name || s.stop_id)}</div>
                <div class="small mono">${esc(s.stop_id)}</div>
              </div>
              <div class="iconbtn">›</div>
            </div>`;
        }
      }

      if(routes.length){
        html += `<div class="row" style="background:rgba(255,255,255,.02)"><div class="small">Járatok</div></div>`;
        for(const r of routes){
          html += `
            <div class="row">
              <div class="badge-route">${esc(r.route_short_name || "?")}</div>
              <div class="grow">
                <div class="h2">${esc(r.route_long_name || "Járat")}</div>
                <div class="small">${esc(r.agency_name || "")}</div>
              </div>
            </div>`;
        }
      }

      if(!html) html = `<div class="row"><div class="small">Nincs találat.</div></div>`;
      $("resultsCard").innerHTML = html;

      document.querySelectorAll("[data-stop]").forEach(el => {
        el.onclick = () => openStop(el.getAttribute("data-stop"));
      });
    }

    async function openStop(stopId){
      show("viewStop");
      $("stopHint").textContent = "";
      $("departuresCard").innerHTML = `<div class="row"><div class="small">Betöltés…</div></div>`;
      const s = await api(`/api/stop/${encodeURIComponent(stopId)}`);
      $("stopName").textContent = s.stop_name || stopId;
      $("stopId").textContent = stopId;
      $("stopBack").onclick = () => show("viewSearch");

      const dep = await api(`/api/stop/${encodeURIComponent(stopId)}/departures?minutes=240&limit=60&group=1`);
      const deps = dep.departures || [];

      if(dep.hint) $("stopHint").textContent = dep.hint;

      if(!deps.length){
        $("departuresCard").innerHTML = `<div class="row"><div class="small">Nincs közelgő indulás.</div></div>`;
        return;
      }

      let html = "";
      for(const d of deps){
        html += `
          <div class="row">
            <div style="width:76px">
              <div class="mono" style="font-weight:900; font-size:18px">${esc(d.scheduled_hhmm)}</div>
              <div class="small mono">${esc(String(d.minutes_to))} min</div>
            </div>
            <div class="badge-route">${esc(d.route_short_name || "?")}</div>
            <div class="grow">
              <div class="h2">${esc(d.headsign || d.route_long_name || "")}</div>
              <div class="small mono">platform: ${esc(d.served_stop_id || "")} ${d.live ? " · LIVE" : ""}</div>
            </div>
          </div>
        `;
      }
      $("departuresCard").innerHTML = html;
    }

    async function refreshPill(){
      try{
        const h = await api("/api/health");
        if(!h.liveKeyPresent){
          $("livePill").textContent = "LIVE: OFF (nincs BODS_API_KEY) · GTFS: " + (h.gtfsLoaded ? "OK" : "NO");
        }else if(h.liveLastError){
          $("livePill").textContent = `LIVE: ERROR (${h.liveLastHttpStatus||"?"}) · ${h.liveLastError} · GTFS: ${h.gtfsLoaded?"OK":"NO"}`;
        }else{
          $("livePill").textContent = `LIVE: ON (${h.liveVehicleCount}) · GTFS: ${h.gtfsLoaded?"OK":"NO"}`;
        }
      }catch(e){
        $("livePill").textContent = "LIVE: ? · GTFS: ?";
      }
    }

    refreshPill();
    setInterval(refreshPill, 15000);
  </script>
</body>
</html>
